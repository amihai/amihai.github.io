<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebe - Aventura lui Capi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--pink:#ff5ea8;--purple:#8b5cf6;--green:#34d399;--ink:#3b2b57;--orange:#f97316;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;min-height:100vh;padding:12px;
    font-family:'Fredoka','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;
    color:var(--ink);background:linear-gradient(180deg,#a9e0fb,#c9edff 42%,#eaf8ff);
  }
  button{font-family:inherit;cursor:pointer;color:inherit;}
  .wrap{max-width:920px;margin:auto;}
  header,.panel,.mapcard,.speech{background:#fff;border:3px solid #fff;box-shadow:0 8px 22px rgba(139,92,246,.15);}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:22px;padding:10px 16px;}
  header h1{margin:0;font-size:clamp(18px,4.5vw,28px);color:#b45309;}
  header a{color:var(--purple);font-weight:700;text-decoration:none;white-space:nowrap;}
  header a:hover{text-decoration:underline;}
  .stars{white-space:nowrap;background:#fff7d6;border:2px solid #ffd766;border-radius:999px;padding:6px 10px;font-weight:700;position:relative;}
  .stars.bump{animation:star-bump .5s ease;}
  @keyframes star-bump{50%{transform:scale(1.25)}}
  .plus-star{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-weight:800;color:#d97706;pointer-events:none;white-space:nowrap;animation:plus-up 1.1s ease forwards;}
  @keyframes plus-up{0%{opacity:0;transform:translate(-50%,6px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
  .top-actions{display:flex;align-items:center;gap:7px;}
  .mute-btn{border:0;background:#f1ecff;border-radius:50%;width:44px;height:44px;font-size:22px;}
  @keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes jump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-30px) scale(1.06) rotate(-4deg)}55%{transform:translateY(0) scale(1)}70%{transform:translateY(-14px) rotate(3deg)}100%{transform:translateY(0)}}
  @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
  @keyframes shake-x{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}

  /* ---------- Harta ---------- */
  .mapcard{border-radius:22px;margin-top:14px;padding:8px;}
  .map-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:2px 4px 8px;}
  .chapter-badge{font-weight:800;font-size:clamp(15px,3.8vw,19px);}
  .progress{flex:1 1 160px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#6b5b92;}
  .progress-bar{display:block;flex:1;height:12px;border-radius:999px;background:#f1ecff;overflow:hidden;}
  .progress-fill{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#34d399,#fbbf24,#f97316);transition:width .8s ease;}
  .zoom-btn{border:2px solid #e6e0ff;background:#faf7ff;border-radius:12px;padding:5px 10px;font-weight:700;font-size:14px;}
  .map-wrap{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:600/1000;max-width:560px;margin:0 auto;background:#ecfccb;}
  .map-wrap.zoom{aspect-ratio:4/3;max-width:none;}
  #map{display:block;width:100%;height:100%;}
  #map text{font-family:inherit;}
  .lbl{font-size:21px;font-weight:700;fill:#3b2b57;stroke:#fff;stroke-width:5px;paint-order:stroke;stroke-linejoin:round;text-anchor:middle;}
  .deco{text-anchor:middle;dominant-baseline:central;pointer-events:none;}
  .river-flow{animation:flow 2.4s linear infinite;}
  @keyframes flow{to{stroke-dashoffset:-72}}
  .route-bg{fill:none;stroke:#fde68a;stroke-width:15;stroke-linecap:round;opacity:.9;}
  .route{fill:none;stroke:#b45309;stroke-width:3.5;stroke-dasharray:3 9;stroke-linecap:round;}
  .route.r1{stroke:#fff;}
  .route.r3{display:none;}
  .dot{fill:#fff;stroke:#a78bfa;stroke-width:3;transform-box:fill-box;transform-origin:center;transition:fill .4s;}
  .dot.done{fill:#fbbf24;stroke:#d97706;}
  .dot.next{stroke:var(--pink);stroke-width:4;animation:dot-pulse 1.1s ease-in-out infinite;}
  @keyframes dot-pulse{50%{transform:scale(1.45)}}
  .plank{fill:none;stroke:#a16207;stroke-width:2;stroke-dasharray:4 3;opacity:.7;transform-box:fill-box;transform-origin:center;}
  .plank.done{fill:#d97706;stroke:#78350f;stroke-dasharray:none;opacity:1;animation:pop .4s ease;}
  .plank.next{stroke:var(--pink);stroke-width:3;opacity:1;animation:dot-pulse 1.1s ease-in-out infinite;}
  .gift{font-size:24px;text-anchor:middle;dominant-baseline:central;transition:opacity .4s;}
  .gift.todo{opacity:.35;filter:grayscale(1);}
  #capiBob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite;}
  #capi.walking #capiBob{animation:waddle .34s ease-in-out infinite;}
  #capi.happy #capiBob{animation:jump .7s ease;}
  #capi.oops #capiBob{animation:shake .5s ease;}
  @keyframes waddle{0%,100%{transform:translateY(-3px) rotate(-5deg)}50%{transform:translateY(-3px) rotate(5deg)}}
  .capi-ripple{display:none;fill:none;stroke:#fff;stroke-width:3;opacity:.85;}
  #capi.swim .capi-ripple{display:block;}
  #capi.swim .capi-shadow{display:none;}
  .capi-shadow{fill:rgba(0,0,0,.18);}
  /* rucsacul stă lângă bula în care vorbește Capi */
  .bag{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;background:#fffbeb;border:3px solid #fde68a;border-radius:18px;
    padding:7px 12px;box-shadow:0 6px 16px rgba(180,83,9,.12);}
  .bag-title{font-weight:700;font-size:13px;color:#92400e;white-space:nowrap;}
  .bag-items{display:flex;gap:4px;}
  .bag span.g{font-size:24px;line-height:1;transition:opacity .4s,filter .4s;}
  .bag span.g.todo{opacity:.3;filter:grayscale(1);}
  .bag span.g.new{animation:jump .9s ease;}

  /* ---------- Capi vorbește ---------- */
  .speech-row{display:flex;align-items:center;gap:12px;max-width:860px;margin:14px auto 0;}
  .capi-face{flex:none;width:clamp(56px,14vw,72px);height:clamp(56px,14vw,72px);border-radius:50%;object-fit:cover;
    border:4px solid #fff;box-shadow:0 4px 12px rgba(180,83,9,.3);animation:bob 2.6s ease-in-out infinite;}
  .capi-face.oops{animation:shake .5s ease;}
  .capi-face.happy{animation:jump .7s ease;}
  .speech{position:relative;flex:1;text-align:center;border-color:#f59e0b;border-radius:18px;
    padding:12px 16px;font-size:clamp(15px,3.4vw,19px);font-weight:500;animation:pop .3s ease;}
  .speech::before{content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);border:8px solid transparent;border-right-color:#f59e0b;}

  /* ---------- Panoul cu întrebarea ---------- */
  .panel{border-radius:26px;margin-top:14px;padding:18px 12px 24px;text-align:center;min-height:320px;overflow-x:clip;}
  .panel h2{font-size:clamp(17px,4vw,22px);margin:0 0 10px;color:#8545cf;}
  .question{font-size:clamp(18px,4.2vw,24px);font-weight:700;margin:6px auto 10px;max-width:680px;line-height:1.35;}
  .story{max-width:640px;margin:0 auto 6px;font-size:clamp(16px,3.8vw,20px);font-weight:600;color:#5b4d80;line-height:1.45;}
  .answers,.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px auto;}
  .ans,.tile{border:3px solid #e6e0ff;border-radius:18px;background:#fff;min-width:70px;min-height:60px;padding:9px 14px;
    font-size:clamp(22px,5vw,28px);font-weight:700;box-shadow:0 5px 0 #ded6ff;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;}
  .ans small{font-size:13px;font-weight:700;color:#7c6aa8;}
  .ans.wide{font-size:clamp(18px,4.6vw,24px);}
  .ans:hover:not(:disabled),.tile:hover:not(:disabled){border-color:var(--pink);}
  .ans:disabled,.tile:disabled{cursor:default;}
  .ans.correct,.tile.correct{background:#d7fbe8;border-color:var(--green);box-shadow:0 5px 0 #79e0b3;}
  .ans.wrong,.tile.wrong{background:#ffe0e6;border-color:#e23e8c;animation:shake-x .4s ease;}
  .tile.used{opacity:.25;}
  .controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:20px;}
  .controls button{border:0;border-radius:16px;padding:10px 18px;font-size:16px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.14);}
  .hint-btn{background:linear-gradient(90deg,#fbbf24,#fb923c);}
  .hint-box{margin:16px auto 0;max-width:580px;text-align:left;background:#fffbe9;border:3px solid #fbbf24;border-radius:18px;padding:14px 16px;font-size:17px;line-height:1.5;}
  .rules{margin:8px 0 0;padding-left:20px;}
  .rules li{margin:4px 0;}
  [hidden]{display:none!important;}
  .result-line{display:inline-block;margin:14px auto 0;font-size:clamp(17px,4.2vw,23px);font-weight:700;color:#065f46;
    background:#e9fbf2;border:3px solid var(--green);border-radius:16px;padding:8px 14px;animation:pop .3s ease;}
  footer{text-align:center;margin:18px 0;color:#8175a7;font-size:13px;line-height:1.5;}
  footer a{color:#8175a7;}

  /* ---------- Egalități colorate + tastatură ---------- */
  .eq{display:flex;align-items:flex-start;justify-content:center;gap:clamp(6px,2vw,14px);flex-wrap:wrap;margin:6px auto;}
  .eq .n{display:flex;flex-direction:column;align-items:center;min-width:1.6em;}
  .eq .v,.eq .o{font-size:clamp(28px,7.5vw,42px);font-weight:800;line-height:1.2;}
  .eq .v{color:var(--kc,var(--ink));}
  .eq .o{color:#a78bfa;}
  .eq .l{font-size:clamp(11px,2.8vw,13px);font-weight:700;color:var(--kc,#7c6aa8);}
  .eq.small .v,.eq.small .o{font-size:clamp(22px,5.6vw,30px);}
  .eq .hl .v{background:#ffe1f0;border-radius:12px;padding:0 8px;box-shadow:0 0 0 3px #f9a8d4;}
  .ka{--kc:#0284c7;} .kb{--kc:#7c3aed;} .ks{--kc:#db2777;}
  .eq .slot{display:inline-block;min-width:2.4em;padding:0 8px;border:3px dashed #c8b5f8;border-radius:12px;background:#fdfcff;color:#b9a6f3;text-align:center;}
  .eq .slot.typing{color:var(--ink);border-style:solid;border-color:var(--purple);}
  .eq .slot.ok{border-style:solid;border-color:var(--green);background:#eafaf0;color:#065f46;animation:pop .3s ease;}
  .eq .slot.bad{animation:shake-x .4s ease;}
  .pu{--c:#0ea5e9;--cl:#dff4ff;}
  .pt{--c:#8b5cf6;--cl:#ede4ff;}
  .ph{--c:#ec4899;--cl:#ffe1f0;}
  .eq .slot.digits{display:inline-flex;gap:5px;min-width:0;padding:0;border:none;background:none;}
  .eq .slot .nd{display:inline-flex;flex-direction:column;align-items:center;min-width:1.05em;padding:0 5px;
    border:3px dashed var(--c);border-radius:12px;background:#fff;color:var(--c);opacity:.5;}
  .eq .slot .nd b{font-weight:800;line-height:1.1;}
  .eq .slot .nd i{font-style:normal;font-size:12px;font-weight:800;line-height:1;margin-bottom:3px;}
  .eq .slot .nd.fill{opacity:1;border-style:solid;background:var(--cl);}
  .eq .slot .nd.cur{opacity:1;border-style:solid;box-shadow:0 0 0 4px var(--cl);animation:nd-pulse 1s ease-in-out infinite;}
  .eq .slot.ok .nd{border-color:var(--green);}
  @keyframes nd-pulse{50%{transform:translateY(-3px)}}
  .nd-guide{margin:8px auto 0;font-weight:800;color:#6d5a9e;font-size:clamp(14px,3.4vw,17px);min-height:1.2em;}
  .step{margin:12px auto 0;max-width:620px;padding:10px 12px;border-radius:18px;background:#faf7ff;border:3px solid #ece4ff;animation:pop .3s ease;}
  .step h3{margin:0 0 4px;font-size:clamp(15px,3.6vw,19px);}
  .step .answers{margin:8px auto 4px;}
  .step.done{background:#f3fcf7;border-color:#c8f5dc;}
  .step.done .numpad,.step.done .nd-guide{display:none;}
  .numpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:270px;margin:10px auto 2px;}
  .keypad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:360px;margin:12px auto 0;}
  .key{border:3px solid #e6e0ff;border-radius:14px;background:#fff;height:54px;font-size:26px;font-weight:800;box-shadow:0 4px 0 #ded6ff;}
  .key:active{transform:translateY(2px);box-shadow:0 2px 0 #ded6ff;}
  .key.ok{background:#d1fae5;border-color:#34d399;box-shadow:0 4px 0 #6ee7b7;}
  .key.del{background:#fff1f2;border-color:#fecdd3;box-shadow:0 4px 0 #fecdd3;}
  .key.wrong{background:#ffe0e6;border-color:#e23e8c;animation:shake-x .4s ease;}
  .numpad.off,.keypad.off{opacity:.45;pointer-events:none;}

  /* ---------- Calcul în coloană ---------- */
  .colop{--cw:clamp(42px,11vw,58px);display:inline-grid;gap:2px 5px;margin:4px auto;font-size:clamp(28px,7.6vw,42px);font-weight:800;}
  .colop .cell{height:1.3em;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background .2s;}
  .colop .hd{font-size:13px;height:auto;color:var(--c);padding:2px 0;}
  .colop .cr{font-size:.45em;height:1.1em;color:#e11d48;}
  .colop .cr.on{animation:pop .3s ease;}
  .colop .sign{color:var(--purple);justify-content:flex-start;align-items:flex-start;font-size:.8em;}
  .colop .bar{grid-column:1/-2;height:5px;background:var(--ink);border-radius:3px;margin:2px 0;}
  .colop .res{border:3px dashed #c8b5f8;}
  .colop .res.filled{border-style:solid;border-color:var(--green);background:#eafaf0;animation:pop .25s ease;}
  .colop .act{background:var(--cl);}
  .colop .res.act{border-color:var(--c);border-style:solid;}
  .card{display:inline-block;background:#faf7ff;border:3px solid #ece4ff;border-radius:20px;padding:8px 14px;margin:4px auto;}
  .card.water{background:linear-gradient(180deg,#e0f2fe,#bae6fd);border-color:#7dd3fc;}
  .card.rock{background:linear-gradient(180deg,#f5f5f4,#e7e5e4);border-color:#d6d3d1;}
  .card.wood{background:linear-gradient(180deg,#fef3c7,#fde68a);border-color:#f59e0b;}
  .card.leaf{background:linear-gradient(180deg,#ecfccb,#d9f99d);border-color:#a3e635;}

  /* ---------- Pădurea ---------- */
  .items{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:6px auto;}
  .ibox{display:grid;grid-template-columns:repeat(5,auto);gap:2px 6px;padding:8px 10px;border-radius:16px;background:#f0fdf4;border:3px dashed #86efac;
    font-size:clamp(24px,6.4vw,34px);line-height:1.15;align-content:start;}
  .ibox span{animation:pop .35s ease backwards;}
  .pv{display:flex;justify-content:center;gap:clamp(12px,4vw,30px);flex-wrap:wrap;margin:6px auto 4px;}
  .pv-g{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:80px;}
  .pv-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:flex-end;max-width:170px;min-height:46px;}
  .pv-h{width:clamp(36px,9vw,46px);aspect-ratio:1;border:2px solid #be185d;border-radius:3px;
    background:linear-gradient(rgba(190,24,93,.45) 1px,transparent 1px) 0 0/10% 10%,linear-gradient(90deg,rgba(190,24,93,.45) 1px,transparent 1px) 0 0/10% 10%,#fbcfe8;}
  .pv-t{width:clamp(8px,2vw,10px);height:clamp(36px,9vw,46px);border:2px solid #6d28d9;border-radius:2px;
    background:linear-gradient(rgba(109,40,217,.5) 1px,transparent 1px) 0 0/100% 10%,#ddd6fe;}
  .pv-u{width:clamp(9px,2.2vw,11px);height:clamp(9px,2.2vw,11px);border:2px solid #0369a1;border-radius:2px;background:#7dd3fc;}
  .pv-lab{font-weight:800;font-size:14px;color:var(--c);}
  .pv-none{font-size:13px;color:#8a7fb5;font-weight:700;align-self:center;}
  .axis{position:relative;max-width:640px;height:104px;margin:8px auto;}
  .axis-line{position:absolute;left:2%;right:1%;top:42px;height:5px;background:var(--ink);border-radius:3px;}
  .axis-line::after{content:"";position:absolute;right:-4px;top:50%;transform:translateY(-50%);border:9px solid transparent;border-left-color:var(--ink);border-right:0;}
  .tick{position:absolute;top:32px;width:4px;height:25px;background:var(--ink);transform:translateX(-50%);border-radius:2px;}
  .tick.small{top:37px;height:15px;width:3px;background:#8a7fb5;}
  .tick-lab{position:absolute;top:64px;transform:translateX(-50%);font-weight:800;font-size:clamp(13px,3.6vw,20px);white-space:nowrap;}
  .tick-lab.q{background:#ffe1f0;color:#be185d;border:2px dashed #ec4899;border-radius:10px;padding:0 8px;}
  .marker{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;}
  .marker b{background:#f97316;color:#fff;border-radius:10px;padding:0 8px;font-size:clamp(14px,3.6vw,19px);}
  .marker i{width:0;height:0;border:7px solid transparent;border-top-color:#f97316;}
  .order-slots{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px auto 4px;}
  .oslot{min-width:clamp(58px,15vw,78px);height:56px;border:3px dashed #c8b5f8;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:clamp(20px,5vw,26px);font-weight:800;background:#fdfcff;}
  .oslot.filled{border-style:solid;border-color:var(--green);background:#eafaf0;animation:pop .3s ease;}
  .oslot.cur{border-color:var(--pink);}
  .osep{font-size:24px;font-weight:800;color:#a78bfa;}

  /* ---------- Muntele: bani și balanță ---------- */
  .shop{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:6px 0;}
  .item{background:#fff7ed;border:3px solid #fed7aa;border-radius:18px;padding:8px 14px;min-width:104px;}
  .item .em{font-size:44px;line-height:1.1;}
  .item .price{display:inline-block;margin-top:4px;background:#fde047;border-radius:8px;padding:2px 8px;font-weight:800;}
  .item.wallet{background:#f5f3ff;border-color:#ddd6fe;}
  .bills{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 4px;}
  .bill{display:inline-flex;align-items:center;justify-content:center;width:86px;height:44px;border-radius:8px;border:3px solid;
    font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.15);padding:0;}
  .bill.b100{background:linear-gradient(135deg,#dbeafe,#93c5fd);border-color:#3b82f6;color:#1e3a8a;}
  .bill.b10{background:linear-gradient(135deg,#ffe4e6,#fda4af);border-color:#e11d48;color:#881337;}
  .bill.b1{background:linear-gradient(135deg,#dcfce7,#86efac);border-color:#16a34a;color:#14532d;}
  .bills .bill:active{transform:translateY(2px);box-shadow:none;}
  .tray{min-height:84px;max-width:620px;margin:6px auto;border:3px dashed #c8b5f8;border-radius:18px;padding:10px;
    display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;background:#fdfcff;}
  .tray-empty{color:#8a7fb5;font-size:15px;}
  .tray-row{display:flex;flex-wrap:wrap;justify-content:center;padding-right:12px;}
  .tray .bill{width:60px;height:32px;font-size:12px;margin-right:-12px;border-width:2px;animation:pop .25s ease;}
  .reading{font-size:clamp(17px,4vw,21px);font-weight:700;margin:6px 0 0;}
  .go-btn{border:0;border-radius:16px;padding:12px 26px;font-size:19px;font-weight:800;color:#fff;
    background:linear-gradient(90deg,#34d399,#10b981);box-shadow:0 5px 0 #059669;margin-top:10px;}
  .go-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #059669;}
  .scale{position:relative;width:min(440px,100%);height:150px;margin:4px auto 0;}
  .scale .beam{position:absolute;left:14%;right:14%;top:30px;height:9px;background:var(--purple);border-radius:6px;}
  .scale .post{position:absolute;left:50%;top:34px;bottom:14px;width:10px;margin-left:-5px;background:#7c3aed;border-radius:6px;}
  .scale .foot{position:absolute;left:50%;bottom:0;width:110px;margin-left:-55px;height:18px;background:#7c3aed;border-radius:12px 12px 6px 6px;}
  .scale .pivot{position:absolute;left:50%;top:24px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fbbf24;border:3px solid #fff;z-index:2;}
  .scale .pan{position:absolute;top:38px;width:clamp(120px,34vw,160px);display:flex;flex-direction:column;align-items:center;}
  .scale .pan.l{left:14%;transform:translateX(-50%);}
  .scale .pan.r{right:14%;transform:translateX(50%);}
  .scale .strings{width:76%;height:56px;border:2px solid #a78bfa;border-bottom:0;border-radius:50% 50% 0 0/40% 40% 0 0;display:flex;align-items:flex-end;justify-content:center;}
  .scale .load{background:#fff;border:3px solid #c4b5fd;border-radius:12px;padding:2px 8px;margin-bottom:2px;font-size:clamp(15px,4.2vw,21px);font-weight:800;white-space:nowrap;}
  .scale .plate{width:100%;height:12px;background:linear-gradient(180deg,#fde68a,#f59e0b);border-radius:0 0 50% 50%/0 0 100% 100%;}

  /* ---------- Podul lui Calculo ---------- */
  .robot{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px auto 6px;flex-wrap:wrap;}
  .robot-face{font-size:clamp(52px,14vw,72px);line-height:1;animation:bob 2.2s ease-in-out infinite;}
  .robot-say{background:#eef2ff;border:3px solid #818cf8;border-radius:18px;padding:6px 16px;}
  .robot-say small{display:block;font-size:14px;font-weight:600;color:#6366f1;}
  .robot-say .eq{margin:0;}
  .robot-say .riddle{font-size:clamp(17px,4.2vw,22px);font-weight:700;max-width:420px;}
  .house{width:min(360px,100%);margin:6px auto 0;}
  .roof{position:relative;height:clamp(110px,28vw,140px);background:linear-gradient(180deg,#fb7185,#e11d48);clip-path:polygon(50% 0,100% 100%,0 100%);}
  .rn{position:absolute;transform:translate(-50%,-50%);background:#fff;border:4px solid var(--kc);color:var(--kc);
    border-radius:999px;padding:2px 12px;font-size:clamp(18px,5vw,26px);font-weight:800;min-width:2.4em;text-align:center;}
  .rn.pos-s{left:50%;top:52%;} .rn.pos-a{left:30%;top:82%;} .rn.pos-b{left:70%;top:82%;}
  .walls{height:46px;background:linear-gradient(180deg,#fef3c7,#fde68a);border:4px solid #f59e0b;border-top:0;border-radius:0 0 14px 14px;
    display:flex;align-items:center;justify-content:center;font-size:30px;}
  .shapes-area{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:560px;margin:8px auto;padding:12px;border-radius:20px;
    background:linear-gradient(180deg,#fef3c7,#fde68a);border:3px solid #f59e0b;}
  .shape-btn{border:3px solid transparent;background:#fff;border-radius:16px;padding:6px;box-shadow:0 4px 0 rgba(0,0,0,.08);line-height:0;}
  .shape-btn:hover:not(:disabled){border-color:var(--pink);}
  .shape-btn.correct{border-color:var(--green);background:#d7fbe8;animation:pop .3s ease;}
  .shape-btn.wrong{border-color:#e23e8c;background:#ffe0e6;animation:shake-x .4s ease;}
  .shape-big{display:inline-block;padding:12px;border-radius:22px;background:#fff7ed;border:3px solid #fed7aa;line-height:0;}
  .counter{display:inline-block;margin-top:4px;font-weight:800;background:#f1ecff;border-radius:999px;padding:4px 14px;}

  /* ---------- Livada ---------- */
  .branches{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px auto;}
  .branch{display:flex;align-items:flex-end;gap:2px;padding:0 10px 4px 6px;border-bottom:9px solid #92400e;border-radius:0 0 26px 6px;font-size:clamp(24px,6.4vw,32px);line-height:1;animation:pop .4s ease backwards;}
  .branch .lf{font-size:.8em;}
  .baskets{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:22px 12px;margin:22px auto 6px;max-width:680px;}
  .basket{position:relative;display:grid;gap:1px 2px;justify-content:center;align-content:center;
    min-width:clamp(78px,21vw,104px);min-height:clamp(60px,15vw,74px);padding:8px 8px 10px;
    background:repeating-linear-gradient(90deg,#fcd9a0 0 8px,#f8c77c 8px 16px);
    border:4px solid #d97706;border-radius:12px 12px 30px 30px;box-shadow:0 5px 0 #b45309;
    font-size:clamp(16px,4.4vw,22px);line-height:1.15;animation:pop .4s ease backwards;}
  .basket::before{content:"";position:absolute;left:18%;right:18%;top:-22px;height:24px;border:5px solid #b45309;border-bottom:0;border-radius:40px 40px 0 0;}
  .basket .gone{opacity:.25;filter:grayscale(1);}
  .stones{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;margin:10px auto;max-width:660px;}
  .stone{width:clamp(50px,13vw,64px);height:clamp(42px,11vw,52px);border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:clamp(17px,4.4vw,22px);background:radial-gradient(circle at 35% 30%,#fafaf9,#d6d3d1 60%,#a8a29e);box-shadow:0 4px 0 #78716c;}
  .stone.q{background:#ffe1f0;color:#be185d;border:3px dashed #ec4899;box-shadow:none;}
  .stone.q.cur{animation:nd-pulse 1s ease-in-out infinite;border-style:solid;}
  .stone.ok{background:#d7fbe8;color:#065f46;border:3px solid var(--green);animation:pop .3s ease;}
  .hopl{font-size:12px;font-weight:800;color:#7c3aed;}
  .orchard{display:inline-flex;flex-direction:column;gap:4px;padding:10px 14px;border-radius:20px;background:linear-gradient(180deg,#d9f99d,#bef264);border:4px solid #65a30d;margin:6px auto;}
  .orchard div{display:flex;gap:clamp(2px,1vw,6px);justify-content:center;font-size:clamp(22px,6vw,32px);line-height:1.1;}

  /* ---------- Ecrane de poveste ---------- */
  .ov{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:14px;
    background:rgba(59,43,87,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
  .ov-card{background:#fff;border-radius:28px;max-width:560px;width:100%;max-height:calc(100vh - 28px);overflow:auto;padding:20px 18px 22px;
    text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .35s ease;}
  .ov-card .hero{width:clamp(120px,34vw,160px);height:clamp(120px,34vw,160px);border-radius:50%;object-fit:cover;border:6px solid #fde68a;

  .ov-card .photo{display:block;width:100%;border-radius:20px;border:5px solid #fde68a;}
  .ov-card h2{margin:10px 0 6px;font-size:clamp(22px,5.6vw,30px);color:#b45309;}
  .ov-card p{margin:8px 0;font-size:clamp(16px,3.9vw,19px);line-height:1.5;}
  .ov-card .big-gift{font-size:64px;line-height:1;animation:jump .9s ease;}
  .trail{display:flex;justify-content:center;align-items:center;gap:4px;flex-wrap:wrap;font-size:clamp(20px,5vw,26px);margin:8px 0;}
  .trail span.arr{font-size:16px;color:#a78bfa;}
  .ov-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .alt-btn{display:inline-flex;align-items:center;border:3px solid #e6e0ff;border-radius:16px;padding:10px 18px;font-size:16px;font-weight:700;background:#fff;text-decoration:none;color:var(--purple);}
  .diploma{margin-top:12px;border:5px double #f59e0b;background:#fffbeb;border-radius:18px;padding:12px;}
  .diploma h3{margin:0 0 4px;font-size:22px;color:#b45309;letter-spacing:1px;}

  /* ---------- Capi înoată (la fiecare 10 stele) ---------- */
  .swim-layer{position:fixed;inset:0;z-index:48;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .5s;}
  .swim-layer.on{opacity:1;}
  .swim-water{position:absolute;inset:0;background:linear-gradient(180deg,rgba(56,189,248,0) 34%,rgba(56,189,248,.16) 60%,rgba(14,165,233,.26) 100%);}
  .swimmer{position:absolute;top:40%;left:0;width:130px;height:130px;animation:swim-across 10s linear forwards,swim-bob 1.1s ease-in-out infinite;}
  .swimmer img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.25);}
  .swimmer .orange{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:42px;}
  .swimmer .splash{position:absolute;left:-14%;right:-14%;bottom:-12px;height:34px;border-radius:50%;background:rgba(255,255,255,.65);}
  @keyframes swim-across{from{transform:translateX(-26vw)}to{transform:translateX(126vw)}}
  @keyframes swim-bob{0%,100%{margin-top:0}50%{margin-top:-12px}}

  /* Cer cu nori */
  .sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;}
  .cloud-wrap{position:absolute;left:0;animation:drift linear infinite;will-change:transform;}
  .cloud{position:relative;width:130px;height:42px;background:#fff;border-radius:42px;opacity:.85;filter:blur(1px);}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
  .cloud::before{width:58px;height:58px;top:-26px;left:20px;}
  .cloud::after{width:42px;height:42px;top:-18px;left:66px;}
  @keyframes drift{from{transform:translateX(-35vw)}to{transform:translateX(135vw)}}
  .confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:58;}
  .confetti-piece{position:absolute;top:-24px;width:11px;height:15px;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{0%{transform:translateY(-24px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:.9}}
  /* Desktop: harta-portret în stânga, cât ecranul de înaltă (rămâne pe loc la derulare), provocările în dreapta */
  @media(min-width:1000px){
    .wrap{max-width:1440px;}
    .layout{--maph:clamp(480px,100vh - 150px,1100px);display:grid;grid-template-columns:calc(var(--maph) * .6 + 22px) minmax(0,1fr);
      gap:18px;align-items:start;}
    .side{position:sticky;top:12px;}
    .side .map-wrap{max-width:none;}
    .zoom-btn{display:none;}
  }
  @media(max-width:520px){
    .speech-row{flex-wrap:wrap;}
    .bag{flex:1 1 100%;flex-direction:row;justify-content:center;}
    header{flex-wrap:wrap;}
    .top-actions{margin-left:auto;}
    .ans,.tile{min-width:60px;padding:8px 10px;}
    .scale .beam{left:20%;right:20%;}
    .scale .pan.l{left:20%;} .scale .pan.r{right:20%;}
  }
</style>
</head>

  // tastatură pentru un număr. Rezultatele directe se scriu normal, de la stânga la dreapta.
  // Doar la calcule (rtl=true) scriem ca în coloană: întâi unitățile, apoi zecile, apoi sutele.
  var ND_CLS=['pu','pt','ph'], ND_LETTER=['U','Z','S'];
  var ND_GEN=['unităților','zecilor','sutelor'];
  function numPad(container,slot,expected,onRight,wrongMsg,rtl){
    var len=String(expected).length, typed=[], done=false, boxes=[];
    var guide=el('div','nd-guide');
    var pad=el('div','numpad');
    slot.replaceChildren();
    slot.classList.add('digits');
    for(var i=len-1;i>=0;i--){
      var b=el('span','nd '+ND_CLS[i]);
      b.appendChild(el('b',null,'?'));
      b.appendChild(el('i',null,ND_LETTER[i]));
      slot.appendChild(b);
      boxes[i]=b;
    }
    // ordinul (0 = unități) în care intră a k-a cifră tastată
    function place(k){return rtl?k:len-1-k;}
    function render(){
      boxes.forEach(function(b,i){
        var k=place(i);
        b.firstChild.textContent=k<typed.length?String(typed[k]):'?';
        b.classList.toggle('fill',k<typed.length);
        b.classList.toggle('cur',!done && k===typed.length);
      });
      slot.classList.toggle('typing',typed.length>0);
      guide.textContent=done?'':typed.length<len?'Scrie cifra '+ND_GEN[place(typed.length)]+' ✏️':'Gata? Apasă ✔';
    }
    function value(){return typed.reduce(function(s,d,k){return s+d*Math.pow(10,place(k));},0);}
    function press(k){
      if(locked || done) return;
      if(k==='del'){typed.pop();render();return;}
      if(k==='ok'){
        if(typed.length<len){say('Mai scrie cifra '+ND_GEN[place(typed.length)]+'! 🔢');return;}
        var v=value();
        if(v===expected){
          done=true;
          keyHandler=null;
          slot.classList.remove('typing');
          slot.classList.add('ok');
          pad.classList.add('off');
          render();
          tick();
          onRight();
        } else {
          fail(wrongMsg(v));
          slot.classList.remove('bad');void slot.offsetWidth;slot.classList.add('bad');
          typed=[];render();
        }
        return;
      }
      if(typed.length>=len) return;
      typed.push(Number(k));
      tick();
      render();
    }
    ['1','2','3','4','5','6','7','8','9','del','0','ok'].forEach(function(k){
      var label=k==='del'?'⌫':k==='ok'?'✔':k;
      var b=btn('key'+(k==='ok'?' ok':k==='del'?' del':''),label,function(){press(k);});

      if(k==='ok') b.setAttribute('aria-label','Gata');
      pad.appendChild(b);
    });

      else if(e.key==='Enter'){e.preventDefault();press('ok');}
    };

  }

  function mulHelp(a,b,v){

    if(v===a+b && v!==a*b) return 'Atenție: '+a+' + '+b+' = '+v+'. Noi înmulțim, nu adunăm! ✖️';
    var s=[];for(var i=1;i<=Math.min(2,a-1);i++) s.push(b*i);

  // ---------- Calcul în coloană (cifrele se scriu de la unități) ----------
  var PCLS=['pu','pt','ph'], PLACE=['unități','zeci','sute'], PLACE_LETTER=['U','Z','S'];
  function columnSteps(x,op,y,W){
    var steps=[],cin=0,yLen=String(y).length;
    for(var q=0;q<W;q++){
      var xd=digitAt(x,q),yd=digitAt(y,q),hasY=q<yLen,d,cout,txt,ask;
      if(op==='+'){
        var tot=xd+yd+cin;
        d=tot%10;cout=tot>=10?1:0;
        if(!hasY && !cin) ask=txt='Nu avem ce aduna: coborâm cifra '+xd+'.';
        else {
          var expr=xd+(hasY?' + '+yd:'')+(cin?' + 1 (ținut în minte)':'');
          ask=expr+' = ?';
          txt=expr+' = '+tot+(cout?' → scriem '+d+' și ținem 1 în minte.':'.');
        }
      } else {
        var top=xd-cin,pre='';
        if(cin && xd===0) pre='Aici era 0 și a dat 1 mai departe, așa că împrumută și el 1 din stânga: are acum 9. ';
        else if(cin) pre='Am împrumutat 1 de aici, deci '+xd+' a devenit '+top+'. ';
        if(top>=0 && top-yd<0){
          d=top-yd+10;cout=1;
          ask=pre+'Nu putem scădea '+yd+' din '+top+': împrumutăm 1 din stânga. '+(top+10)+' − '+yd+' = ?';
          txt=pre+'Nu putem scădea '+yd+' din '+top+': împrumutăm 1 din stânga. '+(top+10)+' − '+yd+' = '+d+'.';
        } else if(top<0){
          d=9-yd;cout=1;
          ask=pre+'9 − '+yd+' = ?';
          txt=pre+'9 − '+yd+' = '+d+'.';
        } else {
          d=top-yd;cout=0;
          if(hasY){ask=pre+top+' − '+yd+' = ?';txt=pre+top+' − '+yd+' = '+d+'.';}
          else ask=txt=pre+(cin?'Scriem '+top+'.':'Nu avem ce scădea: coborâm cifra '+xd+'.');
        }
      }
      steps.push({d:d,cout:cout,txt:txt,ask:ask});
      cin=cout;
    }
    return steps;
  }
  function columnTask(container,x,op,y,onDone){
    var r=calc(x,op,y);

    var grid=el('div','colop');
    grid.style.gridTemplateColumns='repeat('+(W+1)+',var(--cw))';
    var cols=[],carry=[],res=[],j;
    for(j=0;j<W;j++) cols.push([]);
    function cell(cls,text,col){
      var c=el('div','cell '+cls+(col!=null?' '+PCLS[W-1-col]:''),text);
      if(col!=null) cols[col].push(c);
      grid.appendChild(c);
      return c;
    }
    // ca în manualele din România: semnul stă în dreapta sus, lângă primul număr
    function digitRow(n,signText){
      var s=String(n);
      for(var k=0;k<W;k++){var idx=k-(W-s.length);cell('',idx>=0?s[idx]:'',k);}
      cell('sign',signText,null);
    }
    for(j=0;j<W;j++) cell('hd',PLACE_LETTER[W-1-j],j);
    cell('hd','',null);
    for(j=0;j<W;j++) carry.push(cell('cr','',j));
    cell('cr','',null);
    digitRow(x,sym(op));
    digitRow(y,'');
    grid.appendChild(el('div','bar'));
    grid.appendChild(el('div'));
    for(j=0;j<W;j++) res.push(cell('res','',j));
    cell('','',null);
    visual.appendChild(inCard(grid,'rock'));
    var steps=columnSteps(x,op,y,W), L=String(r).length, q=0, wrongHere=0;
    for(var e=L;e<W;e++) res[W-1-e].classList.remove('res');
    function col(){return W-1-q;}
    function stepText(){return 'La '+PLACE[q]+': '+(wrongHere>0?steps[q].txt:steps[q].ask);}
    function highlight(){
      cols.forEach(function(list,i){list.forEach(function(c){c.classList.toggle('act',q<L && i===col());});});
      if(q<L) say((q===0?'Începem cu unitățile! ':'')+stepText());
    }
    var pad=el('div','keypad'), keys=[];
    function press(d,k){
      if(locked || q>=L) return;
      if(d===steps[q].d){
        res[col()].textContent=String(d);
        res[col()].classList.add('filled');
        if(steps[q].cout && col()>0){
          var cr=carry[col()-1];
          cr.textContent=op==='+'?'1':'−1';
          cr.classList.add('on');
        }
        tick();
        wrongHere=0;
        pad.querySelectorAll('.wrong').forEach(function(w){w.classList.remove('wrong');});
        q++;
        highlight();
        if(q>=L){pad.classList.add('off');keyHandler=null;onDone(r);}
      } else {
        wrongHere++;
        if(k){k.classList.remove('wrong');void k.offsetWidth;k.classList.add('wrong');}
        fail('Hmm, nu e '+d+'. '+stepText());
      }
    }
    for(var dd=0;dd<=9;dd++){
      (function(d){
        var k=btn('key',String(d),function(){press(d,k);});
        keys[d]=k;
        pad.appendChild(k);
      })(dd);
    }
    container.appendChild(pad);
    keyHandler=function(ev){if(/^[0-9]$/.test(ev.key)) press(Number(ev.key),keys[Number(ev.key)]);};
    highlight();
  }

  function orderTask(container,nums,asc,placeName,onDone){
    var sorted=nums.slice().sort(function(a,b){return asc?a-b:b-a;});
    var row=el('div','order-slots'), slots=[], k=0;
    sorted.forEach(function(_,i){
      if(i>0) row.appendChild(el('span','osep',asc?'<':'>'));
      slots.push(row.appendChild(el('div','oslot'+(i===0?' cur':''),'')));
    });
    container.appendChild(row);
    var tiles=el('div','tiles');
    shuffle(nums.slice()).forEach(function(n){
      var t=btn('tile',String(n),function(){
        if(locked || t.disabled) return;
        if(n===sorted[k]){
          slots[k].textContent=String(n);
          slots[k].classList.remove('cur');
          slots[k].classList.add('filled');
          t.disabled=true;
          t.classList.add('used');
          k++;
          tick();
          if(k<sorted.length) slots[k].classList.add('cur');
          else onDone(sorted);
        } else {
          t.classList.remove('wrong');void t.offsetWidth;t.classList.add('wrong');
          fail('Nu încă! Caută cel mai '+(asc?'MIC':'MARE')+' număr dintre cele rămase. Compară întâi '+placeName+'. 🔍');

    });

    var VAL=[100,10,1], tray=[0,0,0];

    var hid=shuffle([2,3,4,5]).slice(0,2).sort(function(a,b){return a-b;});
    storyQ('Capi sare din '+n+' în '+n+' pe pietrele din livadă. 🐾','Ce numere lipsesc de pe pietre?');
    var row=el('div','stones'), stones=[];
    vals.forEach(function(v,k){
      if(k>0) row.appendChild(el('span','hopl','+'+n));
      var q=hid.indexOf(k)>=0, s=el('div','stone'+(q?' q':''),q?'?':String(v));
      stones.push(s);
      row.appendChild(s);
    });
    visual.appendChild(row);
    hint='Fiecare săritură adaugă '+n+'. Pornește de la numărul de dinainte și adună '+n+'.';
    var cur=0, box=el('div','step');
    activity.appendChild(box);
    function ask(){
      var k=hid[cur], v=vals[k];
      stones[k].classList.add('cur');
      box.replaceChildren(el('h3',null,cur===0?'Ce număr e pe prima piatră cu „?”':'Și pe a doua piatră cu „?”'));
      choices(box,numberOptions(v,[1,-1,2,-2,n,-n],0,100).map(function(c){
        return {label:String(c),ok:c===v,why:'Mai socotește: '+vals[k-1]+' + '+n+' = ? 🐾'};
      }),function(){
        stones[k].textContent=String(v);
        stones[k].classList.remove('q','cur');
        stones[k].classList.add('ok');
        boing();
        cur++;
        if(cur<hid.length) setTimeout(function(){if(!locked) ask();},350);
        else solved('Din '+n+' în '+n+': '+vals.join(', ')+' ✔');
      });
    }
    ask();
    say('Hop! Din '+n+' în '+n+'! 🐾');
  });
  Q.push(function(){ // 44. rânduri de pomi
    var r=rand(2,5), c=rand(3,6);
    if(r===c) c++;
    storyQ('În livadă, portocalii 🌳 sunt plantați pe '+r+' rânduri, câte '+c+' pe fiecare rând.','Câți portocali sunt în livadă?');
    var orch=el('div','orchard');
    for(var i=0;i<r;i++){
      var line=el('div');
      for(var j=0;j<c;j++) line.appendChild(el('span',null,'🌳'));
      orch.appendChild(line);
    }
    visual.appendChild(orch);
    hint='Sunt '+r+' rânduri cu câte '+c+' pomi: „de '+r+' ori câte '+c+'”. Poți număra din '+c+' în '+c+'.';
    calcPad(activity,r,'*',c,function(){solved(mul(r,c)+' = '+r*c+' portocali 🌳 ✔');},{keys:['a','b','s']});
    say('Câte rânduri? Câți pomi pe un rând? 🌳');
  });
  function tableQ(pool,storyText){
    var b=choice(pool), a=rand(2,10);
    if(pool[0]>5) a=rand(2,9);
    if(rand(0,1)){var t=a;a=b;b=t;}
    storyQ(storyText,'Cât face '+mul(a,b)+'?');
    hint='Înmulțirea este o adunare repetată: '+mul(a,b)+' = '+rep(b,a)+'. Poți număra din '+b+' în '+b+'.';
    calcPad(activity,a,'*',b,function(){solved(mul(a,b)+' = '+a*b+' ✔');},{card:'leaf',keys:['a','b','s']});
    say('Scrie produsul! ✖️');
  }
  Q.push(function(){tableQ([2,3,4,5,10],'O bufniță 🦉 o întreabă pe Capi din tabla înmulțirii.');}); // 45
  Q.push(function(){ // 46. factori și produs
    var a=rand(2,9), b=rand(2,9), p=a*b, idx=rand(0,2);
    var items=[{v:a,k:'a'},MUL,{v:b,k:'b'},'=',{v:p,k:'s'}];
    items[[0,2,4][idx]].hl=true;
    var right=idx<2?'factor':'produs';
    storyQ('O albină 🐝 zboară pe lângă Capi și o întreabă:','Cum se numește numărul colorat?');
    visual.appendChild(inCard(eqEl(items),'leaf'));
    hint='La înmulțire: factor × factor = produs.';
    choices(activity,['factor','produs','termen','sumă'].map(function(n){
      return {label:n,ok:n===right,why:'La înmulțire: factor × factor = produs. „Termen” și „sumă” sunt cuvinte de la adunare! ✖️'};
    }),function(){solved('În '+mul(a,b)+' = '+p+', '+a+' și '+b+' sunt factorii, iar '+p+' este produsul ✔');},{wide:true});
    say('Cum se numesc numerele la înmulțire? 🐝');
  });
  Q.push(function(){ // 47. schimbăm factorii
    var a=rand(3,9), b=pick(function(){return rand(3,9);},function(v){return v!==a;}), p=a*b;
    storyQ('Capi știe deja că '+mul(a,b)+' = '+p+'. 🍊','Cât face '+mul(b,a)+'?');
    visual.appendChild(inCard(eqEl([{v:b,k:'b'},MUL,{v:a,k:'a'},'=',{v:'?'}]),'leaf'));
    hint='Dacă schimbăm factorii între ei, produsul nu se schimbă!';
    choices(activity,uniq([p,a+b,p+a,p-b]).map(function(v){
      return {label:String(v),ok:v===p,why:v===a+b?'Noi înmulțim, nu adunăm! ✖️':'Am schimbat doar locul factorilor. Produsul rămâne același! 🔄'};
    }),function(){solved(mul(a,b)+' = '+mul(b,a)+' = '+p+' 🔄 ✔');});
    say('Ai observat? Sunt aceiași factori! 🔄');
  });
  Q.push(function(){ // 48. înmulțirea cu 0 și cu 1
    var n=rand(2,10), z=rand(0,1), first=rand(0,1)===0, a=first?n:z, b=first?z:n, p=a*b;
    storyQ('Bufnița 🦉 are o întrebare-capcană!','Cât face '+mul(a,b)+'?');
    visual.appendChild(inCard(eqEl([{v:a,k:'a'},MUL,{v:b,k:'b'},'=',{v:'?'}]),'leaf'));
    hint=z===0?'Orice număr înmulțit cu 0 dă 0. De exemplu: de 3 ori câte 0 portocale = 0 portocale.':'Un număr înmulțit cu 1 rămâne același.';
    choices(activity,uniq([0,1,n,n+1]).map(function(v){
      return {label:String(v),ok:v===p,why:z===0?'Orice număr înmulțit cu 0 dă 0! 0️⃣':'Un număr înmulțit cu 1 rămâne același! 1️⃣'};
    }),function(){solved(mul(a,b)+' = '+p+' ✔');});
    say(z===0?'Atenție, aici e un 0! 0️⃣':'Atenție, aici e un 1! 1️⃣');
  });
  Q.push(function(){tableQ([6,7,8,9],'Ultima provocare din livadă, de la bufnița înțeleaptă 🦉:');}); // 49
  Q.push(function(){ // 50. problema finală, cu două operații
    var o=pick(function(){return {k:rand(3,6),n:rand(4,8)};},function(o){return o.k*o.n<=48 && o.k!==o.n;});
    var P=o.k*o.n, e=Math.min(rand(3,9),P-1), R=P-e;
    storyQ('Capi a ajuns lângă izvor! Pentru baie, a pregătit '+o.k+' coșulețe cu câte '+o.n+' portocale. Apoi le-a dat prietenilor '+e+' portocale.',
      'Câte portocale pune Capi în izvorul cald? ♨️');
    var row=basketsEl(o.k,o.n,'🍊');
    visual.appendChild(row);
    hint='Problemă cu două operații: întâi aflăm câte portocale sunt în coșulețe (înmulțire), apoi scădem portocalele date prietenilor.';
    var s1=step('Pasul 1: Câte portocale sunt în toate coșulețele?');
    calcPad(s1,o.k,'*',o.n,function(){
      var items=row.querySelectorAll('.basket span');
      for(var i=0;i<e;i++) items[items.length-1-i].classList.add('gone');
      var s2=step('Pasul 2: Scade portocalele date prietenilor!');
      calcPad(s2,P,'-',e,function(){solved(mul(o.k,o.n)+' − '+e+' = '+P+' − '+e+' = '+R+' 🍊 ✔');},{into:s2,small:true});
      say('Acum a doua operație: '+P+' − '+e+'. Începe cu unitățile! ✏️');
    },{into:s1,small:true,keys:['a','b','s']});
    say('Ultima provocare! Întâi înmulțirea, apoi scăderea. 🧩');
  });

  // ---------- Ecrane de poveste ----------
  function img(src,cls,alt){var i=el('img',cls);i.src=src;i.alt=alt||'';return i;}
  function btnRow(list){var r=el('div','ov-btns');list.forEach(function(b){r.appendChild(b);});return r;}
  function trailEl(){
    var t=el('div','trail');
    ['🏡'].concat(CH.map(function(c){return c.icon;}),['♨️']).forEach(function(x,i){
      if(i) t.appendChild(el('span','arr','➜'));
      t.appendChild(el('span',null,x));
    });
    return t;
  }
  function openOv(nodes){
    clearTimeout(nextTimer);
    locked=true;
    keyHandler=null;
    ovCard.replaceChildren();
    nodes.forEach(function(n){if(n) ovCard.appendChild(n);});
    ov.hidden=false;
    ovCard.scrollTop=0;
    var b=ovCard.querySelector('button');
    if(b) setTimeout(function(){b.focus();},60);
  }
  function closeOv(){ov.hidden=true;}
  function intro(){
    openOv([img('capi.jpg','hero','Capi, capibara'),el('h2',null,'Aventura lui Capi 🐾'),
      el('p',null,'Capi este o capibara curioasă și prietenoasă. A auzit că, la capătul Țării Numerelor, este un izvor cald plin de portocale! ♨️🍊'),
      el('p',null,'Ca să ajungă acolo, trebuie să treacă prin 5 locuri și să rezolve 50 de provocări de matematică. Fiecare răspuns corect o duce cu un pas mai aproape. O ajuți, Rebe?'),
      trailEl(),
      btnRow([btn('go-btn','🐾 Pornim la drum!',function(){closeOv();startQuestion();say(CH[0].intro+' 🌳');})])]);
    say('Bună, Rebe! Sunt Capi, capibara. Mă ajuți să ajung la izvorul cald? ♨️');
  }
  function resume(){
    var c=chOf(pos);
    var again=btn('alt-btn','🔄 De la început',function(){
      if(again.dataset.sure){resetAdventure();intro();return;}
      again.dataset.sure='1';
      again.textContent='Sigur? Apasă încă o dată';
    });
    openOv([img('capi.jpg','hero','Capi, capibara'),el('h2',null,'Bine ai revenit, Rebe! 🐾'),
      el('p',null,'Capi te așteaptă în '+CH[c].icon+' '+CH[c].name+', la provocarea '+(pos+1)+' din '+TOTAL+'.'),
      trailEl(),
      btnRow([btn('go-btn','▶ Continuăm',function(){closeOv();startQuestion();}),again])]);
    say('Hai să continuăm aventura! 🐾');
  }
  function chapterDone(){
    var c=pos/PER-1, nx=CH[c+1];
    bigFanfare();
    confetti(40);
    openOv([el('div','big-gift',CH[c].gift),el('h2',null,'🎉 '+CH[c].done),
      el('p',null,'Capi a găsit '+CH[c].giftName+' '+CH[c].gift+'. Acum e în rucsac! 🎒'),
      el('p',null,'Urmează: '+nx.icon+' '+nx.name+'. '+nx.intro),
      btnRow([btn('go-btn','Mai departe ➜',function(){closeOv();startQuestion();say(nx.intro+' '+nx.icon);})])]);
    say(CH[c].done+' '+CH[c].gift);
  }
  function finale(){
    bigFanfare();
    confetti(60);
    setTimeout(function(){confetti(40);},900);
    var dip=el('div','diploma');
    dip.appendChild(el('h3',null,'🏅 DIPLOMĂ'));
    dip.appendChild(el('p',null,'Rebe a ajutat-o pe Capi să ajungă la Izvorul cald și a rezolvat toate cele 50 de provocări!'));
    dip.appendChild(el('p',null,'✅ Din prima: '+firstTry+' din '+TOTAL+' · ⭐ Stele câștigate: '+advStars));
    var gifts=el('div','trail');
    CH.forEach(function(c){gifts.appendChild(el('span',null,c.gift));});
    dip.appendChild(gifts);
    var back=el('a','alt-btn','← Jocurile lui Rebe');
    back.href='rebe.html';
    openOv([img('capi-izvor.jpg','photo','Capibare care fac baie într-un izvor cald, cu portocale'),el('h2',null,'♨️ Capi a ajuns la Izvorul cald!'),
      el('p',null,'Capi face baie în apa caldă, printre portocale, împreună cu prietenii ei. Mulțumesc, Rebe! Fără tine nu reușea! 🍊💖'),dip,
      btnRow([btn('go-btn','🔄 O nouă aventură',function(){resetAdventure();intro();}),back])]);
    say('Am ajuns! Mulțumesc, Rebe! Ești cea mai bună prietenă! ♨️🍊💖');
  }
  function resetAdventure(){
    pos=0;firstTry=0;advStars=0;curT=0;facing=1;
    localStorage.setItem('rebe8_pos','0');
    localStorage.setItem('rebe8_first','0');
    localStorage.setItem('rebe8_stars','0');
    question.replaceChildren();visual.replaceChildren();activity.replaceChildren();
    panelTitle.textContent='';
    renderMap();
    placeCapi(0);
  }

  // ---------- Pornim ----------
  function startQuestion(){
    clearTimeout(nextTimer);
    locked=false;
    keyHandler=null;
    mistakes=0;
    hint='';
    hintBox.hidden=true;
    hintBtn.setAttribute('aria-expanded','false');
    question.replaceChildren();
    visual.replaceChildren();
    activity.replaceChildren();
    var c=chOf(pos);
    panelTitle.textContent=CH[c].icon+' '+CH[c].name+' · Provocarea '+(pos+1)+' din '+TOTAL;
    renderMap();
    if(Math.abs(curT-pos)>0.01) walkTo(pos);
    Q[pos]();
  }
  hintBtn.addEventListener('click',function(){
    hintBox.hidden=!hintBox.hidden;
    hintBtn.setAttribute('aria-expanded',String(!hintBox.hidden));
    if(!hintBox.hidden){
      hintBox.replaceChildren(el('div',null,'💡 '+(hint||'Citește cu atenție și mai încearcă!')));
      var ul=el('ul','rules');
      CH[chOf(Math.min(pos,TOTAL-1))].rules.forEach(function(r){ul.appendChild(el('li',null,r));});
      hintBox.appendChild(ul);
      say('Privește indiciul și mai încearcă! 😊');
    }
  });
  document.addEventListener('keydown',function(e){
    if(keyHandler && ov.hidden && !e.ctrlKey && !e.metaKey && !e.altKey && !document.querySelector('.lb-overlay')) keyHandler(e);
  });
  muteBtn.addEventListener('click',function(){
    muted=!muted;
    localStorage.setItem('rebe_muted',muted?'1':'0');
    muteBtn.textContent=muted?'🔇':'🔊';
    muteBtn.setAttribute('aria-label',muted?'Pornește sunetul':'Oprește sunetul');
  });
  zoomBtn.addEventListener('click',function(){zoomPref=!isZoom();placeCapi(curT);});
  window.addEventListener('resize',function(){placeCapi(curT);});
  starCount.textContent=stars;
  muteBtn.textContent=muted?'🔇':'🔊';
  muteBtn.setAttribute('aria-label',muted?'Pornește sunetul':'Oprește sunetul');
  if(Q.length!==TOTAL && window.console) console.warn('Aventura are '+Q.length+' provocări în loc de '+TOTAL);
  renderMap();
  placeCapi(curT);
  if(pos>=TOTAL) finale();
  else if(pos>0) resume();
  else intro();
})();
</script>
</body>
</html>
