<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2vh; min-height: 100dvh; padding: 2vh 2vw;
    font-family: Impact, "Arial Black", sans-serif;
    animation: flash 0.25s steps(1) infinite;
  }
  @keyframes flash {
    0%  { background: #ff0000; }
    50% { background: #ffea00; }
  }
  h1 {
    font-size: clamp(5rem, 28vw, 22rem);
    line-height: 0.9; text-align: center; color: #fff;
    -webkit-text-stroke: 0.04em #000;
    text-shadow: 0.05em 0.05em 0 #000, -0.03em -0.03em 0 #ff0000;
    animation: shake 0.12s infinite, pulse 0.5s ease-in-out infinite alternate;
    white-space: nowrap;
  }
  @keyframes shake {
    0%   { translate: 0 0;   rotate: 0deg; }
    25%  { translate: -6px 4px;  rotate: -3deg; }
    50%  { translate: 6px -4px;  rotate: 3deg; }
    75%  { translate: -4px -6px; rotate: -2deg; }
    100% { translate: 4px 6px;   rotate: 2deg; }
  }
  @keyframes pulse { from { scale: 0.92; } to { scale: 1.08; } }
  img {
    max-width: 92vw; max-height: 50dvh; width: auto; height: auto;
    border: 0.6rem solid #000; box-shadow: 0 0 0 0.6rem #fff, 0 0 3rem #000;
    animation: shake 0.2s infinite reverse;
  }
  .warn {
    font-size: clamp(1.5rem, 7vw, 4rem); color: #000; text-align: center;
    animation: blink 0.4s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (orientation: landscape) and (max-height: 600px) {
    body { flex-direction: row; }
    h1 { font-size: clamp(4rem, 20vw, 14rem); }
    img { max-height: 80dvh; max-width: 45vw; }
    .warn { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    body, h1, img, .warn { animation: none; background: #ff0000; }
  }
</style>
</head>
<body>
  <div class="warn">⚠️🚨 ALERTĂ 🚨⚠️</div>
  <h1>HACKED</h1>
  <img src="no-nope.gif" alt="NO NOPE">
  <div class="warn">🚨🚨🚨🚨🚨</div>
</body>
</html>
