<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebe - Proba adunării și a scăderii</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--pink:#ff5ea8;--purple:#8b5cf6;--green:#34d399;--ink:#3b2b57;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;min-height:100vh;padding:12px;
    font-family:'Fredoka','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;
    color:var(--ink);background:linear-gradient(180deg,#a9e0fb,#c9edff 42%,#eaf8ff);
  }
  button{font-family:inherit;cursor:pointer;color:inherit;}
  .wrap{max-width:920px;margin:auto;}
  header,.panel,.levelbar,.speech,.game-btn{background:#fff;border:3px solid #fff;box-shadow:0 8px 22px rgba(139,92,246,.15);}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:22px;padding:10px 16px;}
  header h1{margin:0;font-size:clamp(18px,4.5vw,28px);color:#8545cf;}
  header a{color:var(--purple);font-weight:700;text-decoration:none;white-space:nowrap;}
  header a:hover{text-decoration:underline;}
  .stars{white-space:nowrap;background:#fff7d6;border:2px solid #ffd766;border-radius:999px;padding:6px 10px;font-weight:700;}
  .top-actions{display:flex;align-items:center;gap:7px;}
  .mute-btn{border:0;background:#f1ecff;border-radius:50%;width:44px;height:44px;font-size:22px;}
  /* Rebe stă deasupra jocului ales */
  .stations{position:relative;padding-top:118px;margin-top:16px;overflow-x:clip;}
  .rebe{position:absolute;top:0;left:0;width:96px;height:118px;
    transition:left 1s cubic-bezier(.34,1.2,.64,1);z-index:5;pointer-events:none;}
  .rebe.no-anim{transition:none;}
  .rebe-inner{position:absolute;inset:0;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite;}
  .rebe.walking .rebe-inner{animation:waddle .34s ease-in-out infinite;}
  .rebe.happy .rebe-inner{animation:jump .7s ease;}
  .rebe.oops .rebe-inner{animation:shake .5s ease;}
  .rebe-head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:58px;height:auto;z-index:2;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));}
  .rebe-body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:58px;height:auto;z-index:1;overflow:visible;}
  .arm-wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave 1.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes waddle{0%,100%{transform:translateY(-3px) rotate(-5deg)}50%{transform:translateY(-3px) rotate(5deg)}}
  @keyframes jump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-30px) scale(1.06) rotate(-4deg)}55%{transform:translateY(0) scale(1)}70%{transform:translateY(-14px) rotate(3deg)}100%{transform:translateY(0)}}
  @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
  @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
  .speech{position:relative;margin:6px auto 0;max-width:560px;text-align:center;border-color:var(--purple);border-radius:18px;
    padding:12px 18px;font-size:clamp(15px,3.4vw,19px);font-weight:500;animation:pop .3s ease;}
  .speech::after{content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    border:8px solid transparent;border-bottom-color:var(--purple);}
  @keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
  .games{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;}
  .game-btn{border-radius:18px;padding:10px 4px;font-size:clamp(12px,2.8vw,16px);font-weight:700;min-height:76px;}
  .game-btn .icon{display:block;font-size:clamp(22px,6vw,32px);margin-bottom:2px;}
  .game-btn.active{border-color:var(--pink);background:#fff0f7;box-shadow:0 8px 20px rgba(255,94,168,.3);}
  .levelbar{border-radius:18px;margin-top:14px;padding:10px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;}
  .levelbar strong{margin-right:3px;}
  .lvl{border:3px solid #e6e0ff;border-radius:12px;background:#fff;min-width:42px;height:42px;font-weight:700;font-size:18px;}
  .lvl.active{border-color:var(--green);background:#eafaf0;}
  .level-note{flex-basis:100%;text-align:center;color:#665887;margin:0;font-size:14px;}
  .panel{border-radius:26px;margin-top:16px;padding:18px 12px 24px;text-align:center;min-height:340px;}
  .panel h2{font-size:clamp(20px,4.5vw,26px);margin:0 0 12px;}
  .question{font-size:clamp(18px,4.2vw,24px);font-weight:700;margin:8px 0 12px;}
  .detail{font-size:clamp(15px,3.4vw,18px);color:#6b5b92;margin:8px 0;}
  .answers,.tiles,.slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px auto;}
  .ans,.tile{border:3px solid #e6e0ff;border-radius:18px;background:#fff;min-width:70px;min-height:60px;padding:9px 14px;
    font-size:clamp(22px,5vw,28px);font-weight:700;box-shadow:0 5px 0 #ded6ff;}
  .ans:hover:not(:disabled),.tile:hover:not(:disabled),.lvl:hover,.game-btn:hover{border-color:var(--pink);}
  .ans:disabled,.tile:disabled{cursor:default;}
  .ans.correct,.tile.correct{background:#d7fbe8;border-color:var(--green);box-shadow:0 5px 0 #79e0b3;}
  .ans.wrong,.tile.wrong{background:#ffe0e6;border-color:#e23e8c;}
  .controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:20px;}
  .controls button{border:0;border-radius:16px;padding:10px 18px;font-size:16px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.14);}
  .hint-btn{background:linear-gradient(90deg,#fbbf24,#fb923c);}
  .again{background:linear-gradient(90deg,#38bdf8,#8b5cf6);color:#fff;}
  .hint-box{margin:16px auto 0;max-width:580px;text-align:left;background:#fffbe9;border:3px solid #fbbf24;border-radius:18px;padding:14px 16px;font-size:17px;line-height:1.5;}
  [hidden]{display:none!important;}
  footer{text-align:center;margin:18px 0;color:#8175a7;font-size:14px;}
  .swim-layer{position:fixed;inset:0;z-index:48;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .5s;}
  .swim-layer.on{opacity:1;}
  .swim-water{position:absolute;inset:0;background:linear-gradient(180deg,rgba(56,189,248,0) 34%,rgba(56,189,248,.14) 60%,rgba(14,165,233,.22) 100%);}
  .swim-wave{position:absolute;left:0;width:220%;height:20px;top:50%;
    background:radial-gradient(circle at 24px 20px,rgba(255,255,255,0) 16px,rgba(255,255,255,.55) 17px,rgba(255,255,255,0) 19px) repeat-x;
    background-size:64px 20px;animation:swim-wave 1.8s linear infinite;opacity:.5;}
  @keyframes swim-wave{from{transform:translateX(0)}to{transform:translateX(-64px)}}
  .swimmer{position:absolute;top:42%;left:0;width:190px;height:112px;
    animation:swim-across 10s linear forwards, swim-bob 1.1s ease-in-out infinite;}
  @keyframes swim-across{from{transform:translateX(-26vw)}to{transform:translateX(126vw)}}
  @keyframes swim-bob{0%,100%{margin-top:0}50%{margin-top:-12px}}
  .swim-svg{width:100%;height:100%;overflow:visible;display:block;}
  .swim-head{position:absolute;right:2px;top:2px;width:52px;height:auto;transform:rotate(-16deg);filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));}
  .swim-arm-f,.swim-arm-b,.swim-leg-a,.swim-leg-b,.swim-bubble{transform-box:view-box;}
  .swim-arm-f{transform-origin:145px 58px;animation:swim-stroke .8s ease-in-out infinite;}
  .swim-arm-b{transform-origin:145px 60px;animation:swim-stroke .8s ease-in-out infinite;animation-delay:-.4s;}
  @keyframes swim-stroke{0%{transform:rotate(-38deg)}50%{transform:rotate(48deg)}100%{transform:rotate(-38deg)}}
  .swim-leg-a{transform-origin:55px 64px;animation:swim-kick .34s ease-in-out infinite;}
  .swim-leg-b{transform-origin:55px 70px;animation:swim-kick .34s ease-in-out infinite;animation-delay:-.17s;}
  @keyframes swim-kick{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
  .swim-bubble{fill:#fff;opacity:.7;animation:swim-bub 1.3s ease-in infinite;}
  @keyframes swim-bub{0%{opacity:.7;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(-34px,-20px) scale(.3)}}
  /* Confetti */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50;}
  .confetti-piece{position:absolute;top:-24px;width:11px;height:15px;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{
    0%{transform:translateY(-24px) rotate(0);opacity:1}
    100%{transform:translateY(105vh) rotate(720deg);opacity:.9}
  }
  /* ---------- rebe6: culori ---------- */
  .u{--c:#0ea5e9;--cl:#dff4ff;}
  .t{--c:#8b5cf6;--cl:#ede4ff;}
  .h{--c:#ec4899;--cl:#ffe1f0;}
  .m{--c:#f59e0b;--cl:#fff3d6;}
  .ka{--kc:#0284c7;}
  .kb{--kc:#7c3aed;}
  .ks{--kc:#db2777;}
  .result-line{display:inline-block;margin:14px auto 0;font-size:clamp(17px,4.2vw,23px);font-weight:700;color:#065f46;
    background:#e9fbf2;border:3px solid var(--green);border-radius:16px;padding:8px 14px;animation:pop .3s ease;}
  .task{display:inline-block;background:#fff7d6;border:3px solid #fbbf24;border-radius:14px;padding:2px 10px;color:#92400e;}
  .rules{margin:8px 0 0;padding-left:20px;}
  .rules li{margin:4px 0;}

  /* ---------- Egalități colorate ---------- */
  .eq{display:flex;align-items:flex-start;justify-content:center;gap:clamp(6px,2vw,14px);flex-wrap:wrap;margin:6px auto;}
  .eq .n{display:flex;flex-direction:column;align-items:center;min-width:1.6em;}
  .eq .v,.eq .o{font-size:clamp(28px,7.5vw,42px);font-weight:800;line-height:1.2;}
  .eq .v{color:var(--kc,var(--ink));}
  .eq .o{color:#a78bfa;}
  .eq .l{font-size:clamp(11px,2.8vw,13px);font-weight:700;color:var(--kc,#7c6aa8);}
  .eq.small .v,.eq.small .o{font-size:clamp(22px,5.6vw,30px);}
  .eq .slot{display:inline-block;min-width:2.4em;padding:0 8px;border:3px dashed #c8b5f8;border-radius:12px;background:#fdfcff;color:#b9a6f3;text-align:center;}
  .eq .slot.typing{color:var(--ink);border-style:solid;border-color:var(--purple);}
  .eq .slot.ok{border-style:solid;border-color:var(--green);background:#eafaf0;animation:pop .3s ease;}
  .eq .slot.bad{animation:shake-x .4s ease;}
  @keyframes shake-x{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}

  /* ---------- Pași + tastatură ---------- */
  .step{margin:12px auto 0;max-width:620px;padding:10px 12px;border-radius:18px;background:#faf7ff;border:3px solid #ece4ff;animation:pop .3s ease;}
  .step h3{margin:0 0 4px;font-size:clamp(15px,3.6vw,19px);}
  .step .answers{margin:8px auto 4px;}
  .step.done{background:#f3fcf7;border-color:#c8f5dc;}
  .ans.wide{font-size:clamp(18px,4.6vw,24px);}
  .numpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:270px;margin:10px auto 2px;}
  .keypad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:360px;margin:12px auto 0;}
  .key{border:3px solid #e6e0ff;border-radius:14px;background:#fff;height:54px;font-size:26px;font-weight:800;box-shadow:0 4px 0 #ded6ff;}
  .key:active{transform:translateY(2px);box-shadow:0 2px 0 #ded6ff;}
  .key.ok{background:#d1fae5;border-color:#34d399;box-shadow:0 4px 0 #6ee7b7;}
  .key.del{background:#fff1f2;border-color:#fecdd3;box-shadow:0 4px 0 #fecdd3;}
  .key.wrong{background:#ffe0e6;border-color:#e23e8c;animation:shake-x .4s ease;}
  .numpad.off,.keypad.off{opacity:.45;pointer-events:none;}

  /* ---------- Cufărul ---------- */
  .chest-box{position:relative;width:160px;height:clamp(130px,32vw,160px);margin:0 auto;}
  .chest{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:clamp(70px,18vw,92px);line-height:1;}
  .lock{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:clamp(28px,7vw,38px);transition:transform .4s;}
  .chest-box.open .lock{transform:translate(60%,-30%) rotate(25deg);}
  .chest-box.open .chest{animation:jump .7s ease;}
  .treasure{position:absolute;top:0;left:50%;font-size:clamp(40px,10vw,54px);line-height:1;transform:translate(-50%,40px) scale(0);
    transition:transform .6s cubic-bezier(.34,1.56,.64,1);}
  .chest-box.open .treasure{transform:translate(-50%,0) scale(1);}
  .chest-box.open::before{content:"";position:absolute;inset:-10px;border-radius:50%;
    background:radial-gradient(circle,rgba(253,224,71,.65),rgba(253,224,71,0) 65%);animation:pop .5s ease;}

  /* ---------- Căsuța ---------- */
  .house{width:min(480px,100%);margin:6px auto 0;}
  .roof{position:relative;height:clamp(130px,32vw,160px);background:linear-gradient(180deg,#fb7185,#e11d48);
    clip-path:polygon(50% 0,100% 100%,0 100%);}
  .rn{position:absolute;transform:translate(-50%,-50%);background:#fff;border:4px solid var(--kc);color:var(--kc);
    border-radius:999px;padding:2px 12px;font-size:clamp(20px,5.4vw,28px);font-weight:800;min-width:2.4em;text-align:center;}
  .rn.pos-s{left:50%;top:52%;}
  .rn.pos-a{left:30%;top:80%;}
  .rn.pos-b{left:70%;top:80%;}
  .rn.hidden-n{--kc:#94a3b8;animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}
  .walls{background:linear-gradient(180deg,#fef3c7,#fde68a);border:4px solid #f59e0b;border-top:0;border-radius:0 0 14px 14px;
    padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .win{position:relative;background:#1e3a8a;color:#c7d2fe;border:5px solid #92400e;border-radius:12px;min-height:78px;
    padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .4s;}
  .win .wq{font-size:clamp(15px,4.2vw,22px);font-weight:800;white-space:nowrap;}
  .win .cap{font-size:clamp(10px,2.6vw,12px);font-weight:700;opacity:.85;}
  .win .blank{display:inline-block;min-width:1.8em;border-bottom:3px dashed currentColor;}
  .win.act{outline:4px solid var(--pink);outline-offset:2px;animation:pop .3s ease;}
  .win.lit{background:#fef9c3;color:var(--ink);}
  .win .pet{position:absolute;right:4px;top:-6px;font-size:26px;animation:pop .4s ease;}
  .door{grid-column:1/-1;justify-self:center;font-size:40px;line-height:1;}
  .tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px auto;}
  .tile{border:3px solid #e6e0ff;border-radius:18px;background:#fff;min-width:70px;min-height:56px;padding:8px 14px;
    font-size:clamp(22px,5vw,28px);font-weight:700;box-shadow:0 5px 0 #ded6ff;}
  .tile:hover{border-color:var(--pink);}

  /* ---------- Proba în coloană ---------- */
  .col-wrap{display:flex;justify-content:center;align-items:flex-start;gap:clamp(10px,4vw,30px);flex-wrap:wrap;}
  .col-card{background:#faf7ff;border:3px solid #ece4ff;border-radius:18px;padding:8px 10px;}
  .col-card.main{background:#fff;border-color:var(--pink);}
  .col-title{font-weight:800;font-size:clamp(14px,3.4vw,17px);color:#8545cf;margin-bottom:2px;}
  .colop{--cw:clamp(42px,11vw,58px);display:inline-grid;gap:2px 5px;font-size:clamp(28px,7.6vw,42px);font-weight:800;}
  .colop.small{--cw:clamp(24px,6.5vw,34px);font-size:clamp(18px,5vw,26px);}
  .colop .cell{height:1.3em;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background .2s;}
  .colop .hd{font-size:13px;height:auto;color:var(--c);padding:2px 0;}
  .colop .cr{font-size:.45em;height:1.1em;color:#e11d48;}
  .colop .cr.on{animation:pop .3s ease;}
  .colop .sign{color:var(--purple);justify-content:flex-start;align-items:flex-start;font-size:.8em;}
  .colop .bar{grid-column:1/-2;height:5px;background:var(--ink);border-radius:3px;margin:2px 0;}
  .colop .res{border:3px dashed #c8b5f8;}
  .colop .res.filled{border-style:solid;border-color:var(--green);background:#eafaf0;animation:pop .25s ease;}
  .colop .act{background:var(--cl);}
  .colop .res.act{border-color:var(--c);border-style:solid;}

  /* ---------- Robotul ---------- */
  .robot{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px auto 6px;flex-wrap:wrap;}
  .robot-face{font-size:clamp(52px,14vw,72px);line-height:1;animation:bob 2.2s ease-in-out infinite;}
  .robot-say{background:#eef2ff;border:3px solid #818cf8;border-radius:18px;padding:6px 16px;}
  .robot-say small{display:block;font-size:14px;font-weight:600;color:#6366f1;}
  .robot-say .eq{margin:0;}

  /* ---------- Baloanele ---------- */
  .counter{display:inline-block;margin-top:4px;font-weight:800;background:#f1ecff;border-radius:999px;padding:4px 14px;}
  .sky-area{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 10px;padding:16px 8px 10px;margin:10px auto 0;max-width:640px;
    border-radius:22px;background:linear-gradient(180deg,#bae6fd,#e0f2fe 60%,#f0f9ff);}
  .balloon{position:relative;width:clamp(100px,27vw,148px);height:clamp(124px,33vw,176px);border:0;background:none;padding:0;
    animation:float 3s ease-in-out infinite;}
  .balloon .bb{position:absolute;left:0;right:0;top:0;bottom:22px;border-radius:50% 50% 47% 47%/56% 56% 44% 44%;
    background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.75),rgba(255,255,255,0) 26%),var(--bc);
    box-shadow:inset -6px -10px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:clamp(14px,3.9vw,20px);line-height:1.2;text-shadow:0 2px 0 rgba(0,0,0,.22);padding:6px;}
  .balloon .bb::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-7px;
    border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--bc);}
  .balloon .str{position:absolute;bottom:0;left:50%;width:2px;height:14px;background:#64748b;}
  .balloon:hover .bb{filter:brightness(1.08);}
  .balloon.bad{animation:shake-x .4s ease;filter:grayscale(1);opacity:.45;cursor:default;}
  .balloon.popped{animation:popb .3s ease forwards;}
  @keyframes popb{to{transform:scale(1.5);opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
  .b-tag{width:clamp(100px,27vw,148px);height:clamp(124px,33vw,176px);display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#ecfdf5;border:3px solid var(--green);border-radius:18px;font-weight:800;font-size:clamp(13px,3.5vw,17px);color:#065f46;
    animation:pop .35s ease;padding:4px;}
  .b-tag .big{font-size:28px;}
  @media(max-width:520px){
    .col-wrap{gap:8px;}
    .col-card{padding:6px 5px;}
    .colop{--cw:clamp(34px,9.6vw,58px);gap:2px 3px;}
    .colop.small{--cw:clamp(20px,5.4vw,34px);}
    .games{gap:5px;}
    .game-btn{padding:8px 2px;font-size:clamp(9px,2.6vw,12px);overflow-wrap:anywhere;}
  }
  @media(max-width:400px){
    header{flex-wrap:wrap;}
    .top-actions{margin-left:auto;}
    .game-btn{min-height:70px;}
    .ans,.tile{min-width:60px;padding:8px 10px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="rebe.html">← Jocurile lui Rebe</a>
    <h1>🌸 Rebe face proba</h1>
    <div class="top-actions">
      <div class="stars" aria-label="Stele câștigate">⭐ <span id="starCount">0</span></div>
      <button class="mute-btn" id="muteBtn" type="button" aria-label="Oprește sunetul">🔊</button>
    </div>
  </header>
  <div class="stations" id="stations">
    <div class="rebe" id="rebe" aria-hidden="true">
      <div class="rebe-inner">
        <img class="rebe-head" alt="" src="rebe-head.png">
        <svg class="rebe-body" viewBox="17 44 66 84" xmlns="http://www.w3.org/2000/svg">

<script>
(function(){

  var CONFETTI_COLORS=['#ff5ea8','#8b5cf6','#38bdf8','#34d399','#fbbf24','#fb923c','#f472b6'];
  var PCLS=['u','t','h','m'];            // după poziție: 0 = unități
  var PLACE=['unități','zeci','sute','mii'];
  var PLACE_LETTER=['U','Z','S','M'];
  var level=Number(localStorage.getItem('rebe6_level'))||1;
  if(level<1 || level>5 || !Number.isInteger(level)) level=1;
  var stars=Number(localStorage.getItem('rebe_stars'))||0;

  var audio=null;
  var keyHandler=null;

  var names={chest:'🔑 Cufărul cu comori',house:'🏠 Căsuța numerelor',column:'✏️ Proba în coloană',robot:'🤖 Robotul Calculo',balloons:'🎈 Baloanele cu probe'};
  var intros={
    chest:'Cufărul se deschide doar cu proba potrivită! Alege cheia! 🔑',
    house:'În căsuță locuiesc 3 numere. Cu ele facem calculul și toate probele lui! 🏠',
    column:'Facem proba în coloană. Începem cu unitățile! ✏️',
    robot:'Robotul Calculo a socotit. Facem proba ca să vedem dacă a greșit! 🤖',
    balloons:'Sparge doar baloanele cu probe CORECTE! 🎈'
  };
  var hints={
    chest:'Citește ce probă se cere. „Prin scădere” înseamnă că proba este o scădere. „Prin adunare” înseamnă că proba este o adunare.',
    house:'Numărul de sus este cel mai mare: el este suma (sau descăzutul). Jos stau cele două numere care, adunate, dau numărul de sus. Cu aceleași 3 numere scriem 2 adunări și 2 scăderi.',
    column:'Scriem unități sub unități, zeci sub zeci, sute sub sute și începem cu unitățile. La adunare: dacă trecem de 9, scriem unitățile și ținem 1 în minte. La scădere: dacă nu putem scădea, împrumutăm 1 de la cifra din stânga.',
    robot:'Fă proba cu rezultatul scris de Calculo. Dacă proba „iese” (obținem exact numărul care trebuie), calculul e corect. Dacă nu iese, Calculo a greșit!',
    balloons:'Pentru fiecare balon verifică două lucruri: 1) este una dintre probele exercițiului? 2) calculul de pe balon e corect?'
  };
  var RULES=[
    '➕ Proba adunării prin scădere: din sumă scădem un termen → obținem celălalt termen.',
    '➕ Proba adunării prin adunare: schimbăm locul termenilor → obținem aceeași sumă.',
    '➖ Proba scăderii prin adunare: diferența + scăzătorul → obținem descăzutul.',
    '➖ Proba scăderii prin scădere: descăzutul − diferența → obținem scăzătorul.'
  ];
  var LEVEL_NOTES=['','Până la 100, fără trecere peste ordin (ex. 34 + 25)','Până la 100, cu trecere peste ordin (ex. 38 + 45)',
    'Până la 1000, fără trecere peste ordin (ex. 342 + 215)','Până la 1000, cu o trecere peste ordin (ex. 358 + 127)',
    'Provocare: două treceri peste ordin, până la 1000 (ex. 476 + 358)'];
  var PRAISE=['Bravo! Ai câștigat o stea! ⭐','Super! Încă o stea! 🌟','Excelent, detectivule! ⭐','Ești grozavă! 💖⭐','Proba iese! Felicitări! 🎉'];
  var TREASURES=['💎','👑','🪙','🦄','🍭','🎁','🌈','🧁','🐚','🏆'];
  var PETS=['🐱','🐶','🐰','🦊','🐼','🐨','🐸','🐹','🐥','🦔'];
  var BALLOON_COLORS=['#f43f5e','#8b5cf6','#0ea5e9','#22c55e','#f59e0b','#ec4899'];

  // ---------- Utile ----------
  function rand(lo,hi){return lo+Math.floor(Math.random()*(hi-lo+1));}
  function choice(a){return a[rand(0,a.length-1)];}
  function shuffle(items){
    for(var i=items.length-1;i>0;i--){var j=rand(0,i);var t=items[i];items[i]=items[j];items[j]=t;}
    return items;
  }
  function el(tag,cls,text){
    var n=document.createElement(tag);
    if(cls) n.className=cls;
    if(text!=null) n.textContent=text;
    return n;
  }
  function btn(cls,text,onClick){
    var b=el('button',cls,text);
    b.type='button';
    b.addEventListener('click',onClick);
    return b;
  }
  function sym(op){return op==='+'?'+':'−';}
  function calc(a,op,b){return op==='+'?a+b:a-b;}
  function maxValue(){return level<=2?100:1000;}
  function digitAt(n,p){return Math.floor(n/Math.pow(10,p))%10;}
  function opWord(op){return op==='+'?'adunării':'scăderii';}

  // ---------- Generator: o „familie” a + b = s (s − b = a) ----------
  function carries(a,b){
    var c=0,n=0;
    while(a>0 || b>0){
      c=(a%10+b%10+c)>=10?1:0;
      n+=c;
      a=Math.floor(a/10);b=Math.floor(b/10);
    }
    return n;
  }
  function family(){
    for(var tries=0;tries<5000;tries++){
      var a,b,maxS,ok;
      if(level<=2){a=rand(10,89);b=rand(10,89);}
      else {a=rand(100,899);b=rand(0,3)?rand(100,899):rand(10,99);}
      var s=a+b, n=carries(a,b);
      switch(level){
        case 1: maxS=99;ok=n===0;break;
        case 2: maxS=100;ok=n>=1;break;
        case 3: maxS=999;ok=n===0;break;
        case 4: maxS=999;ok=n===1;break;
        default: maxS=1000;ok=n>=2;
      }
      if(!ok || s>maxS || a===b) continue;
      if(rand(0,1)){var t=a;a=b;b=t;}
      return {a:a,b:b,s:s};
    }
    return level<=2?{a:34,b:25,s:59}:{a:342,b:215,s:557};
  }
  function newEx(){
    var f=family();
    f.op=rand(0,1)?'+':'-';
    return f;
  }
  // operația din exercițiu: a + b = s  sau  s − b = a
  function orig(ex){
    return ex.op==='+'?
      {x:ex.a,xk:'a',op:'+',y:ex.b,yk:'b',r:ex.s,rk:'s',labels:['termen','termen','sumă']}:
      {x:ex.s,xk:'s',op:'-',y:ex.b,yk:'b',r:ex.a,rk:'a',labels:['descăzut','scăzător','diferență']};
  }
  // probele corecte ale exercițiului
  function probesOf(ex){
    var a=ex.a,b=ex.b,s=ex.s;
    if(ex.op==='+') return [
      {m:'scădere',x:s,xk:'s',op:'-',y:b,yk:'b',r:a,rk:'a',tgt:'primul termen'},
      {m:'scădere',x:s,xk:'s',op:'-',y:a,yk:'a',r:b,rk:'b',tgt:'al doilea termen'},
      {m:'adunare',x:b,xk:'b',op:'+',y:a,yk:'a',r:s,rk:'s',tgt:'aceeași sumă'}
    ];
    return [
      {m:'adunare',x:a,xk:'a',op:'+',y:b,yk:'b',r:s,rk:'s',tgt:'descăzutul'},
      {m:'adunare',x:b,xk:'b',op:'+',y:a,yk:'a',r:s,rk:'s',tgt:'descăzutul'},
      {m:'scădere',x:s,xk:'s',op:'-',y:a,yk:'a',r:b,rk:'b',tgt:'scăzătorul'}
    ];
  }
  function ruleText(op,m){
    if(op==='+') return m==='scădere'?RULES[0]:RULES[1];
    return m==='adunare'?RULES[2]:RULES[3];
  }
  function numberOptions(v,count){
    var set=[v], maxV=maxValue();
    var ds=level<=2?[10,-10,1,-1,2,-2,11,-11]:[10,-10,100,-100,1,-1,110,-110];
    shuffle(ds).forEach(function(d){
      var c=v+d;
      if(set.length<(count||4) && c>=0 && c<=maxV && set.indexOf(c)<0) set.push(c);
    });
    return shuffle(set);
  }
  function calcHelp(x,op,y,v,r){
    var d=Math.abs(v-r);
    var extra=(d===10 || d===100)?' Ai grijă la trecerea peste ordin! 😉':'';
    return v+' nu e corect. Socotește '+x+' '+sym(op)+' '+y+' pe rând: unități, zeci'+(maxValue()>100?', sute':'')+'.'+extra;
  }

  // ---------- Egalități colorate ----------
  function term(it){
    var n=el('span','n'+(it.k?' k'+it.k:''));
    n.appendChild(it.v instanceof Node?it.v:el('span','v',String(it.v)));
    if(it.l) n.appendChild(el('span','l',it.l));
    return n;
  }
  function eqEl(items,cls){
    var row=el('div','eq'+(cls?' '+cls:''));
    items.forEach(function(it){
      row.appendChild(typeof it==='string'?el('span','o',it):term(it));
    });
    return row;
  }
  function eqOf(o,withLabels,rSlot,cls){
    var L=withLabels?o.labels:[];
    return eqEl([{v:o.x,k:o.xk,l:L[0]},sym(o.op),{v:o.y,k:o.yk,l:L[1]},'=',{v:rSlot||o.r,k:rSlot?null:o.rk,l:L[2]}],cls);
  }
  function slotEl(){
    var s=el('span','v slot','?');
    return s;
  }

  // ---------- Sunet ----------
  function tone(freq,dur,type,vol,delay){
    if(muted) return;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    if(!audio) audio=new AC();
    if(audio.state==='suspended') audio.resume();
    var t0=audio.currentTime+(delay||0);
    var o=audio.createOscillator(), g=audio.createGain();
    o.type=type||'sine';
    o.frequency.value=freq;
    o.connect(g);g.connect(audio.destination);
    g.gain.setValueAtTime(vol||0.15,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.start(t0);o.stop(t0+dur+0.01);
  }
  function beep(correct){tone(correct?660:280,0.2);}
  function tick(){tone(560,0.07,'triangle',0.08);}
  function popSound(){tone(1200,0.05,'square',0.05);tone(300,0.12,'triangle',0.12,0.03);}
  function fanfare(){[523,659,784,1047].forEach(function(f,i){tone(f,0.18,'triangle',0.12,i*0.11);});}

  // ---------- Rebe ----------
  function say(text){
    speech.textContent=text;
    speech.style.animation='none';
    void speech.offsetWidth;
    speech.style.animation='';
  }
  function rebeState(cls,ms){
    rebe.classList.remove('happy','oops');
    void rebe.offsetWidth;
    rebe.classList.add(cls);
    setTimeout(function(){rebe.classList.remove(cls);},ms);
  }
  function activeButton(){return gameButtons.find(function(b){return b.dataset.game===game;});}
  function moveRebeTo(button,animate){
    if(!button) return;
    var sRect=stations.getBoundingClientRect();
    var bRect=button.getBoundingClientRect();
    var left=bRect.left-sRect.left+bRect.width/2-rebe.offsetWidth/2;
    if(animate){
      rebe.classList.add('walking');
      rebe.style.left=left+'px';
      setTimeout(function(){rebe.classList.remove('walking');},1000);
    } else {
      rebe.classList.add('no-anim');
      rebe.style.left=left+'px';
      void rebe.offsetWidth;
      rebe.classList.remove('no-anim');
    }
  }
  function repositionRebe(){moveRebeTo(activeButton(),false);}

  // ---------- Recompense ----------
  function confetti(){
    for(var i=0;i<22;i++){
      var p=document.createElement('div');
      p.className='confetti-piece';
      p.style.left=Math.random()*100+'vw';
      p.style.background=choice(CONFETTI_COLORS);
      var dur=1.1+Math.random()*0.9;
      p.style.animationDuration=dur+'s';
      p.style.animationDelay=(Math.random()*0.25)+'s';
      confettiLayer.appendChild(p);
      (function(node,ms){setTimeout(function(){if(node.parentNode) node.parentNode.removeChild(node);},ms);})(p,(dur+0.3)*1000);
    }
  }
  function swim(){
    var swimmer=swimLayer.querySelector('.swimmer');
    swimmer.style.animation='none';
    void swimmer.offsetWidth;
    swimmer.style.animation='';
    swimLayer.classList.add('on');
    say('Bravo! Rebe înoată puțin! 🏊‍♀️🌊🎉');
    clearTimeout(swim._t);
    swim._t=setTimeout(function(){swimLayer.classList.remove('on');},10000);
    setTimeout(function(){if(window.RebeBonus) RebeBonus.show(applyBonus);},10000);
  }
  function applyBonus(delta){
    stars=Math.max(0,stars+delta);
    localStorage.setItem('rebe_stars',String(stars));
    starCount.textContent=stars;
    return stars;
  }
  function win(resultText,delay){
    locked=true;
    keyHandler=null;
    if(resultText) activity.appendChild(el('div','result-line',resultText));
    stars++;
    localStorage.setItem('rebe_stars',String(stars));
    starCount.textContent=stars;
    correctCount++;
    if(correctCount%SWIM_EVERY===0) swim();
    else say(choice(PRAISE));
    beep(true);
    confetti();
    rebeState('happy',700);
    nextTimer=setTimeout(newRound,delay||2600);
  }
  function fail(msg){
    say(msg||'Mai încearcă! Poți folosi indiciul. 💪');
    beep(false);
    rebeState('oops',500);
  }
  function step(text){
    var all=activity.querySelectorAll('.step'), prev=all[all.length-1];
    if(prev) prev.classList.add('done');
    var s=el('div','step');
    s.appendChild(el('h3',null,text));
    activity.appendChild(s);
    return s;
  }
  // rând de variante; onRight(item) se apelează la alegerea corectă
  function choices(container,items,onRight,wide){
    var row=el('div','answers');
    shuffle(items.slice()).forEach(function(it){
      var b=btn('ans'+(wide?' wide':''),it.label,function(){
        if(locked || b.disabled) return;
        if(it.ok){
          b.classList.add('correct');
          row.querySelectorAll('button').forEach(function(x){x.disabled=true;});
          tick();
          onRight(it);
        } else {
          b.classList.add('wrong');
          b.disabled=true;
          fail(it.why);
        }
      });
      row.appendChild(b);
    });
    container.appendChild(row);
    return row;
  }
  // tastatură pentru un număr întreg; cifrele apar în „slot”
  function numPad(container,slot,expected,onRight,wrongMsg){
    var typed='', done=false;
    var pad=el('div','numpad');
    function render(){
      slot.textContent=typed||'?';
      slot.classList.toggle('typing',!!typed);
    }
    function press(k){
      if(locked || done) return;
      if(k==='del'){typed=typed.slice(0,-1);render();return;}
      if(k==='ok'){
        if(!typed){say('Scrie întâi rezultatul cu tastele! 🔢');return;}
        var v=Number(typed);
        if(v===expected){
          done=true;
          keyHandler=null;
          slot.classList.remove('typing');
          slot.classList.add('ok');
          pad.classList.add('off');
          tick();
          onRight();
        } else {
          fail(wrongMsg(v));
          slot.classList.remove('bad');void slot.offsetWidth;slot.classList.add('bad');
          typed='';render();
        }
        return;
      }
      if(typed.length>=4) return;
      typed=(typed==='0'?'':typed)+k;
      tick();
      render();
    }
    ['1','2','3','4','5','6','7','8','9','del','0','ok'].forEach(function(k){
      var label=k==='del'?'⌫':k==='ok'?'✔':k;
      var b=btn('key'+(k==='ok'?' ok':k==='del'?' del':''),label,function(){press(k);});
      if(k==='del') b.setAttribute('aria-label','Șterge');
      if(k==='ok') b.setAttribute('aria-label','Gata');
      pad.appendChild(b);
    });
    container.appendChild(pad);
    keyHandler=function(e){
      if(/^[0-9]$/.test(e.key)) press(e.key);
      else if(e.key==='Backspace'){e.preventDefault();press('del');}
      else if(e.key==='Enter'){e.preventDefault();press('ok');}
    };
    render();
  }
  function taskEl(ex,m){
    var q=el('span');
    q.appendChild(document.createTextNode('Fă proba '+opWord(ex.op)+' '));
    q.appendChild(el('span','task','prin '+m));
    return q;
  }

  // ---------- 1. Cufărul cu comori ----------
  function keyOptions(ex,m){
    var a=ex.a,b=ex.b,s=ex.s,P=probesOf(ex);
    function k(x,op,y){return '🔑 '+x+' '+sym(op)+' '+y;}
    if(ex.op==='+' && m==='scădere') return [
      {label:k(s,'-',b),ok:true,p:P[0]},
      {label:k(s,'-',a),ok:true,p:P[1]},
      {label:k(s,'+',b),ok:false,why:'Proba prin scădere este o scădere! Din sumă scădem un termen.'},
      {label:k(Math.max(a,b),'-',Math.min(a,b)),ok:false,why:'Nu scădem un termen din celălalt. Pornim de la sumă ('+s+') și scădem un termen.'}
    ];
    if(ex.op==='+') return [
      {label:k(b,'+',a),ok:true,p:P[2]},
      {label:k(a,'+',b),ok:false,why:'Asta e chiar adunarea din exercițiu! La proba prin adunare schimbăm locul termenilor.'},
      {label:k(s,'-',b),ok:false,why:'Aceasta e proba prin scădere. Acum vrem proba prin adunare!'},
      {label:k(s,'+',a),ok:false,why:'Nu adunăm suma cu un termen. Doar schimbăm locul termenilor.'}
    ];
    if(m==='adunare') return [
      {label:k(a,'+',b),ok:true,p:P[0]},
      {label:k(b,'+',a),ok:true,p:P[1]},
      {label:k(s,'+',b),ok:false,why:'Nu pornim de la descăzut. Adunăm diferența ('+a+') cu scăzătorul ('+b+').'},
      {label:k(s,'-',a),ok:false,why:'Aceasta e proba prin scădere. Acum vrem proba prin adunare!'}
    ];
    return [
      {label:k(s,'-',a),ok:true,p:P[2]},
      {label:k(s,'-',b),ok:false,why:'Asta e chiar scăderea din exercițiu! La probă, din descăzut scădem diferența.'},
      {label:k(a,'+',b),ok:false,why:'Aceasta e proba prin adunare. Acum vrem proba prin scădere!'},
      {label:k(s,'+',a),ok:false,why:'Proba prin scădere este o scădere! Din descăzut scădem diferența.'}
    ];
  }

  // ---------- 3. Proba în coloană ----------
  function colGrid(x,op,y,r,filled){
    var W=Math.max(String(x).length,String(y).length,String(r).length);
    var grid=el('div','colop'+(filled?' small':''));
    grid.style.gridTemplateColumns='repeat('+(W+1)+',var(--cw))';
    var cols=[],carry=[],res=[];
    for(var j=0;j<W;j++) cols.push([]);
    function cell(cls,text,j){
      var c=el('div','cell '+cls+(j!=null?' '+PCLS[W-1-j]:''),text);
      if(j!=null) cols[j].push(c);
      grid.appendChild(c);
      return c;
    }
    // ca în manualele din România: semnul stă în dreapta sus, lângă primul număr
    function digitRow(n,signText){
      var s=String(n);
      for(var j=0;j<W;j++){
        var idx=j-(W-s.length);
        cell('',idx>=0?s[idx]:'',j);
      }
      cell('sign',signText,null);
    }
    for(j=0;j<W;j++) cell('hd',PLACE_LETTER[W-1-j],j);
    cell('hd','',null);
    for(j=0;j<W;j++) carry.push(cell('cr','',j));
    cell('cr','',null);
    digitRow(x,sym(op));
    digitRow(y,'');
    grid.appendChild(el('div','bar'));
    grid.appendChild(el('div')); // locul de sub semn
    if(filled) digitRow(r,'');
    else {
      for(j=0;j<W;j++) res.push(cell('res','',j));
      cell('','',null);
    }
    return {grid:grid,cols:cols,carry:carry,res:res,W:W};
  }
  function columnSteps(x,op,y,W){
    var steps=[],cin=0,yLen=String(y).length;
    for(var q=0;q<W;q++){
      var xd=digitAt(x,q),yd=digitAt(y,q),hasY=q<yLen,d,cout,txt;
      if(op==='+'){
        var tot=xd+yd+cin;
        d=tot%10;cout=tot>=10?1:0;
        if(!hasY && !cin) txt='Nu avem ce aduna: coborâm cifra '+xd+'.';
        else txt=xd+(hasY?' + '+yd:'')+(cin?' + 1 (ținut în minte)':'')+' = '+tot+(cout?' → scriem '+d+' și ținem 1 în minte.':'.');
      } else {
        var top=xd-cin,pre='';
        if(cin && xd===0) pre='Aici era 0 și a dat 1 mai departe, așa că împrumută și el 1 din stânga: are acum 9. ';
        else if(cin) pre='Am împrumutat 1 de aici, deci '+xd+' a devenit '+top+'. ';
        if(top-yd<0 && top>=0){
          d=top-yd+10;cout=1;
          txt=pre+'Nu putem scădea '+yd+' din '+top+': împrumutăm 1 din stânga. '+(top+10)+' − '+yd+' = '+d+'.';
        } else if(top<0){
          d=9-yd;cout=1;
          txt=pre+'9 − '+yd+' = '+d+'.';
        } else {
          d=top-yd;cout=0;
          txt=pre+(hasY?top+' − '+yd+' = '+d+'.':(cin?'Scriem '+top+'.':'Nu avem ce scădea: coborâm cifra '+xd+'.'));
        }
      }
      steps.push({d:d,cout:cout,txt:txt});
      cin=cout;
    }
    return steps;
  }
  function columnRound(){
    var ex=newEx(),o=orig(ex),P=probesOf(ex);
    var p=rand(0,9)<7?P[0]:P[2]; // de obicei proba „clasică”, uneori cealaltă
    question.appendChild(taskEl(ex,p.m));
    question.appendChild(document.createTextNode(', în coloană!'));
    var wrap=el('div','col-wrap');
    var left=el('div','col-card');
    left.appendChild(el('div','col-title','Exercițiul'));
    left.appendChild(colGrid(o.x,o.op,o.y,o.r,true).grid);
    var right=el('div','col-card main');
    right.appendChild(el('div','col-title','Proba prin '+p.m));
    var G=colGrid(p.x,p.op,p.y,p.r,false);
    right.appendChild(G.grid);
    wrap.appendChild(left);wrap.appendChild(right);
    visual.appendChild(wrap);
    var steps=columnSteps(p.x,p.op,p.y,G.W);
    var L=String(p.r).length,q=0,mistakes=0;
    for(var e=L;e<G.W;e++) G.res[G.W-1-e].classList.remove('res');
    function j(){return G.W-1-q;}
    function stepText(){
      if(level<=2 || mistakes>0) return 'La '+PLACE[q]+': '+steps[q].txt;
      return 'Ce scriem la '+PLACE[q]+'?';
    }
    function highlight(){
      G.cols.forEach(function(list,i){list.forEach(function(c){c.classList.toggle('act',q<L && i===j());});});
      if(q<L) say((q===0?'Începem cu unitățile! ':'')+stepText());
    }
    var pad=el('div','keypad');
    function press(d,k){
      if(locked || q>=L) return;
      if(d===steps[q].d){
        G.res[j()].textContent=String(d);
        G.res[j()].classList.add('filled');
        if(steps[q].cout && j()>0){
          var cr=G.carry[j()-1];
          cr.textContent=p.op==='+'?'1':'−1';
          cr.classList.add('on');
        }
        tick();
        mistakes=0;
        pad.querySelectorAll('.wrong').forEach(function(w){w.classList.remove('wrong');});
        q++;
        highlight();
        if(q>=L){
          pad.classList.add('off');
          win('Proba iese: '+p.x+' '+sym(p.op)+' '+p.y+' = '+p.r+' – '+p.tgt+'! ✔',3400);
        }
      } else {
        mistakes++;
        if(k){k.classList.remove('wrong');void k.offsetWidth;k.classList.add('wrong');}
        fail('Hmm, nu e '+d+'. '+stepText());
      }
    }
    var keys=[];
    for(var d=0;d<=9;d++){
      (function(d){
        var k=btn('key',String(d),function(){press(d,k);});
        keys[d]=k;
        pad.appendChild(k);
      })(d);
    }
    activity.appendChild(pad);
    keyHandler=function(e){if(/^[0-9]$/.test(e.key)) press(Number(e.key),keys[Number(e.key)]);};
    highlight();
  }

  // ---------- 4. Robotul Calculo ----------
  function wrongResult(ex){
    var correct=ex.op==='+'?ex.s:ex.a, maxV=maxValue();
    var forgot=ex.op==='+'?[correct-10,correct-100]:[correct+10,correct+100];
    var other=[1,-1,10,-10,2,-2];
    if(level>=3) other.push(100,-100);
    other=other.map(function(d){return correct+d;});
    function valid(c){
      return c>=10 && c<=maxV && c!==correct && (ex.op==='+'?c>=ex.b:c<=ex.s);
    }
    forgot=forgot.filter(valid);
    other=other.filter(valid);
    if(carries(ex.a,ex.b)>0 && forgot.length && Math.random()<0.6) return forgot[0];
    return other.length?choice(other):null;
  }
  function robotRound(){
    var ex=newEx(),o=orig(ex);
    var correct=o.r;
    var c=Math.random()<0.5?wrongResult(ex):null;
    if(c===null) c=correct;
    var right=c===correct;
    var m=rand(0,1)?'scădere':'adunare';
    var pr;
    if(ex.op==='+'){
      pr=m==='scădere'?
        {x:c,op:'-',y:ex.b,v:c-ex.b,target:ex.a,tname:'primul termen'}:
        {x:ex.b,op:'+',y:ex.a,v:ex.s,target:c,tname:'suma scrisă de Calculo'};
    } else {
      pr=m==='adunare'?
        {x:c,op:'+',y:ex.b,v:c+ex.b,target:ex.s,tname:'descăzutul'}:
        {x:ex.s,op:'-',y:c,v:ex.s-c,target:ex.b,tname:'scăzătorul'};
    }
    question.textContent='A socotit bine robotul Calculo?';
    var robot=el('div','robot');
    var face=el('div','robot-face','🤖');
    var bubble=el('div','robot-say');
    bubble.appendChild(el('small',null,'Calculo: „Am calculat!”'));
    bubble.appendChild(eqEl([{v:o.x,k:o.xk},sym(o.op),{v:o.y,k:o.yk},'=',{v:c}],'small'));
    robot.appendChild(face);robot.appendChild(bubble);
    visual.appendChild(robot);

    var s1=step('');
    s1.firstChild.appendChild(document.createTextNode('Pasul 1: '));
    s1.firstChild.appendChild(taskEl(ex,m));
    var slot=slotEl();
    s1.appendChild(eqEl([{v:pr.x},sym(pr.op),{v:pr.y},'=',{v:slot}],'small'));
    numPad(s1,slot,pr.v,step2,function(v){return calcHelp(pr.x,pr.op,pr.y,v,pr.v);});
    say(ruleText(ex.op,m)+' Calculează proba!');

    function step2(){
      var s2=step('Pasul 2: Proba dă '+pr.v+'. Trebuia să fie '+pr.tname+': '+pr.target+'. A socotit bine Calculo?');
      choices(s2,[
        {label:'✅ Da, e corect',ok:right,why:pr.v+' nu este egal cu '+pr.target+'. Proba nu iese!'},
        {label:'❌ Nu, a greșit',ok:!right,why:'Proba a dat exact '+pr.target+', deci calculul e bun!'}
      ],function(){
        if(right){
          face.textContent='🤖👍';
          win('Proba iese: '+pr.v+' = '+pr.target+'. Calculo a socotit corect! ✔',3400);
        } else {
          face.textContent='😵‍💫';
          step3();
        }
      },true);
      say('Compară rezultatul probei cu '+pr.tname+'! 🔍');
    }
    function step3(){
      var s3=step('Pasul 3: L-ai prins! Ajută-l pe Calculo: '+o.x+' '+sym(o.op)+' '+o.y+' = ?');
      var opts=numberOptions(correct,3).filter(function(v){return v!==c;});
      opts.push(c);
      choices(s3,opts.map(function(v){
        return {label:String(v),ok:v===correct,why:v===c?'Acesta e chiar rezultatul greșit al lui Calculo! 😄':calcHelp(o.x,o.op,o.y,v,correct)};
      }),function(){
        face.textContent='🤖🔧';
        win('Prins și reparat! Corect este: '+o.x+' '+sym(o.op)+' '+o.y+' = '+correct+' 🕵️‍♀️',3600);
      });
      say('Calculo a greșit! Cât este rezultatul corect? 🤖');
    }
  }

    levelNote.textContent=LEVEL_NOTES[level];
    newRound();
    if(name==='chest' || name==='robot' || name==='house') say(intros[name]);
    moveRebeTo(activeButton(),animateWalk);
  }
  gameButtons.forEach(function(button){
    button.addEventListener('click',function(){selectGame(button.dataset.game,true);});
  });
  levelButtons.forEach(function(button){
    button.addEventListener('click',function(){
      level=Number(button.dataset.level);
      localStorage.setItem('rebe6_level',String(level));
      levelButtons.forEach(function(b){b.classList.toggle('active',b===button);});
      levelNote.textContent=LEVEL_NOTES[level];
      newRound();
      say('Nivelul '+level+'. '+LEVEL_NOTES[level]+'.');
    });
    button.classList.toggle('active',Number(button.dataset.level)===level);
  });
  hintBtn.addEventListener('click',function(){
    hintBox.hidden=!hintBox.hidden;
    hintBtn.setAttribute('aria-expanded',String(!hintBox.hidden));
    if(!hintBox.hidden){
      hintBox.replaceChildren(el('div',null,'💡 '+hints[game]));
      var ul=el('ul','rules');
      RULES.forEach(function(r){ul.appendChild(el('li',null,r));});
      hintBox.appendChild(ul);
      say('Privește indiciul și mai încearcă! 😊');
    }
  });
  document.getElementById('againBtn').addEventListener('click',function(){
    newRound();
    say('O nouă întrebare! Hai să încercăm! 🌈');
  });
  document.addEventListener('keydown',function(e){
    if(keyHandler && !e.ctrlKey && !e.metaKey && !e.altKey && !document.querySelector('.lb-overlay')) keyHandler(e);
  });
  muteBtn.addEventListener('click',function(){
    muted=!muted;
    localStorage.setItem('rebe_muted',muted?'1':'0');
    muteBtn.textContent=muted?'🔇':'🔊';
    muteBtn.setAttribute('aria-label',muted?'Pornește sunetul':'Oprește sunetul');
  });
  starCount.textContent=stars;
  muteBtn.textContent=muted?'🔇':'🔊';
  muteBtn.setAttribute('aria-label',muted?'Pornește sunetul':'Oprește sunetul');
  selectGame('chest',false);
  say('Bună! Sunt Rebe. Azi verificăm calculele cu PROBA! 🔍 Alege cheia potrivită pentru cufăr!');
  window.addEventListener('resize',repositionRebe);
  window.addEventListener('load',repositionRebe);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(repositionRebe);
  setTimeout(repositionRebe,400);
})();
</script>
</body>
</html>
