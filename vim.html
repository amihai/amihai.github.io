  for (let tries = 0; tries < 50; tries++) {
    let r = Math.random() * tot, g = GENS[0];
    for (const x of GENS) { if ((r -= x.w) < 0) { g = x; break; } }
    const text = pick(SNIPPETS);
    let t = null; try { t = g.f(text); } catch (e) { t = null; }
    if (!t) continue;
    if (t.t === 'edit' && sameLines(t.goal, text)) continue;
    const cur = t.t === 'move' && t.targets[0][0] === 0 && t.targets[0][1] === 0 ? [text.length - 1, 0] : [0, 0];
    return Object.assign(t, { text, cur, file: 'challenge.txt', _targets: t.targets, sol: null });
  }
  return null;
}
const Challenge = {
  running: false, score: 0, streak: 0, solved: 0, t0: 0, dur: 90000, timer: null, taskStart: 0,
  open() {
    this.stop();
    $('#view-challenge').innerHTML = `<div class="card center-card">
      <h4>Challenge</h4><h2>Time trial</h2>
      <p>You have <b style="color:#fff">90 seconds</b>. Every solved task scores 100 points, plus a speed bonus and a bonus for consecutive solves. Skipping a task (<kbd>Ctrl</kbd>+<kbd>Enter</kbd>) costs five seconds and resets the bonus.</p>
      <p>Personal best: <b style="color:#fff;font-family:var(--mono)">${P.chBest || 0}</b> · runs: ${P.chRuns || 0}</p>
      <button class="btn primary" id="chStart">Start <small>Enter</small></button>
    </div>`;
    $('#chStart').onclick = () => this.start();
    showView('challenge');
  },
  start() {
    this.score = 0; this.streak = 0; this.solved = 0; this.t0 = Date.now(); this.running = true;
    clearInterval(this.timer); this.timer = setInterval(() => this.tick(), 200);
    this.nextTask();
  },
  secondsLeft() { return Math.max(0, Math.ceil((this.dur - (Date.now() - this.t0)) / 1000)); },
  nextTask() {
    if (!this.running) return;
    const ex = genTask(); this.taskStart = Date.now();
    Play.start(ex, {
      kind: 'challenge', tab: 'challenge',
      crumb: `<b>Challenge</b> · solved: ${this.solved}`,
      meter: () => `<span>Score <b>${this.score}</b></span>${this.streak > 1 ? `<span>Streak <b>×${this.streak}</b></span>` : ''}<span><b id="pSec">${this.secondsLeft()}</b> s</span>`,
      onBack: () => this.open(),
      onSkip: () => { this.streak = 0; this.t0 -= 5000; toast('Skipped: minus five seconds.'); this.nextTask(); },
      onDone: () => {
        if (!this.running) return;
        const dt = (Date.now() - this.taskStart) / 1000;
        const pts = 100 + Math.min(this.streak, 10) * 15 + (dt < 5 ? 50 : dt < 10 ? 25 : 0);
        this.score += pts; this.streak++; this.solved++;
        toast('<span class="gain">+' + pts + '</span>' + (this.streak > 1 ? ' · streak ×' + this.streak : ''));
        this.nextTask();
      },
    });
    this.tick();
  },
  tick() {
    if (!this.running) return;
    const left = this.dur - (Date.now() - this.t0);
    const bar = $('#pTimer'); if (bar) bar.style.width = Math.max(0, left / this.dur * 100) + '%';
    const s = $('#pSec'); if (s) s.textContent = this.secondsLeft();
    if (left <= 0) this.end();
  },
  end() {
    this.stop(); Play.active = false;
    const best = this.score > (P.chBest || 0) && this.score > 0;
    if (best) P.chBest = this.score;
    P.chRuns = (P.chRuns || 0) + 1;
    if (this.solved) touchStreak();
    save(); renderStats();
    const again = () => { hideOverlay(); this.start(); }, close = () => { hideOverlay(); this.open(); };
    showOverlay(`<div class="ov-card ${this.solved ? 'success' : ''}"><div class="eyebrow">Challenge</div><h2>${best ? 'New personal best' : 'Time is up'}</h2>
      <div class="scorebig">${this.score}</div><p>${pl(this.solved, 'task')} solved · personal best ${P.chBest}</p>
      <div class="btns"><button class="btn" id="oClose">Close <small>Esc</small></button><button class="btn primary" id="oAgain">Play again <small>Enter</small></button></div></div>`, { Enter: again, Escape: close });
    $('#oAgain').onclick = again; $('#oClose').onclick = close;
  },
  stop() { this.running = false; clearInterval(this.timer); },
};

/* ---------- Reference ---------- */
function openCheat() {
  $('#view-cheat').innerHTML = `
    <div class="cheat-top"><input id="cheatQ" placeholder="Filter commands or descriptions, e.g. “delete” or “ciw”" autocomplete="off"><span class="muted">✓ = answered correctly several times in Review</span></div>
    <div class="modes-legend">
      <div><b>Normal</b>: keys are commands (<kbd>Esc</kbd> gets you here)</div>
      <div><b>Insert</b>: type text (<kbd>i</kbd> <kbd>a</kbd> <kbd>o</kbd> …)</div>
      <div><b>Visual</b>: select (<kbd>v</kbd> <kbd>V</kbd> <kbd>Ctrl-v</kbd>)</div>
      <div><b>Command-line</b>: <kbd>:</kbd> <kbd>/</kbd> <kbd>?</kbd> then Enter</div>
      <div><b>Grammar</b>: [count] operator [count] motion, e.g. <kbd>d3w</kbd> <kbd>2dd</kbd> <kbd>ci"</kbd> <kbd>y$</kbd></div>
    </div>
    <div class="cheat-grid" id="cheatGrid"></div>`;
  const draw = () => {
    const q = $('#cheatQ').value.trim().toLowerCase();
    $('#cheatGrid').innerHTML = CHAPTERS.map(ch => {
      const rows = ch.cmds.filter(c => !q || c[0].toLowerCase().includes(q) || c[1].toLowerCase().includes(q));
      if (!rows.length) return '';
      return `<div class="card"><h3><span>${chNum(ch)}</span>${esc(ch.title)}</h3><table class="cmdtab">${rows.map(c => { const r = P.rev['q:' + ch.id + ':' + c[0]]; return `<tr><td>${cmdCaps(c[0])}</td><td>${c[1]}${r && r.box >= 3 ? '<span class="m-ok">✓</span>' : ''}</td></tr>`; }).join('')}</table></div>`;
    }).join('') || '<p class="muted">No matching commands.</p>';
  };
  $('#cheatQ').oninput = draw; draw();
  showView('cheat');
}

/* ---------- keyboard + startup ---------- */
document.addEventListener('keydown', e => {
  if (e.target && e.target.matches && e.target.matches('input, textarea, select')) { if (e.key === 'Escape') e.target.blur(); return; }
  const playing = currentView === 'play' && Play.active;
  if (e.repeat && (overlayKeys || !playing)) { e.preventDefault(); return; } // held keys must not skip screens
  if (overlayKeys) { const f = overlayKeys[e.key]; if (f) { e.preventDefault(); f(); } else if (e.key !== 'Shift') e.preventDefault(); return; }
  if (playing) {
    if (e.ctrlKey && e.key === 'Enter') { if (Play.ctx.onSkip) { e.preventDefault(); Play.active = false; Play.ctx.onSkip(); } return; }
    const t = keyToken(e); if (t) { e.preventDefault(); Play.key(t); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (currentView === 'lessons' && e.key === 'Enter') { const b = $('#hContinue'); if (b) { e.preventDefault(); b.click(); } }
  else if (currentView === 'chapter') { if (e.key === 'Enter') { e.preventDefault(); $('#cStart').click(); } else if (e.key === 'Escape') openLessons(); }
  else if (currentView === 'review') Review.onKey(e);
  else if (currentView === 'challenge' && e.key === 'Enter' && $('#chStart')) { e.preventDefault(); $('#chStart').click(); }
});
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b) b.blur(); });
function confirmReset() {
  const cancel = () => hideOverlay();
  const doReset = () => {
    Challenge.stop();
    P.ex = {}; P.rev = {}; P.streak = { last: null, count: 0 }; P.chBest = 0; P.chRuns = 0;
    save(); renderStats(); openLessons(); toast('Progress has been reset.');
  };
  showOverlay(`<div class="ov-card danger">
    <div class="eyebrow">Reset progress</div>
    <h2>Clear all progress?</h2>
    <p>This removes every solved exercise, the review schedule, your challenge best score and your streak. Settings such as the arrow-key option are kept.</p>
    <p>This cannot be undone.</p>
    <div class="btns"><button class="btn" id="oCancel">Cancel <small>Esc</small></button><button class="btn danger" id="oReset">Reset progress</button></div>
  </div>`, { Escape: cancel });
  $('#oCancel').onclick = cancel; $('#oReset').onclick = doReset;
}
function init() {
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    Challenge.stop();
    const v = b.dataset.view;
    if (v === 'lessons') openLessons(); else if (v === 'review') Review.open(); else if (v === 'challenge') Challenge.open(); else openCheat();
  });
  $('.brand').onclick = () => { Challenge.stop(); openLessons(); };
  $('#btnReset').onclick = confirmReset;
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches) $('#mobileNote').classList.remove('hidden');
  renderStats(); openLessons();
  window.VimDojo = { Vim, CHAPTERS, P, Play, Review, Challenge, genTask };
}
init();
</script>
