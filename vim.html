<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vim Dojo — learn Vim by using it</title>
<meta name="description" content="Learn and review Vim commands with interactive exercises in a real Vim emulator that runs in the browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e1116'/%3E%3Crect x='7' y='6' width='9' height='20' fill='%238fbf6a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1116; --panel:#151a22; --panel2:#1b212b; --line:#27303d;
  --fg:#d0d6e0; --dim:#8b95a5; --faint:#525c6b;
  --green:#9ece6a; --yellow:#d9b26a; --red:#e06c75; --blue:#6f9fd8; --purple:#a98bd6; --cyan:#6fb8c9; --orange:#d9905a;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;
  --ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
kbd,code{font-family:var(--mono);font-size:.86em}
kbd{display:inline-block;min-width:1.6em;text-align:center;padding:0 .4em;margin:0 .05em;border-radius:4px;background:#1f2631;border:1px solid #333d4c;border-bottom-width:2px;color:#e6ebf2;line-height:1.5}
code{background:#1c222c;border-radius:3px;padding:.05em .35em;color:var(--cyan)}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;padding:10px 24px;background:rgba(14,17,22,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--mono);font-weight:700;font-size:17px;white-space:nowrap;cursor:pointer;user-select:none;color:#e6ebf2}
.brand .logo{display:inline-block;width:.6em;height:1.05em;background:var(--green);vertical-align:-3px;margin-right:8px;animation:blink 1.1s steps(1) infinite}
.brand b{color:var(--green);font-weight:700}
@keyframes blink{50%{opacity:0}}
.tabs{display:flex;gap:4px;flex:1}
.tab{background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 12px;color:var(--dim);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--fg);background:var(--panel2);border-color:var(--line)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:#2d3645;color:var(--fg);font-size:11px;font-weight:600;line-height:18px;text-align:center}
.badge:empty{display:none}
.stats{display:flex;align-items:center;gap:18px;white-space:nowrap;font-size:13px;color:var(--dim)}
.stats b{color:var(--fg);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:26px 24px 60px}
.view{display:none}
.view.active{display:block}
.mobile-note{max-width:1180px;margin:12px auto 0;padding:10px 16px;border-radius:6px;background:#2a2418;color:#e8d4ae;border:1px solid #4d4128}

/* buttons */
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 14px;font-weight:500}
.btn:hover{border-color:#3a4555;background:#212834}
.btn.primary{background:var(--green);color:#0f1a09;border-color:var(--green);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:#3a1d22;border-color:#6b2c35;color:#f3c4c9;font-weight:600}
.btn.danger:hover{background:#4a232a;border-color:#8a3844}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn small{opacity:.6;font-weight:400;margin-left:4px}

/* rating: three small bars */
.rt{display:inline-flex;gap:3px;vertical-align:middle}
.rt i{width:14px;height:5px;border-radius:1px;background:#2e3744}
.rt.r1 i:nth-child(-n+1),.rt.r2 i:nth-child(-n+2),.rt.r3 i:nth-child(-n+3){background:var(--yellow)}
.rt.r3 i{background:var(--green)!important}
.rt.big i{width:34px;height:8px;border-radius:2px}

/* lessons */
.hero{display:flex;gap:30px;align-items:flex-start;justify-content:space-between;padding:26px 28px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:26px}
.hero h1{margin:0 0 8px;font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-.2px}
.hero p{margin:0;color:var(--dim);max-width:640px}
.hero .term{font-family:var(--mono);font-size:13px;color:var(--dim);background:#0b0e12;border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:270px;line-height:1.8}
.hero .term b{color:var(--green);font-weight:600} .hero .term i{color:var(--yellow);font-style:normal}
.progress{height:4px;background:#252d39;border-radius:2px;overflow:hidden;margin:18px 0 14px;max-width:560px}
.progress i{display:block;height:100%;background:var(--green);width:0}
.muted{color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ch-card{position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.ch-card:hover{border-color:#3a4555;background:#171d26}
.ch-card .num{font-family:var(--mono);color:var(--faint);font-size:12px}
.ch-card h3{margin:2px 0 2px;font-size:15px;font-weight:600}
.ch-card p{margin:0 0 10px;color:var(--dim);font-size:13px;min-height:2.6em}
.ch-card .tag{font-family:var(--mono);font-size:12px;color:var(--cyan)}
.ch-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:2px;background:#29313d}
.dots i.s1,.dots i.s2{background:var(--yellow)} .dots i.s3{background:var(--green)}
.ch-card.done{border-color:#34452c}
.ch-card .state{font-size:12px;color:var(--faint)}
.ch-card.done .state{color:var(--green)}

/* chapter */
.ch-head{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.ch-head h2{margin:0;font-size:22px;font-weight:700}
.ch-head .tag{font-family:var(--mono);color:var(--cyan);font-size:13px}
.ch-body{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.card h4{margin:0 0 10px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:600}
.intro p{margin:0 0 10px}
.cmdtab{width:100%;border-collapse:collapse}
.cmdtab td{padding:5px 6px;border-bottom:1px solid #202833;vertical-align:top}
.cmdtab td:first-child{white-space:nowrap;width:1%}
.exlist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.exrow{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 14px}
.exrow:hover{border-color:#3a4555}
.exrow .n{font-family:var(--mono);color:var(--faint);width:20px}
.exrow .ty{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);width:64px}
.exrow .tx{flex:1;color:var(--fg);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* play */
.play-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.crumb{flex:1;color:var(--dim);font-size:14px}
.crumb b{color:var(--fg);font-weight:600}
.meter{display:flex;gap:18px;align-items:center;font-family:var(--mono);font-size:13px;color:var(--dim)}
.meter b{color:#fff;font-weight:600}
.meter .ok{color:var(--green)} .meter .warn{color:var(--yellow)} .meter .over{color:var(--dim)}
.task{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:6px;padding:12px 18px;margin-bottom:14px;font-size:15.5px}
.task .tt{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--blue);font-weight:600;margin-bottom:2px}
.work{display:grid;grid-template-columns:1fr;gap:14px}
.work.two{grid-template-columns:1fr 1fr}
.pane{min-width:0}
.pane-title{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--dim);padding:0 2px 6px}
.pane-title .mod{color:var(--yellow)}
.vim,.goal{position:relative;background:#0a0d11;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-family:var(--mono);font-size:16px;line-height:1.55}
.vim.focus{border-color:#344256}
.vim.solved{border-color:var(--green);box-shadow:0 0 0 3px rgba(158,206,106,.2);transition:border-color .15s,box-shadow .15s}
.vim.shake{animation:shake .15s linear}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.lines{padding:10px 0;min-height:60px;overflow-x:auto}
.ln{display:flex;white-space:pre;min-height:1.55em}
.gut{flex:none;width:3.4em;padding-right:.9em;text-align:right;color:var(--faint);user-select:none;border-left:3px solid transparent}
.gut.curl{color:var(--yellow)}
.gut.d-mod{border-left-color:var(--orange)} .gut.d-extra{border-left-color:var(--red)} .gut.d-ok{border-left-color:#35492b} .gut.d-miss{border-left-color:var(--green)}
.tl{flex:1;padding-right:1em}
.tilde{color:#2a3446}
.cur{background:var(--fg);color:#0a0d11;border-radius:1px}
.cur.ins{background:transparent;color:inherit;box-shadow:inset 2px 0 0 var(--green)}
.cur.rep{background:transparent;color:inherit;box-shadow:inset 0 -3px 0 var(--orange)}
.cur.opp{background:transparent;color:inherit;box-shadow:inset 0 -.55em 0 rgba(208,214,224,.75)}
.sel{background:#2b3d5e}
.hl{background:rgba(217,178,106,.25);color:#f0d9a8}
.hl.inc{background:var(--yellow);color:#111}
.tg{box-shadow:inset 0 0 0 2px var(--red);border-radius:2px;background:rgba(224,108,117,.18)}
.tg2{box-shadow:inset 0 0 0 1px rgba(224,108,117,.35);border-radius:2px}
.mk{background:rgba(169,139,214,.22);box-shadow:inset 0 -2px 0 var(--purple)}
.dl{text-decoration:line-through var(--red);background:rgba(224,108,117,.14)}
.ad{background:rgba(143,191,106,.18);box-shadow:inset 0 -2px 0 var(--green)}
.ln.l-extra .tl{background:rgba(224,108,117,.07)}
.ln.l-miss .tl{background:rgba(143,191,106,.07)}
.ws{color:#566078}
.ctl{color:var(--purple)}
.goal{background:#0b0f0d}
.goal .ln.l-ok .tl{color:#7c9270}
.status{display:flex;justify-content:space-between;gap:10px;padding:5px 12px;background:#121821;border-top:1px solid var(--line);font-size:14px;min-height:2.1em;white-space:pre}
.status .l{overflow:hidden;text-overflow:ellipsis}
.status .mode{color:var(--green);font-weight:600}
.status .mode.v{color:var(--purple)} .status .mode.r{color:var(--orange)}
.status .err{color:#fff;background:#a8404b;padding:0 6px;border-radius:2px}
.status .inf{color:var(--fg)}
.status .cmd{color:#fff}
.status .cmd .cc{background:var(--fg);color:#0a0d11}
.status .r{color:var(--dim);display:flex;gap:16px}
.status .rec{color:var(--red);font-weight:600}
.status .pend{color:var(--yellow)}
.msgbox{position:absolute;left:0;right:0;bottom:2.1em;background:#0e131b;border-top:1px solid var(--line);padding:8px 14px;font-size:13.5px;white-space:pre;max-height:70%;overflow:auto}
.msgbox .more{color:var(--green)}
.keylog{display:flex;flex-wrap:wrap;gap:4px;min-height:32px;margin:12px 0 6px;align-items:center}
.keylog .lbl{color:var(--faint);font-size:12px;margin-right:6px}
.keylog kbd{font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.controls .sp{flex:1}
.hintbox{margin-top:12px;padding:12px 16px;border-radius:6px;background:#171f17;border:1px solid #2d3d27;color:#d3e2c6}
.hintbox.sol{background:#161b27;border-color:#2f3a52;color:var(--fg)}
.refcard{margin-top:16px}
.refcard summary{cursor:pointer;color:var(--dim);font-size:13px}
.refcard .cmdtab{margin-top:8px;font-size:13.5px}
.timerbar{height:3px;background:#252d39;border-radius:2px;overflow:hidden;margin-bottom:12px}
.timerbar i{display:block;height:100%;background:var(--blue);width:100%;transition:width .2s linear}

/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,8,11,.72);display:flex;align-items:center;justify-content:center}
.ov-card{background:var(--panel);border:1px solid #333d4c;border-radius:10px;padding:24px 28px;min-width:360px;max-width:580px;text-align:left;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.ov-card.success{border-top:3px solid var(--green)}
.ov-card.success h2{color:var(--green)}
.ov-card.danger{border-top:3px solid var(--red)}
.ov-card .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);font-weight:600}
.ov-card h2{margin:2px 0 12px;font-size:22px;font-weight:700}
.ov-card .facts{display:flex;gap:26px;margin:4px 0 14px;font-family:var(--mono);font-size:13px;color:var(--dim)}
.ov-card .facts b{display:block;font-size:20px;color:#fff;font-weight:600}
.ov-card p{color:var(--dim);margin:6px 0}
.ov-card .keys{margin:6px 0 10px;display:flex;flex-wrap:wrap;gap:3px}
.ov-card .keys kbd{font-size:12px}
.ov-card .lbl{font-size:12px;color:var(--faint);margin-top:8px}
.ov-card .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);opacity:0;z-index:60;background:#1f2631;border:1px solid #3a4555;color:var(--fg);padding:9px 16px;border-radius:6px;transition:.2s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%)}
.gain{color:var(--green);font-weight:700;font-family:var(--mono)}

/* review / challenge / reference */
.center-card{max-width:660px;margin:10px auto}
.center-card h2{margin:2px 0 8px;font-size:22px}
.center-card p{color:var(--dim)}
.quiz-q{font-size:19px;margin:12px 0 18px}
.quiz-q kbd{font-size:17px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:11px 14px;display:flex;gap:10px;align-items:center;min-height:52px}
.opt:hover{border-color:#3a4555}
.opt .k{font-family:var(--mono);color:var(--faint);font-size:12px}
.opt.good{border-color:var(--green);background:#18221a}
.opt.bad{border-color:var(--red);background:#251a1d}
.rv-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--dim);font-size:13px}
.rv-progress{height:3px;background:#252d39;border-radius:2px;overflow:hidden;margin-bottom:16px}
.rv-progress i{display:block;height:100%;background:var(--blue)}
.boxes{display:flex;gap:8px;margin:16px 0}
.boxes div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:72px}
.boxes b{display:block;font-size:18px;color:#fff;font-weight:600}
.boxes span{font-size:11px;color:var(--dim)}
.scorebig{font-family:var(--mono);font-size:44px;font-weight:700;color:#fff;margin:0 0 4px}
.cheat-top{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.cheat-top input{flex:1;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--fg);font:inherit;outline:none}
.cheat-top input:focus{border-color:#3a4555}
.cheat-grid{columns:3 320px;column-gap:12px}
.cheat-grid .card{break-inside:avoid;margin-bottom:12px;padding:14px 16px}
.cheat-grid h3{margin:0 0 8px;font-size:14px;font-weight:600}
.cheat-grid h3 span{font-family:var(--mono);color:var(--faint);margin-right:6px}
.cheat-grid .cmdtab{font-size:13.5px}
.m-ok{color:var(--green);font-size:11px;margin-left:6px}
.modes-legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.modes-legend div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:13px;color:var(--dim)}
.modes-legend b{font-family:var(--mono);color:var(--fg)}
@media (max-width:900px){
  .top{flex-wrap:wrap;gap:8px;padding:8px 12px}.tabs{order:3;width:100%;overflow-x:auto}
  .ch-body,.work.two{grid-template-columns:1fr}.hero{flex-direction:column}.opts{grid-template-columns:1fr}
  main{padding:14px 12px 50px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand" title="Home"><span class="logo"></span>vim<b>dojo</b></div>
  <nav class="tabs">
    <button class="tab active" data-view="lessons">Lessons</button>
    <button class="tab" data-view="review">Review<span class="badge" id="dueBadge"></span></button>
    <button class="tab" data-view="challenge">Challenge</button>
    <button class="tab" data-view="cheat">Reference</button>
  </nav>
  <div class="stats">
    <span title="Exercises solved"><b id="stSolved">0</b> / <span id="stTotal">0</span> solved</span>
    <span title="Exercises solved at or under par"><b id="stOptimal">0</b> at par</span>
    <span title="Consecutive days with practice"><b id="stStreak">0</b>-day streak</span>
    <button class="btn ghost sm" id="btnReset" title="Clear all progress">Reset progress</button>
  </div>
</header>
<div id="mobileNote" class="mobile-note hidden">This trainer needs a physical keyboard. You can read the lessons on a phone, but the exercises require a computer or an external keyboard.</div>
<main>
  <section class="view active" id="view-lessons"></section>
  <section class="view" id="view-chapter"></section>
  <section class="view" id="view-play"></section>
  <section class="view" id="view-review"></section>
  <section class="view" id="view-challenge"></section>
  <section class="view" id="view-cheat"></section>
</main>
<div id="toast"></div>
<div id="overlay" class="overlay hidden"></div>
<script id="vim-engine">
/* ================= VIM ENGINE (no DOM) ================= */
const WORD_RE = /[\p{L}\p{N}_]/u;
const isWhite = c => c === ' ' || c === '\t';
const isWordCh = c => !!c && WORD_RE.test(c);
function cls(c, big) {
  if (!c || c === ' ' || c === '\t') return 0;
  if (big) return 1;
  return WORD_RE.test(c) ? 2 : 1;
}
function fnb(s) { let i = 0; while (i < s.length && isWhite(s[i])) i++; return i < s.length ? i : Math.max(0, s.length - 1); }
function indentOf(s) { return /^[ \t]*/.exec(s)[0]; }
const cmpPos = (a, b) => a.y !== b.y ? a.y - b.y : a.x - b.x;
const SW = 4;
const NEED = { need: true }, BAD = { bad: true };

const KEY_NAMES = { esc: '<Esc>', cr: '<CR>', enter: '<CR>', return: '<CR>', bs: '<BS>', backspace: '<BS>', tab: '<Tab>', del: '<Del>', delete: '<Del>', up: '<Up>', down: '<Down>', left: '<Left>', right: '<Right>', home: '<Home>', end: '<End>', space: ' ', lt: '<', bar: '|', bslash: '\\', pageup: '<PageUp>', pagedown: '<PageDown>' };
function parseKeys(s) {
  const out = [];
  for (let i = 0; i < s.length; i++) {
    if (s[i] === '<') {
      const m = /^<([^<>\s]{1,10})>/.exec(s.slice(i));
      if (m) {
        const name = m[1]; let tok = null;
        const cm = /^[Cc]-(.)$/.exec(name);
        if (cm) { const ch = cm[1].toLowerCase(); tok = ch === '[' ? '<Esc>' : '<C-' + ch + '>'; }
        else if (KEY_NAMES[name.toLowerCase()]) tok = KEY_NAMES[name.toLowerCase()];
        if (tok) { out.push(tok); i += m[0].length - 1; continue; }
      }
    }
    out.push(s[i]);
  }
  return out;
}
function keysToNotation(keys) { return keys.map(k => k === '<' ? '<lt>' : k).join(''); }
// Special keys <-> raw characters (for macro registers)
const RAW_SPECIAL = { '<Esc>': '\x1b', '<CR>': '\r', '<BS>': '\b', '<Tab>': '\t', '<Del>': '\x7f', '<Up>': '\uE001', '<Down>': '\uE002', '<Left>': '\uE003', '<Right>': '\uE004', '<Home>': '\uE005', '<End>': '\uE006', '<PageUp>': '\uE007', '<PageDown>': '\uE008' };
const RAW_BACK = {}; for (const k in RAW_SPECIAL) RAW_BACK[RAW_SPECIAL[k]] = k;

    if (this.pending.length === 0 && this.mode === 'normal' && !this.oneShot) { this.msg = ''; this.msgErr = false; this.msgLines = null; }

  _afterCmd() {

  _recordDot(r, keys) {

    if (r.type === 'vcmd' || r.type === 'vobj') {

  _exec(c) {

      case 'motion': this._logCmd(c.m.key); return this._doMotion(c);
      case 'op': this._logCmd(c.op + (c.m.key)); this._logCmd(c.op); return this._doOp(c);
      case 'opline': this._logCmd(c.op + c.op.slice(-1)); return this._doOpLine(c);
      case 'cmd': this._logCmd(c.key); return this._doCmd(c);

      case 'vobj': this._logCmd(c.key); return this._visualObj(c);

  _doMotion(c) {
    const m = c.m;

    if (!r) return this._beep();

  // normalized range from the start position and the motion result
  _motionRange(s, r) {

      const [a, b] = cmpPos(s, e) <= 0 ? [s, e] : [e, s];
      return { type: 'line', y1: a.y, y2: b.y, startPos: a };
    }
    let [a, b] = cmpPos(s, e) <= 0 ? [s, e] : [e, s];

  },
  _charRange(a, b, incl, big) {
    if (!incl && b.x === 0 && b.y > a.y) {
      const ly = b.y - 1;
      if (this._inIndent(a)) return { type: 'line', y1: a.y, y2: ly, startPos: a, big };
      b = { y: ly, x: this.lines[ly].length };
      if (b.x > 0) { b.x--; incl = true; }

  },
  _doOp(c) {
    const { op, m } = c;
    if (m.search) return this._startCmdline(m.key, '', { count: c.count, op: c });
    const s = { y: this.cy, x: this.cx };
    let R;
    if (m.obj) {
      R = this._textObj(m.key, c.count || 1, false);
      if (!R) return this._beep();
      if (R.type === 'char' && R.excl && R.end.x === 0 && R.end.y > R.start.y) R = this._charRange(R.start, R.end, false);
    } else {
      const r = this._motion(m, c.count, op);

  _doOpLine(c) {

    const y2 = Math.min(N - 1, this.cy + n - 1);

  },

  /* ---------- text din interval ---------- */
  _getText(R) {
    const L = this.lines;
    if (R.type === 'line') return { type: 'l', lines: L.slice(R.y1, R.y2 + 1) };
    if (R.type === 'block') {
      const out = [];
      for (let y = R.y1; y <= R.y2; y++) out.push(L[y].slice(R.x1, R.eol ? undefined : R.x2 + 1));
      return { type: 'b', lines: out };
    }
    const s = R.start, e = R.end;
    if (s.y === e.y) return { type: 'c', lines: [L[s.y].slice(s.x, e.x)] };
    const out = [L[s.y].slice(s.x)];
    for (let y = s.y + 1; y < e.y; y++) out.push(L[y]);

    return { type: 'c', lines: out };
  },
  _delRange(R) {
    const L = this.lines;

    if (R.type === 'block') {
      for (let y = R.y1; y <= R.y2; y++) { const l = L[y]; this._setLine(y, l.slice(0, R.x1) + (R.eol ? '' : l.slice(R.x2 + 1))); }
      return;
    }
    const s = R.start, e = R.end;
    this._splice(s.y, e.y - s.y + 1, [L[s.y].slice(0, s.x) + L[e.y].slice(e.x)]);
  },
  _rangeEmpty(R) { return R.type === 'char' && cmpPos(R.start, R.end) >= 0; },

  _applyOp(op, R, c) {

    if (op === 'd' && R.type === 'char' && R.end.y > R.start.y && !visual) {

    switch (op) {
      case 'y': {
        if (this._rangeEmpty(R)) return;

        else if (R.type === 'block') { this.cy = R.y1; this.cx = R.x1; }
        else if (R.startPos) { this.cy = R.startPos.y; this.cx = R.startPos.x; }

        const t = this._getText(R);

          const ind = indentOf(L[R.y1]);

          this._startInsert('c', 1);

          return;
        }
        this._delRange(R);
        if (R.type === 'line') {

          if (R.y2 - R.y1 + 1 > 2) this._msgSet((R.y2 - R.y1 + 1) + ' fewer lines');
        } else if (R.type === 'block') { this.cy = R.y1; this.cx = R.x1; }
        else { this.cy = R.start.y; this.cx = R.start.x; }
        if (op === 'c') {
          if (R.type === 'block') {
            const lens = []; for (let y = R.y1; y <= R.y2; y++) lens.push(this.lines[y].length >= R.x1);
            this._startInsert('c', 1, { block: { y1: R.y1, y2: R.y2, col: R.x1, kind: 'c', eol: false, origLen: this.lines[R.y1].length, ok: lens } });
          } else this._startInsert('c', 1);
          return;
        }
        this._clampCursor(); this.curswant = this.cx;
        return;
      }
      case '>': case '<': {
        let y1, y2;
        if (R.type === 'char') { y1 = R.start.y; y2 = R.end.y; if (R.end.x === 0 && y2 > y1) y2--; } else { y1 = R.y1; y2 = R.y2; }
        this._touch();
        const times = visual ? (c.count || 1) : 1;
        for (let y = y1; y <= y2; y++) this._shiftLine(y, op === '>' ? times : -times);
        this.cy = y1; this.cx = fnb(this.lines[y1]); this.curswant = this.cx;
        const n = y2 - y1 + 1;
        if (n > 2) this._msgSet(n + ' lines ' + op + 'ed 1 time');
        return;
      }
      case 'g~': case 'gu': case 'gU': case '~': case 'u': case 'U': {

        if (this._rangeEmpty(R)) return;
        this._touch();
        this._mapRange(R, f);
        if (R.type === 'char') { this.cy = R.start.y; this.cx = R.start.x; }
        else if (R.type === 'block') { this.cy = R.y1; this.cx = R.x1; }
        else if (R.startPos) { this.cy = R.startPos.y; this.cx = visual ? 0 : R.startPos.x; }
        this._clampCursor(); this.curswant = this.cx;
        return;
      }
    }
  },
  _mapRange(R, f) {
    const L = this.lines;
    if (R.type === 'line') { for (let y = R.y1; y <= R.y2; y++) this._setLine(y, f(L[y])); return; }
    if (R.type === 'block') { for (let y = R.y1; y <= R.y2; y++) { const l = L[y], e = R.eol ? l.length : R.x2 + 1; this._setLine(y, l.slice(0, R.x1) + f(l.slice(R.x1, e)) + l.slice(e)); } return; }
    const s = R.start, e = R.end;
    for (let y = s.y; y <= e.y; y++) {
      const l = L[y], a = y === s.y ? s.x : 0, b = y === e.y ? e.x : l.length;
      this._setLine(y, l.slice(0, a) + f(l.slice(a, b)) + l.slice(b));

  },
  _shiftLine(y, times) {
    const l = this.lines[y];
    if (times > 0) { if (l.length) this._setLine(y, ' '.repeat(SW * times) + l); return; }
    const ind = indentOf(l).replace(/\t/g, '    ');
    const nl = Math.max(0, ind.length - SW * -times);

  /* ---------- comenzi simple ---------- */
  _doCmd(c) {

      case 'gI': this.cx = 0; return this._startInsert('gI', n);
      case 'A': this.cx = len; return this._startInsert('A', n);

        this.cy = Math.min(v.end.y, L.length - 1); this.cx = v.end.x; this.curswant = v.want;

        return;
      }
      case 'x': case '<Del>': case 'X': {
        if (k === 'X') { if (this.cx === 0) return this._beep(); return this._applyOp('d', { type: 'char', start: { y: this.cy, x: Math.max(0, this.cx - n) }, end: { y: this.cy, x: this.cx } }, c); }
        if (!len) return this._beep();
        return this._applyOp('d', { type: 'char', start: { y: this.cy, x: this.cx }, end: { y: this.cy, x: Math.min(len, this.cx + n) } }, c);
      }
      case 'D': case 'C': {
        const r = this._motion({ key: '$' }, n, 'd'); if (!r) return this._beep();

        if (k === 'C' && !len && r.y === this.cy) { this._touch(); return this._startInsert('c', 1); }

      }
      case 's': {
        if (!len) { this._touch(); return this._startInsert('c', 1); }
        return this._applyOp('c', { type: 'char', start: { y: this.cy, x: this.cx }, end: { y: this.cy, x: Math.min(len, this.cx + n) } }, c);
      }
      case 'S': case 'Y': {
        if (n > 1 && this.cy >= L.length - 1) return this._beep();
        const y2 = Math.min(L.length - 1, this.cy + n - 1);
        return this._applyOp(k === 'S' ? 'c' : 'y', { type: 'line', y1: this.cy, y2, startPos: { y: this.cy, x: this.cx } }, c);
      }
      case 'p': case 'P': case 'gp': case 'gP': return this._put(c.reg, k === 'P' || k === 'gP', n, k[0] === 'g');
      case 'J': case 'gJ': return this._join(this.cy, Math.max(2, n), k === 'J');
      case '~': {
        if (!len) return this._beep();
        this._touch();
        const e = Math.min(len, this.cx + n), seg = line.slice(this.cx, e);
        const t = seg.split('').map(ch => ch === ch.toUpperCase() ? ch.toLowerCase() : ch.toUpperCase()).join('');
        this._setLine(this.cy, line.slice(0, this.cx) + t + line.slice(e));
        this.cx = Math.min(e, len - 1); this.curswant = this.cx;
        return;
      }
      case 'r': {
        if (this.cx + n > len) return this._beep();

        if (c.arg === '<CR>') {

      case '/': case '?': return this._startCmdline(k, '', { count: c.count });
      case '<C-a>': case '<C-x>': return this._increment(k === '<C-a>' ? n : -n);
      case '<C-d>': case '<C-u>': {

        const amt = this.scrollAmt || Math.max(1, Math.floor(Math.min(this.height, N) / 2));
        if (k === '<C-d>') { if (this.cy >= N - 1) return this._beep(); this.top = Math.min(this.top + amt, Math.max(0, N - this.height)); this.cy = Math.min(N - 1, this.cy + amt); }
        else { if (this.cy === 0) return this._beep(); this.top = Math.max(0, this.top - amt); this.cy = Math.max(0, this.cy - amt); }

      }
      case '<C-f>': case '<PageDown>': case '<C-b>': case '<PageUp>': {
        const N = L.length, h = this.height;
        if (h >= N) { this.cy = (k === '<C-f>' || k === '<PageDown>') ? N - 1 : 0; this.cx = fnb(L[this.cy]); return; }
        if (k === '<C-f>' || k === '<PageDown>') { if (this.top >= N - 1) return this._beep(); this.top = Math.min(N - 1, this.top + Math.max(1, h - 2) * n); this.cy = Math.max(this.cy, this.top); }
        else { if (this.top === 0) return this._beep(); this.top = Math.max(0, this.top - Math.max(1, h - 2) * n); this.cy = Math.min(this.cy, this.top + h - 1); }

      case '<C-e>': case '<C-y>': {

        else { this.top = Math.max(0, this.top - n); if (this.cy > this.top + h - 1) { this.cy = this.top + h - 1; this.cx = this._colFor(this.cy); } }

      }
      case 'zz': case 'z.': this.top = Math.max(0, this.cy - Math.floor((this.height - 1) / 2)); if (k === 'z.') this.cx = fnb(line); return;
      case 'zt': case 'z<CR>': this.top = this.cy; if (k === 'z<CR>') this.cx = fnb(line); return;
      case 'zb': case 'z-': this.top = Math.max(0, this.cy - this.height + 1); if (k === 'z-') this.cx = fnb(line); return;
      case 'ZZ': return this._ex('x');
      case 'ZQ': return this._ex('q!');
      case '&': return this._ex('s');
      case 'g&': return this._ex('%s//~/&');

      }
      case '@': return this._execReg(c.arg, n);
      case 'm': {

        if (c.arg === "'" || c.arg === '`') { this._setJump(); return; }
        return this._beep();
      }
    }
    return this._beep();
  },

  _put(regName, before, count, gp) {
    const v = this._getReg(regName);
    if (!v) { this._err('E353: Nothing in register ' + (regName || '"')); return; }
    this._touch();
    const n = count || 1;
    if (v.type === 'l') {
      const lines = []; for (let k = 0; k < n; k++) lines.push(...v.lines);
      const y = before ? this.cy : this.cy + 1;
      this._splice(y, 0, lines);
      if (gp) { this.cy = Math.min(y + lines.length, this.lines.length - 1); this.cx = 0; }

      const line = this.lines[this.cy];
      const x = before ? this.cx : Math.min(line.length, this.cx + 1);

      const head = line.slice(0, x), tail = line.slice(x);

      }

      const x = before ? this.cx : Math.min(this.lines[this.cy].length, this.cx + 1);

      for (let k = 0; k < v.lines.length; k++) {
        const y = this.cy + k;
        if (y >= this.lines.length) this._splice(this.lines.length, 0, ['']);
        let l = this.lines[y];
        const tail = l.slice(x);
        if (l.length < x) l += ' '.repeat(x - l.length);
        let rep = Array(n).fill(v.lines[k].padEnd(w)).join('');
        if (!tail.length) rep = rep.replace(/\s+$/, '');
        this._setLine(y, l.slice(0, x) + rep + tail);

      this.cx = x;

chapter({
  id: 'hjkl', tag: 'h j k l', title: 'Basic motion', sub: 'Keep your hands on the home row',
  intro: `<p>Vim avoids the arrow keys so your hands can stay on the home row: <kbd>h</kbd> left, <kbd>j</kbd> down, <kbd>k</kbd> up, <kbd>l</kbd> right.</p>
<p>A <b>count</b> repeats a motion: <kbd>5j</kbd> moves five lines down, <kbd>3l</kbd> three characters right. With <code>:set rnu</code> the gutter shows <i>relative</i> line numbers, so you can read the count directly.</p>
<p>Move the cursor onto each highlighted target, in order. Arrow keys are disabled by default to help you build the habit.</p>`,
  cmds: [['h', 'left'], ['j', 'down'], ['k', 'up'], ['l', 'right'], ['5j', 'a count repeats the motion (5 lines down)'], [':set rnu', 'relative line numbers']],

chapter({
  id: 'words', tag: 'w b e', title: 'Word motions', sub: 'Move by words instead of characters',
  intro: `<p><kbd>w</kbd> moves to the start of the next word, <kbd>b</kbd> back to the start of a word, <kbd>e</kbd> to the end of a word and <kbd>ge</kbd> to the end of the previous word.</p>
<p>A <i>word</i> is a run of letters, digits and underscores. Punctuation forms separate words, so <code>foo.bar</code> is three words.</p>
<p>The uppercase versions <kbd>W</kbd> <kbd>B</kbd> <kbd>E</kbd> move by <b>WORD</b>: any run of non-blank characters, so <code>foo.bar()</code> is a single WORD. Counts work here too: <kbd>3w</kbd>.</p>`,
  cmds: [['w', 'start of the next word'], ['b', 'back to the start of a word'], ['e', 'end of the word'], ['ge', 'end of the previous word'], ['W B E', 'the same, by WORD (separated by whitespace only)']],
  ex: [
    { t: 'move', task: 'Move from word to word with <kbd>w</kbd> and <kbd>b</kbd>, using counts where they help.', text: ['const price = computePrice(product, quantity);'], cur: [0, 0], sol: ['2w', '2w', '3w', 'b'], hint: '<code>=</code> and <code>(</code> count as words too.' },
    { t: 'move', task: 'Now the ends of words: <kbd>e</kbd> forward, <kbd>ge</kbd> backward.', text: ['function add(a, b) { return a + b; }'], cur: [0, 0], sol: ['e', '2e', 'ge', '6e'], hint: '<kbd>e</kbd> lands on the last character of a word.' },
    { t: 'move', task: 'Move by WORD with <kbd>W</kbd>, <kbd>B</kbd> and <kbd>E</kbd>. Notice how quickly you get past the URL.', text: ['curl -X POST https://api.example.com/v1/users -d @data.json'], cur: [0, 0], sol: ['3W', 'E', 'W', 'W', 'B', 'B'], hint: 'For <kbd>W</kbd> only whitespace separates WORDS.' },
    { t: 'move', task: 'Word motions continue onto the following lines.', text: ['if (isValid) {', '    send(message);', '}'], cur: [0, 0], sol: ['3w', 'w', '2w', 'b', '5w'], hint: '<kbd>w</kbd> wraps to the next line on its own.' },

chapter({

chapter({

<p><kbd>}</kbd> and <kbd>{</kbd> move to the next/previous paragraph, i.e. the next blank line. <kbd>Ctrl-d</kbd> and <kbd>Ctrl-u</kbd> scroll half a screen down/up. <kbd>H</kbd>, <kbd>M</kbd> and <kbd>L</kbd> move to the top, middle and bottom of the visible screen.</p>`,
  cmds: [['gg', 'first line'], ['G', 'last line'], ['12G', 'line 12 (also :12)'], ['%', 'matching bracket'], ['}', 'next paragraph'], ['{', 'previous paragraph'], ['Ctrl-d', 'half a screen down'], ['Ctrl-u', 'half a screen up'], ['H M L', 'top / middle / bottom of the screen']],

chapter({
  id: 'delete', tag: 'x d dd D', title: 'Deleting', sub: 'Operator + motion',
  intro: `<p><kbd>x</kbd> deletes the character under the cursor and <kbd>X</kbd> the one before it.</p>
<p><kbd>d</kbd> is an <b>operator</b>: on its own it does nothing; you combine it with a motion. <kbd>dw</kbd> deletes to the start of the next word, <kbd>de</kbd> to the end of the word, <kbd>db</kbd> backwards, <kbd>d$</kbd> to the end of the line (shortcut <kbd>D</kbd>), <kbd>d0</kbd> to the start of the line, <kbd>dt)</kbd> up to the next parenthesis.</p>
<p><kbd>dd</kbd> deletes the whole line and <kbd>3dd</kbd> three lines. The grammar is <b>[count] operator [count] motion</b>, for example <kbd>d3w</kbd>.</p>`,

chapter({

<p><kbd>c</kbd> is the <b>change</b> operator: it deletes like <kbd>d</kbd> and then leaves you in Insert mode. <kbd>cw</kbd> changes a word, <kbd>C</kbd> (= <kbd>c$</kbd>) the rest of the line, <kbd>cc</kbd> the whole line, <kbd>ct.</kbd> everything up to the next period.</p>
<p><kbd>s</kbd> substitutes the character under the cursor and <kbd>S</kbd> the whole line. <kbd>~</kbd> toggles case. <kbd>R</kbd> enters Replace mode, where you type over the existing text.</p>`,

chapter({
  id: 'yank', tag: 'y p "a', title: 'Copy and paste', sub: 'Yank, put and registers',
  intro: `<p>In Vim, copying is called <b>yanking</b>: <kbd>yy</kbd> yanks the line, <kbd>yw</kbd> a word, <kbd>y$</kbd> to the end of the line. <kbd>y</kbd> accepts any motion, just like <kbd>d</kbd>.</p>
<p><kbd>p</kbd> puts after the cursor (or below the line, for whole lines) and <kbd>P</kbd> before it (or above).</p>
<p>Whatever you delete with <kbd>d</kbd> or <kbd>x</kbd> is stored as well, so <kbd>dd</kbd> followed by <kbd>p</kbd> moves a line. Two classics: <kbd>ddp</kbd> swaps two lines and <kbd>xp</kbd> swaps two characters.</p>
<p><b>Registers:</b> prefix a command with <kbd>"a</kbd> to use register <i>a</i>: <kbd>"ayy</kbd> yanks into it and <kbd>"ap</kbd> puts from it. There are 26 named registers, <i>a</i> to <i>z</i>.</p>`,
  cmds: [['yy', 'yank the line'], ['yw', 'yank the word'], ['y$', 'yank to the end of the line'], ['p', 'put after the cursor / below the line'], ['P', 'put before the cursor / above the line'], ['ddp', 'swap the line with the next one'], ['xp', 'swap two characters'], ['"ayy', 'yank the line into register a'], ['"ap', 'put from register a']],
  ex: [
    { t: 'edit', task: 'Turn one list item into three: <kbd>yy</kbd>, then <kbd>p</kbd> (or <kbd>2p</kbd>).', text: ['<li>item</li>'], cur: [0, 0], goal: ['<li>item</li>', '<li>item</li>', '<li>item</li>'], sol: 'yy2p', hint: '<kbd>p</kbd> accepts a count too.' },
    { t: 'edit', task: 'The first two lines are in the wrong order. Fix them with <kbd>ddp</kbd>.', text: ['second', 'first', 'third'], cur: [0, 0], goal: ['first', 'second', 'third'], sol: 'ddp', hint: '<kbd>dd</kbd> cuts the line, <kbd>p</kbd> puts it below the current one.' },

chapter({
  id: 'objects', tag: 'iw i" i( it', title: 'Text objects', sub: 'Operate on logical pieces of text',
  intro: `<p>Text objects let you work on a logical piece of text <b>wherever the cursor is inside it</b>: <kbd>iw</kbd> is the word (<b>i</b>nner <b>w</b>ord) and <kbd>aw</kbd> the word plus surrounding space (<b>a</b> <b>w</b>ord).</p>
<p><kbd>i"</kbd> is the text inside double quotes and <kbd>a"</kbd> includes the quotes. The same works for <kbd>i(</kbd> <kbd>i[</kbd> <kbd>i{</kbd> <kbd>i&lt;</kbd>, <kbd>it</kbd> (inside an HTML tag) and <kbd>ip</kbd> (paragraph).</p>
<p>Use them after an operator: <kbd>ciw</kbd>, <kbd>di(</kbd>, <kbd>yi"</kbd>, <kbd>dap</kbd>, <kbd>cit</kbd>. This is one of Vim's most powerful ideas.</p>`,
  cmds: [['ciw', 'change the word under the cursor'], ['daw', 'delete the word and one space'], ['ci"', 'change the text inside quotes'], ['da"', 'delete including the quotes'], ['ci(', 'change the text inside parentheses'], ['di{', 'empty a { } block'], ['cit', 'change the contents of an HTML tag'], ['yi"', 'yank the text inside quotes'], ['dap', 'delete the paragraph']],
  ex: [
    { t: 'edit', task: 'The cursor is in the middle of the word. Change the whole word with <kbd>ciw</kbd> to <code>limit</code>.', text: ['const maxSpeed = 120;'], cur: [0, 'Speed'], goal: ['const limit = 120;'], sol: 'ciwlimit<Esc>', hint: '<kbd>ciw</kbd> does not care where in the word the cursor is.' },
    { t: 'edit', task: 'Change the quoted text with <kbd>ci"</kbd>. It works even when the cursor is before the quotes.', text: ['title = "An old and boring title"'], cur: [0, 0], goal: ['title = "Vim Dojo"'], sol: 'ci"Vim Dojo<Esc>', hint: '<kbd>ci"</kbd> looks for the quotes on the current line.' },
    { t: 'edit', task: 'Replace all the function arguments with <code>x</code> using <kbd>ci(</kbd>.', text: ['result = compute(a + b, c * d, 42)'], cur: [0, 'c * d'], goal: ['result = compute(x)'], sol: 'ci(x<Esc>', hint: 'The cursor is already inside the parentheses.' },
    { t: 'edit', task: 'Delete the repeated word together with its space: <kbd>daw</kbd>.', text: ['Vim is very very fast.'], cur: [0, 'ery', 2], goal: ['Vim is very fast.'], sol: 'daw', hint: '<kbd>daw</kbd> = delete a word.' },
    { t: 'edit', task: 'Empty the function body with <kbd>di{</kbd>.', text: ['function test() {', '    let a = 1;', '    let b = 2;', '    return a + b;', '}'], cur: [2, 6], goal: ['function test() {', '}'], sol: 'di{', hint: 'It works across several lines.' },
    { t: 'edit', task: 'Change the text inside the HTML tag with <kbd>cit</kbd>.', text: ['<h1>Old title</h1>'], cur: [0, 0], goal: ['<h1>Hello Vim</h1>'], sol: 'citHello Vim<Esc>', hint: '<kbd>it</kbd> = inner tag.' },
    { t: 'edit', task: 'Yank the quoted name with <kbd>yi"</kbd> and put it before the “!”.', text: ['name = "Ann"', 'greeting = "Hello, !"'], cur: [0, 0], goal: ['name = "Ann"', 'greeting = "Hello, Ann!"'], sol: 'yi"jf!P', hint: '<kbd>P</kbd> puts before the cursor.' },
    { t: 'edit', task: 'Delete the middle paragraph together with the blank line after it: <kbd>dap</kbd>.', text: ['Paragraph 1, line 1', 'Paragraph 1, line 2', '', 'Paragraph 2 (delete me)', 'still paragraph 2', '', 'Paragraph 3'], cur: [3, 3], goal: ['Paragraph 1, line 1', 'Paragraph 1, line 2', '', 'Paragraph 3'], sol: 'dap', hint: '<kbd>ap</kbd> = a paragraph, including the blank line that follows.' },
  ],
});

chapter({
  id: 'dot', tag: 'u Ctrl-r .', title: 'Undo, redo and repeat', sub: 'u, Ctrl-r and . (the dot command)',
  intro: `<p><kbd>u</kbd> undoes the last change and <kbd>Ctrl-r</kbd> redoes it. Everything typed during a single visit to Insert mode is undone at once.</p>
<p><kbd>.</kbd> (dot) <b>repeats the last change</b>. Do <kbd>A;</kbd><kbd>Esc</kbd> once, move to another line and just press <kbd>.</kbd>. With a count: <kbd>3.</kbd>.</p>
<p>Think of each change as a command you are going to repeat. If you use <kbd>A</kbd> instead of <kbd>$a</kbd>, or <kbd>ciw</kbd> instead of <kbd>cw</kbd>, the dot command works from anywhere on the line or word.</p>`,
  cmds: [['u', 'undo'], ['Ctrl-r', 'redo'], ['.', 'repeat the last change'], ['3.', 'repeat with a new count']],
  ex: [
    { t: 'edit', task: 'An important line was deleted by mistake. Bring it back with <kbd>u</kbd>.', text: ['line 1', 'line 2 (important!)', 'line 3'], setup: 'jdd', cur: [0, 0], goal: ['line 1', 'line 2 (important!)', 'line 3'], sol: 'u', hint: '<kbd>u</kbd> = undo.' },
    { t: 'edit', task: 'On second thought, the line should go. Redo the deletion with <kbd>Ctrl-r</kbd>.', text: ['line 1', 'line to delete', 'line 3'], setup: 'jddu', cur: [0, 0], goal: ['line 1', 'line 3'], sol: '<C-r>', hint: '<kbd>Ctrl</kbd> + <kbd>r</kbd> = redo.' },
    { t: 'edit', task: 'Add <code>;</code> to every line: once with <kbd>A;</kbd><kbd>Esc</kbd>, then <kbd>j</kbd> <kbd>.</kbd> <kbd>j</kbd> <kbd>.</kbd>…', text: ['let a = 1', 'let b = 2', 'let c = 3', 'let d = 4'], cur: [0, 0], goal: ['let a = 1;', 'let b = 2;', 'let c = 3;', 'let d = 4;'], sol: 'A;<Esc>j.j.j.', hint: 'The dot repeats everything: <kbd>A</kbd>, the text and <kbd>Esc</kbd>.' },
    { t: 'edit', task: 'Remove the <code>TODO: </code> prefixes with <kbd>dW</kbd>, then repeat with <kbd>.</kbd>.', text: ['TODO: buy milk', 'call Dan', 'TODO: pay the bills', 'TODO: learn Vim'], cur: [0, 0], goal: ['buy milk', 'call Dan', 'pay the bills', 'learn Vim'], sol: 'dWjj.j.', hint: '<kbd>dW</kbd> deletes “TODO: ” in one go (it is a single WORD).' },
    { t: 'edit', task: 'Replace every <code>var</code> with <code>let</code>: <kbd>ciw</kbd> once, then <kbd>j</kbd> <kbd>.</kbd> on the others.', text: ['var x = 1;', 'var y = 2;', 'print(x + y);', 'var z = 3;'], cur: [0, 0], goal: ['let x = 1;', 'let y = 2;', 'print(x + y);', 'let z = 3;'], sol: 'ciwlet<Esc>j.jj.', hint: '<kbd>ciw</kbd> works anywhere in the word, so <kbd>.</kbd> works right after <kbd>j</kbd>.' },
  ],
});

chapter({
  id: 'search', tag: '/ ? n N * #', title: 'Search', sub: 'Find anything, anywhere',
  intro: `<p><kbd>/</kbd><i>text</i><kbd>Enter</kbd> searches forward and <kbd>?</kbd><i>text</i><kbd>Enter</kbd> searches backward. <kbd>n</kbd> jumps to the next match and <kbd>N</kbd> to the previous one.</p>
<p><kbd>*</kbd> searches forward for the word under the cursor and <kbd>#</kbd> searches backward.</p>
<p>A search is also a <b>motion</b>: <kbd>d/</kbd><i>stop</i><kbd>Enter</kbd> deletes up to the match. To match a whole word only, use <code>/\\&lt;word\\&gt;</code>. <code>:noh</code> clears the highlighting.</p>`,
  cmds: [['/text', 'search forward'], ['?text', 'search backward'], ['n', 'next match'], ['N', 'previous match'], ['*', 'search for the word under the cursor'], ['#', 'the same, backward'], ['d/text', 'delete up to the match'], [':noh', 'clear search highlighting']],
  ex: [
    { t: 'move', task: 'Search with <code>/return</code> and step through the matches with <kbd>n</kbd>.', text: ['function a(x) {', '    if (x > 0) {', '        return x;', '    }', '    return -x;', '}', '', 'function b(y) {', '    return y * 2;', '}'], cur: [0, 0], sol: ['/return<CR>', 'n', 'n', 'N'], hint: 'Type <kbd>/</kbd>, then <code>return</code>, then <kbd>Enter</kbd>.' },
    { t: 'move', task: 'Search backward with <code>?def</code>, then continue with <kbd>n</kbd>.', text: ['def one():', '    pass', '', 'def two():', '    pass', '', 'def three():', '    pass'], cur: [7, 4], sol: ['?def<CR>', 'n', 'N'], hint: 'After <kbd>?</kbd>, <kbd>n</kbd> keeps going backward.' },
    { t: 'move', task: 'With the cursor on <code>total</code>, press <kbd>*</kbd> to find the other occurrences. Then <kbd>#</kbd> to go back.', text: ['let total = 0;', 'for (const x of items) {', '    total += x;', '}', 'console.log(total);'], cur: [0, 4], sol: ['*', '*', '#'], hint: '<kbd>*</kbd> searches for exactly the word under the cursor.' },
    { t: 'edit', task: 'Delete the bracketed text, brackets included, up to “And”: <kbd>d/And</kbd><kbd>Enter</kbd>.', text: ['Keep this. [blah blah nothing useful here] And this.'], cur: [0, '['], goal: ['Keep this. And this.'], sol: 'd/And<CR>', hint: 'The search motion stops just before the match.' },
  ],
});
chapter({
  id: 'visual', tag: 'v V Ctrl-v', title: 'Visual mode', sub: 'Select first, then act',
  intro: `<p><kbd>v</kbd> starts a characterwise selection, <kbd>V</kbd> a linewise one and <kbd>Ctrl-v</kbd> a <b>blockwise</b> (column) one.</p>
<p>Extend the selection with any motion (<kbd>w</kbd>, <kbd>j</kbd>, <kbd>f)</kbd>, <kbd>iw</kbd>…), then apply a command: <kbd>d</kbd> <kbd>y</kbd> <kbd>c</kbd> <kbd>&gt;</kbd> <kbd>&lt;</kbd> <kbd>~</kbd> <kbd>U</kbd> <kbd>u</kbd> <kbd>J</kbd>… <kbd>o</kbd> moves to the other end of the selection.</p>
<p>The blockwise trick: select a column across several lines, press <kbd>I</kbd> to type the same text on every line at once, or <kbd>$</kbd> then <kbd>A</kbd> to append to all of them.</p>`,
  cmds: [['v', 'characterwise selection'], ['V', 'linewise selection'], ['Ctrl-v', 'blockwise (column) selection'], ['o', 'go to the other end of the selection'], ['> / <', 'indent / dedent the selection'], ['U / u', 'uppercase / lowercase'], ['Ctrl-v … I', 'insert on every line of the block'], ['Ctrl-v … $A', 'append to the end of every line'], ['gv', 'reselect the last selection']],
  ex: [
    { t: 'edit', task: 'Select from the cursor to “)” with <kbd>v</kbd> <kbd>f)</kbd> and delete it with <kbd>d</kbd>.', text: ['Keep this (delete everything in here).'], cur: [0, ' ('], goal: ['Keep this.'], sol: 'vf)d', hint: 'In Visual mode, motions extend the selection.' },
    { t: 'edit', task: 'Indent the function body: <kbd>V</kbd>, select the three lines, then <kbd>&gt;</kbd>.', text: ['def f():', 'print("a")', 'print("b")', 'return 1'], cur: [1, 0], goal: ['def f():', '    print("a")', '    print("b")', '    return 1'], sol: 'Vjj>', hint: '<kbd>V</kbd> <kbd>j</kbd> <kbd>j</kbd> <kbd>&gt;</kbd>' },
    { t: 'edit', task: 'Move the first two lines to the end: select them with <kbd>V</kbd>, cut with <kbd>d</kbd>, go to the bottom and put.', text: ['line 3', 'line 4', 'line 1', 'line 2'], cur: [0, 0], goal: ['line 1', 'line 2', 'line 3', 'line 4'], sol: 'VjdGp', hint: '<kbd>G</kbd> goes to the last line and <kbd>p</kbd> puts below it.' },
    { t: 'edit', task: 'Comment out all lines at once: <kbd>Ctrl-v</kbd>, <kbd>3j</kbd>, <kbd>I</kbd>, type <code># </code>, then <kbd>Esc</kbd>.', text: ['alpha = 1', 'beta = 2', 'gamma = 3', 'delta = 4'], cur: [0, 0], goal: ['# alpha = 1', '# beta = 2', '# gamma = 3', '# delta = 4'], sol: '<C-v>3jI# <Esc>', hint: 'The text appears on the other lines only after <kbd>Esc</kbd>.' },
    { t: 'edit', task: 'Append a comma to every line: <kbd>Ctrl-v</kbd>, <kbd>3j</kbd>, <kbd>$</kbd>, <kbd>A</kbd>, <code>,</code>, <kbd>Esc</kbd>.', text: ['one', 'two', 'three', 'four'], cur: [0, 0], goal: ['one,', 'two,', 'three,', 'four,'], sol: '<C-v>3j$A,<Esc>', hint: 'With <kbd>$</kbd> the block extends to the end of every line.' },
    { t: 'edit', task: 'Uppercase the first word: <kbd>v</kbd> <kbd>e</kbd> <kbd>U</kbd>.', text: ['warning: do not touch!'], cur: [0, 0], goal: ['WARNING: do not touch!'], sol: 'veU', hint: 'In Visual mode <kbd>U</kbd> uppercases the selection.' },
    { t: 'edit', task: 'Delete the column of numbers with a block: <kbd>Ctrl-v</kbd>, <kbd>2j</kbd>, <kbd>2l</kbd>, <kbd>d</kbd>.', text: ['1. red', '2. green', '3. blue'], cur: [0, 0], goal: ['red', 'green', 'blue'], sol: '<C-v>2j2ld', hint: 'The block is three columns wide: digit, period and space.' },

chapter({
  id: 'ex', tag: ':s :g :norm', title: 'Substitute and Ex commands', sub: ':s, :%s, :g, :sort, :normal',
  intro: `<p><code>:s/old/new/</code> replaces the first match on the current line; add <code>g</code> to replace every match on the line. <code>:%s/old/new/g</code> does it in the whole file (<code>%</code> means all lines).</p>
<p>You can give a range such as <code>:2,5s/…</code>, or select lines with <kbd>V</kbd> and press <kbd>:</kbd> (Vim inserts <code>'&lt;,'&gt;</code>). For whole words, use <code>\\&lt;i\\&gt;</code>.</p>
<p><code>:g/pattern/d</code> deletes every line containing the pattern and <code>:v/pattern/d</code> every line that does not. <code>:sort</code> sorts lines. <code>:%norm A;</code> runs the Normal-mode keys <kbd>A;</kbd> on every line.</p>`,
  cmds: [[':s/a/b/', 'replace the first match on the line'], [':s/a/b/g', 'replace every match on the line'], [':%s/a/b/g', 'replace in the whole file'], [":'<,'>s/a/b/", 'replace within the selection'], [':g/x/d', 'delete lines containing x'], [':v/x/d', 'delete lines not containing x'], [':sort', 'sort lines'], [':%norm A;', 'run A; on every line'], [':12', 'go to line 12']],
  ex: [
    { t: 'edit', task: 'Replace every “red” on the line with “green”: <code>:s/red/green/g</code>.', text: ['color: red, background: red, text: red'], cur: [0, 0], goal: ['color: green, background: green, text: green'], sol: ':s/red/green/g<CR>', hint: 'Without <code>g</code> only the first match would change.' },
    { t: 'edit', task: 'Rename the function throughout the file: <code>:%s/getData/fetchData/g</code>.', text: ['function getData(url) {', '    return fetch(url);', '}', '', 'getData("/api/a");', 'getData("/api/b");'], cur: [0, 0], goal: ['function fetchData(url) {', '    return fetch(url);', '}', '', 'fetchData("/api/a");', 'fetchData("/api/b");'], sol: ':%s/getData/fetchData/g<CR>', hint: '<code>%</code> = the whole file.' },
    { t: 'edit', task: 'Clean up the log: delete every line containing <code>DEBUG</code> with <code>:g/DEBUG/d</code>.', text: ['INFO server starting', 'DEBUG connection opened', 'DEBUG reading config', 'INFO server ready', 'DEBUG GET /', 'ERROR file not found'], cur: [0, 0], goal: ['INFO server starting', 'INFO server ready', 'ERROR file not found'], sol: ':g/DEBUG/d<CR>', hint: 'g = global: run the command d on every line that matches.' },
    { t: 'edit', task: 'Sort the list alphabetically with <code>:sort</code>.', text: ['orange', 'banana', 'apple', 'cherry', 'blueberry'], cur: [0, 0], goal: ['apple', 'banana', 'blueberry', 'cherry', 'orange'], sol: ':sort<CR>', hint: 'Without a range, <code>:sort</code> sorts the whole file.' },
    { t: 'edit', task: 'Append <code>;</code> to every line with a single command: <code>:%norm A;</code>.', text: ['let a = 1', 'let b = 2', 'let c = 3', 'let d = 4', 'let e = 5'], cur: [0, 0], goal: ['let a = 1;', 'let b = 2;', 'let c = 3;', 'let d = 4;', 'let e = 5;'], sol: ':%norm A;<CR>', hint: '<code>:norm</code> runs Normal-mode keys on each line of the range.' },
    { t: 'edit', task: 'Change 1 to 2 on the two middle lines only: select them with <kbd>V</kbd><kbd>j</kbd>, press <kbd>:</kbd> and type <code>s/1/2/</code>.', text: ['a = 1', 'b = 1', 'c = 1', 'd = 1'], cur: [1, 0], goal: ['a = 1', 'b = 2', 'c = 2', 'd = 1'], sol: 'Vj:s/1/2/<CR>', hint: "Vim fills in <code>'&lt;,'&gt;</code>, the range of the selection." },
    { t: 'edit', task: 'Rename the variable <code>i</code> to <code>k</code> without touching the “i” inside other words: <code>:s/\\&lt;i\\&gt;/k/g</code>.', text: ['int i = 0; int index = i + 1; print(i);'], cur: [0, 0], goal: ['int k = 0; int index = k + 1; print(k);'], sol: ':s/\\<i\\>/k/g<CR>', hint: '<code>\\&lt;</code> and <code>\\&gt;</code> match the start and end of a word.' },
  ],
});

chapter({
  id: 'macros', tag: 'q @ @@', title: 'Macros', sub: 'Record once, replay many times',
  intro: `<p>A <b>macro</b> records a sequence of keys so you can replay it. <kbd>qq</kbd> starts recording into register <i>q</i> (the status line shows <code>recording @q</code>); make your changes, then press <kbd>q</kbd> to stop.</p>
<p><kbd>@q</kbd> replays the macro, <kbd>@@</kbd> repeats the last one and <kbd>5@q</kbd> runs it five times.</p>
<p>Tip: start the macro from a known position (<kbd>0</kbd> or <kbd>^</kbd>) and end it by moving to the next line (<kbd>j</kbd>). Then you can repeat it as many times as you need.</p>`,
  cmds: [['qq', 'start recording into register q'], ['q', 'stop recording'], ['@q', 'run macro q'], ['@@', 'repeat the last macro'], ['5@q', 'run the macro five times']],
  ex: [
    { t: 'edit', task: 'Turn each name into <code>"name",</code>. Record <kbd>qq</kbd> <kbd>I"</kbd><kbd>Esc</kbd> <kbd>A",</kbd><kbd>Esc</kbd> <kbd>j</kbd> <kbd>q</kbd>, then run <kbd>3@q</kbd>.', text: ['john', 'mary', 'george', 'ellen'], cur: [0, 0], goal: ['"john",', '"mary",', '"george",', '"ellen",'], sol: 'qqI"<Esc>A",<Esc>jq3@q', hint: 'The macro must end on the next line (<kbd>j</kbd>).' },
    { t: 'edit', task: 'Generate a numbered list up to 6: <kbd>qq</kbd> <kbd>yyp</kbd> <kbd>Ctrl-a</kbd> <kbd>q</kbd>, then <kbd>4@q</kbd>.', text: ['Step 1'], cur: [0, 0], goal: ['Step 1', 'Step 2', 'Step 3', 'Step 4', 'Step 5', 'Step 6'], sol: 'qqyyp<C-a>q4@q', hint: '<kbd>Ctrl-a</kbd> adds 1 to the number on the line.' },
    { t: 'edit', task: 'Harder: turn <code>Last,First,Age</code> into <code>First Last (Age)</code> on every line, using a macro.', text: ['Smith,John,35', 'Jones,Mary,28', 'Brown,Dan,41'], cur: [0, 0], goal: ['John Smith (35)', 'Mary Jones (28)', 'Dan Brown (41)'], sol: 'qq0"adt,xf,s <C-r>a (<Esc>A)<Esc>jq2@q', hint: 'Idea: <kbd>"adt,</kbd> stores the last name in register a; in Insert mode <kbd>Ctrl-r</kbd> <kbd>a</kbd> inserts it.' },
  ],
});

chapter({
  id: 'marks', tag: "m ' \" _", title: 'Marks and registers', sub: "m, ' and ` plus the special registers",
  intro: `<p><kbd>ma</kbd> sets a <b>mark</b> named <i>a</i> at the cursor. <kbd>'a</kbd> jumps to the line of the mark and <kbd>\`a</kbd> to its exact position. Marks are motions too: <kbd>d'a</kbd> deletes from the current line to the marked line. <kbd>''</kbd> returns to where you were before the last jump.</p>
<p><b>Special registers:</b> <kbd>"0</kbd> always holds the last <b>yank</b>, even after you delete something. <kbd>"_</kbd> is the black hole register: deleting into it leaves your registers untouched. <code>:reg</code> lists the registers and <code>:marks</code> the marks.</p>`,
  cmds: [['ma', 'set mark a'], ["'a", 'jump to the line of mark a'], ['`a', 'jump to the exact position of mark a'], ["d'a", 'delete up to mark a'], ["''", 'back to where you were before the last jump'], ['"0p', 'put the last yank'], ['"_dd', 'delete without touching the registers'], [':reg', 'list registers'], [':marks', 'list marks']],
  ex: [
    { t: 'edit', task: "Delete the whole block from <code>begin</code> to <code>end</code>: set a mark with <kbd>ma</kbd>, move down to <code>end</code> and delete with <kbd>d'a</kbd>.", text: ['header', '--- begin ---', 'x1', 'x2', 'x3', '--- end ---', 'footer'], cur: [1, 0], goal: ['header', 'footer'], sol: "ma4jd'a", mustUse: ["'"], hint: "<kbd>m</kbd><kbd>a</kbd>, <kbd>4j</kbd>, <kbd>d</kbd><kbd>'</kbd><kbd>a</kbd>." },
    { t: 'edit', task: 'Yank <code>HELLO</code>, delete the middle line, then put the word at the end of the last line. Plain <kbd>p</kbd> would put the deleted line, so use <kbd>"0p</kbd>.', text: ['word: HELLO', 'line to delete', 'here: '], cur: [0, 'HELLO'], goal: ['word: HELLO', 'here: HELLO'], sol: 'yiwjdd$"0p', hint: '<kbd>"0</kbd> is the register of the last yank.' },
    { t: 'edit', task: 'Same idea, but delete the line into the black hole with <kbd>"_dd</kbd>, so a plain <kbd>p</kbd> still puts what you yanked.', text: ['important', 'garbage', 'here: '], cur: [0, 0], goal: ['important', 'here: important'], sol: 'yiwj"_dd$p', hint: '<kbd>"_</kbd> stores nothing.' },
  ],
});

chapter({

  intro: `<p>A few small commands that save a lot of time:</p>
<p><kbd>Ctrl-a</kbd> and <kbd>Ctrl-x</kbd> add 1 to or subtract 1 from the number under (or after) the cursor; <kbd>10 Ctrl-a</kbd> adds ten.</p>
<p><kbd>J</kbd> joins the line with the next one. <kbd>gUiw</kbd> uppercases a word, <kbd>guiw</kbd> lowercases it and <kbd>g~iw</kbd> toggles its case. <kbd>&gt;&gt;</kbd> and <kbd>&lt;&lt;</kbd> indent and dedent a line. <code>:t.</code> duplicates the current line.</p>`,

    { t: 'edit', task: 'The port is off by one: increment it with <kbd>Ctrl-a</kbd>. You do not even need to move onto the number.', text: ['port = 8079'], cur: [0, 0], goal: ['port = 8080'], sol: '<C-a>', hint: '<kbd>Ctrl-a</kbd> uses the first number at or after the cursor.' },

    { t: 'edit', task: 'Indent the three lines under <code>if</code> with <kbd>3&gt;&gt;</kbd>.', text: ['if done:', 'save()', 'close()', 'exit()'], cur: [1, 0], goal: ['if done:', '    save()', '    close()', '    exit()'], sol: '3>>', hint: 'Or <kbd>&gt;&gt;</kbd> followed by <kbd>j</kbd><kbd>.</kbd><kbd>j</kbd><kbd>.</kbd>' },

</script>
<script>
/* ================= UI ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DAY = 86400000;

/* ---------- progress (localStorage) ---------- */
const STORE_KEY = 'vimdojo.v2';
const P = (() => {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { d = null; }

})();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(P)); } catch (e) { } }
function exId(ch, i) { return ch.id + '#' + (i + 1); }
function exStars(ch, i) { const r = P.ex[exId(ch, i)]; return r ? r.stars : 0; }
function chDone(ch) { return ch.ex.every((_, i) => exStars(ch, i) > 0); }
function chStarted(ch) { return ch.ex.some((_, i) => exStars(ch, i) > 0); }
function chSolved(ch) { return ch.ex.filter((_, i) => exStars(ch, i) > 0).length; }
function countAll(f) { return CHAPTERS.reduce((s, ch) => s + ch.ex.filter((_, i) => f(exStars(ch, i))).length, 0); }
function touchStreak() {
  const t = today();
  if (P.streak.last === t) return;
  P.streak.count = P.streak.last === yesterday() ? P.streak.count + 1 : 1;
  P.streak.last = t;
}
function renderStats() {
  $('#stSolved').textContent = countAll(s => s > 0);
  $('#stTotal').textContent = CHAPTERS.reduce((s, ch) => s + ch.ex.length, 0);
  $('#stOptimal').textContent = countAll(s => s === 3);
  $('#stStreak').textContent = P.streak.last === today() || P.streak.last === yesterday() ? P.streak.count : 0;
  const due = reviewDueCount();
  $('#dueBadge').textContent = due ? String(due) : '';
}

/* ---------- UI helpers ---------- */
let toastT = null;
function toast(msg) { const t = $('#toast'); t.innerHTML = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
const KEY_LABEL = { '<Esc>': 'Esc', '<CR>': '⏎', '<BS>': '⌫', '<Tab>': 'Tab', '<Del>': 'Del', ' ': '␣', '<Up>': '↑', '<Down>': '↓', '<Left>': '←', '<Right>': '→', '<Home>': 'Home', '<End>': 'End', '<PageUp>': 'PgUp', '<PageDown>': 'PgDn' };
function keyLabel(k) { if (KEY_LABEL[k]) return KEY_LABEL[k]; const m = /^<C-(.)>$/.exec(k); if (m) return 'Ctrl-' + m[1]; return k; }
function keycaps(keys) { return keys.map(k => '<kbd>' + esc(keyLabel(k)) + '</kbd>').join(''); }
// renders a lesson command ('d2w', 'W B E', 'Ctrl-v … I', ':wq') as keys
function cmdCaps(s) {
  if (/^[:\/?]/.test(s)) return '<code>' + esc(s) + '</code>';
  return s.split(' ').map(part => {
    if (part === '/' || part === '…' || part === '+') return '<span style="color:var(--faint)"> ' + part + ' </span>';
    const m = /^(.*?)<(Esc|CR)>$/.exec(part);
    if (m) return (m[1] ? '<kbd>' + esc(m[1]) + '</kbd>' : '') + '<kbd>' + (m[2] === 'Esc' ? 'Esc' : '⏎') + '</kbd>';
    return '<kbd>' + esc(part) + '</kbd>';
  }).join(' ');
}
const pl = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
function ratingHtml(n, big) { return '<span class="rt r' + n + (big ? ' big' : '') + '" title="' + ratingName(n) + '"><i></i><i></i><i></i></span>'; }
function ratingName(n) { return ['not solved', 'solved', 'good', 'at par'][n] || ''; }
function keyToken(e) {
  if (e.isComposing || e.key === 'Dead' || e.key === 'Unidentified' || e.key === 'Process') return null;
  if (e.metaKey) return null;
  const k = e.key;
  if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'OS', 'AltGraph', 'Fn', 'NumLock', 'ScrollLock'].includes(k)) return null;
  if (e.ctrlKey && !e.altKey) {
    if (k === '[') return '<Esc>';
    if (k.length === 1 && /[a-z]/i.test(k)) return '<C-' + k.toLowerCase() + '>';

  }
  const map = { Escape: '<Esc>', Enter: '<CR>', Backspace: '<BS>', Tab: '<Tab>', Delete: '<Del>', ArrowUp: '<Up>', ArrowDown: '<Down>', ArrowLeft: '<Left>', ArrowRight: '<Right>', Home: '<Home>', End: '<End>', PageUp: '<PageUp>', PageDown: '<PageDown>' };
  if (map[k]) return map[k];
  if (k.length === 1 && k.charCodeAt(0) < 0xD800) return k;
  return null;
}

/* ---------- diff: buffer vs. expected result ---------- */
function lcsPairs(a, b, eq) {
  const n = a.length, m = b.length, dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = eq(a[i], b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const pairs = []; let i = 0, j = 0;
  while (i < n && j < m) { if (eq(a[i], b[j])) { pairs.push([i, j]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  return pairs;
}
function charDiff(a, b) {
  const pr = lcsPairs(a.split(''), b.split(''), (x, y) => x === y);
  const ka = new Set(pr.map(p => p[0])), kb = new Set(pr.map(p => p[1]));
  const del = new Set(), add = new Set();
  for (let i = 0; i < a.length; i++) if (!ka.has(i)) del.add(i);
  for (let j = 0; j < b.length; j++) if (!kb.has(j)) add.add(j);
  return { del, add };
}
function computeDiff(cur, goal) {
  const C = cur.map(() => ({ st: 'extra', del: null })), G = goal.map(() => ({ st: 'miss', add: null }));
  if (cur.length > 60 || goal.length > 60) return { C, G };
  const pairs = lcsPairs(cur, goal, (x, y) => x === y);
  const bounds = [[-1, -1], ...pairs, [cur.length, goal.length]];
  for (const [i, j] of pairs) { C[i].st = 'ok'; G[j].st = 'ok'; }
  for (let k = 0; k < bounds.length - 1; k++) {
    const [i0, j0] = bounds[k], [i1, j1] = bounds[k + 1];
    const n = Math.min(i1 - i0 - 1, j1 - j0 - 1);
    for (let t = 0; t < n; t++) {
      const i = i0 + 1 + t, j = j0 + 1 + t;
      const d = cur[i].length + goal[j].length < 400 ? charDiff(cur[i], goal[j]) : { del: new Set(), add: new Set() };
      C[i] = { st: 'mod', del: d.del }; G[j] = { st: 'mod', add: d.add };
    }
  }
  return { C, G };
}

/* ---------- editor rendering ---------- */
function ctlGlyph(ch) {
  if (ch === '\x1b') return '⎋'; if (ch === '\r') return '↵'; if (ch === '\b') return '⌫'; if (ch === '\t') return '→';
  const c = ch.charCodeAt(0);
  return c >= 0xE001 && c <= 0xE008 ? '◆' : '^';
}
function renderLines(opts) {
  const { lines, top, rows } = opts;
  let html = '';
  for (let r = 0; r < rows; r++) {
    const y = top + r;
    if (y >= lines.length) { html += '<div class="ln"><span class="gut"></span><span class="tl tilde">~</span></div>'; continue; }
    const line = lines[y], len = line.length;
    const li = opts.lineInfo ? opts.lineInfo(y) : {};
    let gut = '';
    if (opts.number || opts.rnu) gut = opts.rnu ? (y === opts.cy ? String(opts.number ? y + 1 : 0) : String(Math.abs(y - opts.cy))) : String(y + 1);
    const sel = opts.sel ? opts.sel(y) : null;
    const hls = opts.hl ? opts.hl(y) : [];
    const n = len + 1;
    const cls = new Array(n).fill('');
    if (sel) for (let x = sel[0]; x < Math.min(sel[1], n); x++) cls[x] += ' sel';
    for (const [a, b, inc] of hls) for (let x = a; x < Math.min(b, len); x++) cls[x] += inc ? ' hl inc' : ' hl';
    if (opts.cellCls) for (let x = 0; x < n; x++) { const c = opts.cellCls(y, x); if (c) cls[x] += ' ' + c; }
    if (opts.cursor && opts.cursor.y === y && opts.cursor.x <= len) cls[opts.cursor.x] += ' cur' + (opts.cursor.cls ? ' ' + opts.cursor.cls : '');
    let body = '', run = '', runC = null;
    const flush = () => { if (run) body += runC ? '<span class="' + runC.trim() + '">' + run + '</span>' : run; run = ''; };
    for (let x = 0; x < n; x++) {
      const ch = x < len ? line[x] : ' ';
      if (x === len && !cls[x]) break;
      const c = cls[x], code = ch.charCodeAt(0);
      let txt;
      if (code < 32 || code === 127 || (code >= 0xE001 && code <= 0xE008)) txt = '<span class="ctl">' + ctlGlyph(ch) + '</span>';
      else if (ch === ' ' && x < len && /\b(dl|ad)\b/.test(c)) txt = '<span class="ws">·</span>';
      else txt = esc(ch);
      if (c !== runC) { flush(); runC = c; }
      run += txt;
    }
    flush();
    html += '<div class="ln ' + (li.cls || '') + '"><span class="gut ' + (li.gut || '') + (y === opts.cy ? ' curl' : '') + '">' + gut + '</span><span class="tl">' + body + '</span></div>';
  }

}
function searchPattern(v) {
  if (v.mode === 'cmdline' && v.cmd && (v.cmd.type === '/' || v.cmd.type === '?') && v.cmd.text) {
    const t = v.cmd.text; let j = 0; for (; j < t.length; j++) { if (t[j] === '\\') { j++; continue; } if (t[j] === v.cmd.type) break; }
    const re = vimRegex(t.slice(0, j), v.opt.ignorecase, v.opt.smartcase);

    return { re, inc: v._findMatch(re, v.cy, v.cx, v.cmd.type === '/' ? 1 : -1) };
  }
  if (v.lastSearch && v.opt.hlsearch && !v.hlOff) { const re = vimRegex(v.lastSearch.pat, v.opt.ignorecase, v.opt.smartcase); return re ? { re, inc: null } : null; }

}

  while ((m = re.exec(v.lines[y])) && g++ < 500) {

}
function visualSel(v, y) {

  const [s, e] = cmpPos(a, b) <= 0 ? [a, b] : [b, a];
  if (y < s.y || y > e.y) return null;
  const len = v.lines[y].length;
  if (v.vmode === 'V') return [0, len + 1];
  if (v.vmode === 'b') { const x1 = Math.min(a.x, b.x), x2 = v.curswant === Infinity ? len : Math.max(a.x, b.x); return [x1, x2 + 1]; }
  return [y === s.y ? s.x : 0, y === e.y ? e.x + 1 : len + 1];
}
/* ---------- navigation ---------- */
let currentView = 'lessons';
function showView(name, tab) {
  hideOverlay(); // any navigation closes the result dialog
  currentView = name;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  const t = tab || ({ chapter: 'lessons', play: 'lessons' }[name] || name);
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.view === t));
  if (name !== 'play') Play.active = false;
  window.scrollTo(0, 0);
}
let overlayKeys = null;
function hideOverlay() { const o = $('#overlay'); o.classList.add('hidden'); o.innerHTML = ''; overlayKeys = null; }
function showOverlay(html, keys) { const o = $('#overlay'); o.innerHTML = html; o.classList.remove('hidden'); overlayKeys = keys || null; }
const TYPE_LABEL = { move: 'Motion', edit: 'Edit', quit: 'Command' };

/* ---------- play screen (shared by lessons, review and challenge) ---------- */
const Play = {
  ex: null, ctx: null, v: null, st: null, keys: [], sawSol: false, done: false, active: false, warnedEdit: false, readyAt: 0,
  start(ex, ctx) {
    this.ex = ex; this.ctx = ctx; this.sawSol = false;
    const hasGoal = ex.t === 'edit' || (ex.t === 'quit' && ex.goal);
    const cmds = ctx.ch ? ctx.ch.cmds : null;
    $('#view-play').innerHTML = `
      <div class="play-head">
        <button class="btn ghost" id="pBack">← Back</button>
        <div class="crumb">${ctx.crumb || ''}</div>
        <div class="meter" id="pMeter"></div>
      </div>
      ${ctx.kind === 'challenge' ? '<div class="timerbar"><i id="pTimer"></i></div>' : ''}
      <div class="task"><div class="tt">${TYPE_LABEL[ex.t]}</div><div id="pTask">${ex.task}</div></div>
      <div class="work ${hasGoal ? 'two' : ''}">
        <div class="pane">
          <div class="pane-title"><span id="pFile"></span><span>${ex.t === 'move' ? 'targets <b id="pTg"></b>' : 'Normal: commands · Insert: text'}</span></div>
          <div class="vim focus" id="pVim"><div class="lines" id="pLines"></div><div class="msgbox hidden" id="pMsgBox"></div><div class="status" id="pStatus"></div></div>
        </div>
        ${hasGoal ? `<div class="pane"><div class="pane-title"><span>Expected result</span><span>green: add · red: remove</span></div><div class="goal" id="pGoal"><div class="lines" id="pGoalLines"></div></div></div>` : ''}
      </div>
      <div class="keylog" id="pKeylog"></div>
      <div class="controls">
        ${ex.hint ? '<button class="btn" id="pHint">Hint</button>' : ''}
        ${ex.sol ? '<button class="btn" id="pSol">Show solution</button>' : ''}
        <button class="btn" id="pReset">Reset</button>
        ${ctx.onSkip ? '<button class="btn" id="pSkip">Skip <small>Ctrl+Enter</small></button>' : ''}
        <span class="sp"></span>
        <button class="btn ghost" id="pArrows" title="Arrow keys are blocked so you practise h j k l"></button>
      </div>
      <div class="hintbox hidden" id="pHintBox"></div>
      ${cmds ? `<details class="refcard" ${ctx.kind === 'lesson' ? 'open' : ''}><summary>Commands in “${esc(ctx.ch.title)}”</summary><table class="cmdtab">${cmds.map(c => `<tr><td>${cmdCaps(c[0])}</td><td>${c[1]}</td></tr>`).join('')}</table></details>` : ''}`;
    $('#pBack').onclick = () => { this.active = false; ctx.onBack && ctx.onBack(); };
    $('#pReset').onclick = () => this.reset();
    if ($('#pHint')) $('#pHint').onclick = () => { const b = $('#pHintBox'); b.className = 'hintbox'; b.innerHTML = '<b>Hint.</b> ' + ex.hint; };
    if ($('#pSol')) $('#pSol').onclick = () => {
      this.sawSol = true; const b = $('#pHintBox'); b.className = 'hintbox sol';
      b.innerHTML = '<b>One solution:</b> ' + keycaps(solSegs(ex).flat()) + (ctx.kind === 'lesson' ? '<br><small>Viewing the solution limits this attempt to the lowest rating. You can come back later for a better one.</small>' : '');
    };
    if ($('#pSkip')) $('#pSkip').onclick = () => { this.active = false; ctx.onSkip(); };
    const upA = () => { $('#pArrows').textContent = P.noArrows ? 'Arrow keys: off' : 'Arrow keys: on'; };
    $('#pArrows').onclick = () => { P.noArrows = !P.noArrows; save(); upA(); };
    upA();
    showView('play', ctx.tab);
    this.reset();
  },
  reset() {
    this.v = makeVim(this.ex); this.st = { ti: 0 }; this.keys = []; this.done = false; this.active = true; this.warnedEdit = false;
    this.readyAt = Date.now() + 250;
    this.render();
  },
  key(tok) {
    if (!this.active || this.done) return;
    if (Date.now() < this.readyAt && (tok === '<CR>' || tok === ' ')) return;
    const v = this.v;
    if (P.noArrows && /^<(Up|Down|Left|Right)>$/.test(tok) && v.mode !== 'cmdline') {
      toast('Arrow keys are disabled: use <kbd>h</kbd> <kbd>j</kbd> <kbd>k</kbd> <kbd>l</kbd>. You can enable them below the editor.'); this.shake(); return;
    }
    if (v.msgLines) { v.msgLines = null; if (tok === '<CR>' || tok === ' ' || tok === '<Esc>') { this.render(); return; } }
    try { v.feed(tok); } catch (err) { console.error(err); toast('Internal error. Press Reset to start the exercise again.'); v.pending = []; v.mode = 'normal'; }
    this.keys.push(tok);

  },
  shake() { const e = $('#pVim'); if (!e) return; e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); },
  finish() {

    const ed = $('#pVim'); if (ed) ed.classList.add('solved');

    const stars = starsFor(n, par, this.sawSol);
    setTimeout(() => this.ctx.onDone({ stars, keys: n, par, keyList: this.keys.slice() }), 300);
  },
  render() {
    const v = this.v, ex = this.ex, goal = ex.goal;
    const T = ex.t === 'move' ? exTargets(ex) : null;
    const D = goal ? computeDiff(v.lines, goal) : null;
    const rows = ex.height || Math.min(VIEW_H, Math.max(v.lines.length, ex.text.length, goal ? goal.length : 0));
    const sp = searchPattern(v);
    let curCls = '';

    const marks = ex.marks || [];
    $('#pLines').innerHTML = renderLines({
      lines: v.lines, top: v.top, rows, cy: v.cy, number: v.opt.number, rnu: v.opt.relativenumber,
      cursor: v.mode === 'cmdline' ? null : { y: v.cy, x: v.cx, cls: curCls },
      sel: y => visualSel(v, y),

        lines: goal, top: 0, rows: Math.max(goal.length, Math.min(rows, VIEW_H)), cy: -1, number: v.opt.number,
        lineInfo: y => { const g = D.G[y]; return g ? { gut: 'd-' + g.st, cls: g.st === 'miss' ? 'l-miss' : g.st === 'ok' ? 'l-ok' : '' } : {}; },

/* ---------- Review (spaced repetition, Leitner boxes) ---------- */
const INTERVALS = [0, 1, 2, 4, 8, 16, 32];
function allCmds() { const out = []; for (const ch of CHAPTERS) for (const c of ch.cmds) out.push({ ch, cmd: c }); return out; }

function exItems() { const out = []; for (const ch of CHAPTERS) ch.ex.forEach((ex, i) => { if (exStars(ch, i)) out.push({ id: 'x:' + exId(ch, i), kind: 'ex', ch, i, ex }); }); return out; }

const Review = {
  queue: [], idx: 0, correct: 0, quiz: null,
  open() {
    const items = [...quizItems(), ...exItems()], now = Date.now();
    const boxes = [0, 0, 0, 0, 0, 0, 0]; let due = 0, fresh = 0;
    for (const it of items) { const r = P.rev[it.id]; if (!r) { fresh++; continue; } boxes[r.box]++; if (r.due <= now) due++; }
    $('#view-review').innerHTML = `<div class="card center-card">
      <h4>Review</h4><h2>Spaced repetition</h2>
      <p>Commands you know well come back less and less often; the ones you miss come back soon. A session mixes quick questions (“what does <kbd>ciw</kbd> do?”) with exercises you have already solved, which you redo from memory.</p>
      ${items.length ? `<div class="boxes">${['New', 'Box 1', 'Box 2', 'Box 3', 'Box 4', 'Box 5+'].map((l, i) => `<div><b>${i === 0 ? fresh : i === 5 ? boxes[5] + boxes[6] : boxes[i]}</b><span>${l}</span></div>`).join('')}</div>
        <p>${[due ? `<b style="color:#fff">${due}</b> due today` : 'Nothing due today', fresh ? `<b style="color:#fff">${fresh}</b> new` : ''].filter(Boolean).join(' · ')}</p>
        <button class="btn primary" id="rvStart">Start session <small>Enter</small></button>`
        : `<p>There is nothing to review yet. Solve a few lessons first; their commands and exercises will appear here.</p><button class="btn primary" id="rvGo">Go to lessons</button>`}
    </div>`;
    if ($('#rvStart')) $('#rvStart').onclick = () => this.start();
    if ($('#rvGo')) $('#rvGo').onclick = openLessons;
    this.quiz = null;
    showView('review');
  },
  start() {
    const now = Date.now(), items = [...quizItems(), ...exItems()];
    const due = items.filter(it => P.rev[it.id] && P.rev[it.id].due <= now).sort((a, b) => P.rev[a.id].due - P.rev[b.id].due);
    const fresh = shuffle(items.filter(it => !P.rev[it.id] && it.kind === 'quiz')).slice(0, 6);
    let queue = shuffle([...due.slice(0, 12), ...fresh]).slice(0, 15);
    if (queue.length < 8) {
      const ids = new Set(queue.map(o => o.id));
      const extra = shuffle(items.filter(it => !ids.has(it.id))).sort((a, b) => ((P.rev[a.id] || { box: 0 }).box - (P.rev[b.id] || { box: 0 }).box));

    }
    this.queue = queue; this.idx = 0; this.correct = 0;
    this.next();
  },
  next() {
    if (this.idx >= this.queue.length) return this.summary();
    const it = this.queue[this.idx];
    if (it.kind === 'ex') {
      Play.start(it.ex, {
        kind: 'review', tab: 'review', ch: it.ch,
        crumb: `<b>Review</b> · ${this.idx + 1} of ${this.queue.length} · ${chNum(it.ch)} ${esc(it.ch.title)}`,
        onBack: () => this.open(),
        onSkip: () => this.answer(it, false),
        onDone: r => { toast(r.stars >= 2 ? '<span class="gain">Correct.</span>' : 'Solved, but well over par. It will come back soon.'); this.answer(it, r.stars >= 2); },

  },
  renderQuiz(it) {

    const opts = shuffle([it.cmd, ...picks]);

      <div class="rv-top"><span>Review · ${this.idx + 1} of ${this.queue.length}</span><span>${chNum(it.ch)} ${esc(it.ch.title)}</span></div>
      <div class="rv-progress"><i style="width:${(this.idx / this.queue.length * 100).toFixed(0)}%"></i></div>

      <div class="opts">${opts.map((c, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${dir === 'k2d' ? esc(c[1]) : cmdCaps(c[0])}</span></button>`).join('')}</div>
      <p class="muted" style="margin-top:16px">Answer with a click or with the keys <kbd>1</kbd>–<kbd>4</kbd>.</p>
    </div>`;
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => this.pick(+b.dataset.i));
    showView('review');
  },
  pick(i) {
    const q = this.quiz; if (!q || q.answered || !q.opts[i]) return;
    q.answered = true;
    const ok = q.opts[i] === q.it.cmd;
    document.querySelectorAll('.opt').forEach((b, j) => { if (q.opts[j] === q.it.cmd) b.classList.add('good'); else if (j === i) b.classList.add('bad'); });

  },
  answer(it, ok) {

  },
  summary() {

      <h4>Review</h4><h2>Session complete</h2>
      <p><b style="color:#fff">${this.correct}</b> of <b style="color:#fff">${n}</b> answered correctly.</p>
      <p>Missed items come back in your next session; the rest are scheduled a few days out.</p>
      <div style="display:flex;gap:10px;margin-top:14px"><button class="btn" id="rvBack">Back</button><button class="btn primary" id="rvAgain">Another session <small>Enter</small></button></div>

  },
  onKey(e) {

    if (e.key === 'Enter') { const b = $('#rvStart') || $('#rvAgain'); if (b) { e.preventDefault(); b.click(); } }
  },
};
