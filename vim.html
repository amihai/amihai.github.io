<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vim Dojo — învață Vim jucându-te</title>
<meta name="description" content="Învață și repetă comenzile Vim printr-un joc interactiv, cu un editor Vim adevărat în browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1017'/%3E%3Crect x='7' y='6' width='9' height='20' fill='%239ece6a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1017; --bg2:#131722; --panel:#171c28; --panel2:#1d2433; --line:#262f42;
  --fg:#c9d1e6; --dim:#7a849c; --faint:#4a5368;
  --green:#9ece6a; --yellow:#e0af68; --red:#f7768e; --blue:#7aa2f7; --purple:#bb9af7; --cyan:#7dcfff; --orange:#ff9e64;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;
  --ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#1b2340 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#1a2a2a 0%,transparent 60%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
kbd,code{font-family:var(--mono);font-size:.88em}
kbd{display:inline-block;min-width:1.6em;text-align:center;padding:0 .4em;margin:0 .06em;border-radius:5px;background:#232b3d;border:1px solid #34405a;border-bottom-width:3px;color:#e6ecff;line-height:1.5}
code{background:#1f2636;border-radius:4px;padding:.05em .35em;color:var(--cyan)}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 22px;background:rgba(13,16,23,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--mono);font-weight:800;font-size:20px;letter-spacing:.5px;white-space:nowrap;cursor:pointer;user-select:none}
.brand .logo{display:inline-block;width:.62em;height:1.05em;background:var(--green);vertical-align:-3px;margin-right:6px;animation:blink 1.1s steps(1) infinite}
.brand b{color:var(--green)}
@keyframes blink{50%{opacity:0}}
.tabs{display:flex;gap:6px;flex:1}
.tab{background:transparent;border:1px solid transparent;border-radius:10px;padding:7px 13px;color:var(--dim);font-weight:600;white-space:nowrap}
.tab:hover{color:var(--fg);background:var(--panel)}
.tab.active{color:var(--fg);background:var(--panel2);border-color:var(--line)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--red);color:#111;font-size:11px;font-weight:800;line-height:18px;text-align:center}
.badge:empty{display:none}
.stats{display:flex;align-items:center;gap:14px;white-space:nowrap}
.stat b{color:#fff}
.lvl{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--dim);min-width:120px}
.xpbar{width:120px;height:6px;border-radius:3px;background:#232b3d;overflow:hidden;margin-top:2px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .6s}
.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;width:36px;height:34px}
main{max-width:1180px;margin:0 auto;padding:22px 22px 60px}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mobile-note{max-width:1180px;margin:12px auto 0;padding:10px 16px;border-radius:10px;background:#3a2a17;color:#ffd9a8;border:1px solid #6b4a20}

/* buttons */
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:#3b4868;background:#222a3b}
.btn.primary{background:var(--green);color:#10150b;border-color:var(--green)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn small{opacity:.7;font-weight:500}

/* lessons map */
.hero{display:flex;gap:26px;align-items:center;justify-content:space-between;padding:26px 28px;border-radius:18px;background:linear-gradient(135deg,#1a2238,#161b28 60%,#142424);border:1px solid var(--line);margin-bottom:24px}
.hero h1{margin:0 0 6px;font-size:30px;line-height:1.2}
.hero h1 span{color:var(--green);font-family:var(--mono)}
.hero p{margin:0;color:var(--dim);max-width:640px}
.hero .term{font-family:var(--mono);font-size:13px;color:var(--dim);background:#0b0e14;border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:260px;line-height:1.7}
.hero .term b{color:var(--green)} .hero .term i{color:var(--yellow);font-style:normal}
.progress{height:8px;background:#232b3d;border-radius:4px;overflow:hidden;margin:14px 0 12px;max-width:520px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));width:0;transition:width .6s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ch-card{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;transition:transform .12s,border-color .12s}
.ch-card:hover{transform:translateY(-2px);border-color:#3b4868}
.ch-card .num{position:absolute;top:12px;right:14px;font-family:var(--mono);color:var(--faint);font-size:12px}
.ch-card .ic{font-size:26px}
.ch-card h3{margin:6px 0 2px;font-size:16px}
.ch-card p{margin:0 0 10px;color:var(--dim);font-size:13px;min-height:2.6em}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:#2a3346}
.dots i.s1{background:#8a6a3a}.dots i.s2{background:#c9952f}.dots i.s3{background:var(--yellow);box-shadow:0 0 6px rgba(224,175,104,.6)}
.ch-card.done{border-color:rgba(158,206,106,.45)}
.ch-card.done::after{content:"✓";position:absolute;right:14px;bottom:10px;color:var(--green);font-weight:800}

/* chapter */
.ch-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ch-head h2{margin:0;font-size:24px}
.ch-head .ic{font-size:34px}
.ch-body{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h4{margin:0 0 10px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.intro p{margin:0 0 10px}
.cmdtab{width:100%;border-collapse:collapse}
.cmdtab td{padding:5px 6px;border-bottom:1px solid #20283a;vertical-align:top}
.cmdtab td:first-child{white-space:nowrap;width:1%}
.exlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.exrow{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 14px}
.exrow:hover{border-color:#3b4868}
.exrow .n{font-family:var(--mono);color:var(--faint);width:22px}
.exrow .ty{font-size:18px}
.exrow .tx{flex:1;color:var(--fg);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.exrow .st{font-size:15px;letter-spacing:1px;white-space:nowrap}
.st .on{color:var(--yellow)} .st .off{color:#394157}

/* play */
.play-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.crumb{flex:1;color:var(--dim);font-size:14px}
.crumb b{color:var(--fg)}
.meter{display:flex;gap:16px;align-items:center;font-family:var(--mono);font-size:13px;color:var(--dim)}
.meter b{color:#fff}
.meter .live{font-size:17px;letter-spacing:2px}
.task{background:linear-gradient(135deg,#1b2338,#171c28);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;padding:14px 18px;margin-bottom:14px;font-size:16px}
.task .tt{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--blue);font-weight:700;margin-bottom:2px}
.work{display:grid;grid-template-columns:1fr;gap:14px}
.work.two{grid-template-columns:1fr 1fr}
.pane{min-width:0}
.pane-title{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--dim);padding:0 4px 6px}
.pane-title .mod{color:var(--yellow)}
.vim,.goal{position:relative;background:#0b0e14;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:var(--mono);font-size:16px;line-height:1.55}
.vim{outline:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.vim.focus{border-color:#34507a;box-shadow:0 0 0 3px rgba(122,162,247,.12),0 10px 30px rgba(0,0,0,.35)}
.vim.shake{animation:shake .18s linear}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.lines{padding:10px 0;min-height:60px;overflow-x:auto}
.ln{display:flex;white-space:pre;min-height:1.55em}
.gut{flex:none;width:3.4em;padding-right:.9em;text-align:right;color:var(--faint);user-select:none;border-left:3px solid transparent}
.gut.curl{color:var(--yellow)}
.gut.d-mod{border-left-color:var(--orange)} .gut.d-extra{border-left-color:var(--red)} .gut.d-ok{border-left-color:#3d5a2c} .gut.d-miss{border-left-color:var(--green)}
.tl{flex:1;padding-right:1em}
.tilde{color:#2c3a5a}
.c{display:inline}
.cur{background:var(--fg);color:#0b0e14;border-radius:1px}
.cur.ins{background:transparent;color:inherit;box-shadow:inset 2px 0 0 var(--green)}
.cur.rep{background:transparent;color:inherit;box-shadow:inset 0 -3px 0 var(--orange)}
.cur.opp{background:transparent;color:inherit;box-shadow:inset 0 -.55em 0 rgba(201,209,230,.8)}
.vim:not(.focus) .cur{background:transparent;color:inherit;outline:1px solid var(--dim)}
.sel{background:#2d3f76}
.hl{background:rgba(224,175,104,.28);color:#ffe2b0}
.hl.inc{background:var(--yellow);color:#111}
.tg{background:rgba(247,118,142,.25);box-shadow:inset 0 0 0 2px var(--red);border-radius:3px;animation:pulse 1s ease-in-out infinite}
.tg2{box-shadow:inset 0 0 0 1px rgba(247,118,142,.35);border-radius:3px}
.cur.tg{animation:none}
@keyframes pulse{50%{box-shadow:inset 0 0 0 2px var(--red),0 0 12px 2px rgba(247,118,142,.55)}}
.mk{background:rgba(187,154,247,.28);box-shadow:inset 0 -2px 0 var(--purple)}
.dl{text-decoration:line-through wavy var(--red);text-decoration-thickness:1px;background:rgba(247,118,142,.14)}
.ad{background:rgba(158,206,106,.2);box-shadow:inset 0 -2px 0 var(--green)}
.ln.l-extra .tl{background:rgba(247,118,142,.08)}
.ln.l-miss .tl{background:rgba(158,206,106,.08)}
.ws{color:#566078}
.ctl{color:var(--purple)}
.goal{background:#0c1110}
.goal .ln.l-ok .tl{color:#7f9a74}
.status{display:flex;justify-content:space-between;gap:10px;padding:5px 12px;background:#141a26;border-top:1px solid var(--line);font-size:14px;min-height:2.1em;white-space:pre}
.status .l{overflow:hidden;text-overflow:ellipsis}
.status .mode{color:var(--green);font-weight:700}
.status .mode.v{color:var(--purple)} .status .mode.r{color:var(--orange)}
.status .err{color:#fff;background:#b33a52;padding:0 6px;border-radius:3px}
.status .inf{color:var(--fg)}
.status .cmd{color:#fff}
.status .cmd .cc{background:var(--fg);color:#0b0e14}
.status .r{color:var(--dim);display:flex;gap:16px}
.status .rec{color:var(--red);font-weight:700}
.status .pend{color:var(--yellow)}
.msgbox{position:absolute;left:0;right:0;bottom:2.1em;background:#0f1420;border-top:1px solid var(--line);padding:8px 14px;font-size:13.5px;white-space:pre;max-height:70%;overflow:auto}
.msgbox .more{color:var(--green)}
.keylog{display:flex;flex-wrap:wrap;gap:4px;min-height:34px;margin:12px 0 6px;align-items:center}
.keylog .lbl{color:var(--faint);font-size:12px;margin-right:6px}
.keylog kbd{font-size:12px}
.keylog kbd.new{animation:pop .25s ease}
@keyframes pop{from{transform:scale(1.35);background:#3b4f7f}}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.controls .sp{flex:1}
.hintbox{margin-top:12px;padding:12px 16px;border-radius:12px;background:#1f2a1c;border:1px solid #37502c;color:#d6ebc4}
.hintbox.sol{background:#1d2135;border-color:#394471;color:var(--fg)}
.refcard{margin-top:16px}
.refcard summary{cursor:pointer;color:var(--dim);font-size:13px}
.refcard .cmdtab{margin-top:8px;font-size:13.5px}
.timerbar{height:6px;background:#232b3d;border-radius:3px;overflow:hidden;margin-bottom:12px}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--yellow),var(--green));width:100%;transition:width .2s linear}
.combo{color:var(--orange);font-weight:800}

/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,7,12,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;animation:fade .2s}
.ov-card{background:var(--panel);border:1px solid #33405e;border-radius:18px;padding:26px 30px;min-width:340px;max-width:560px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.ov-card h2{margin:0 0 4px;font-size:26px}
.ov-card .bigstars{font-size:44px;letter-spacing:6px;margin:6px 0}
.ov-card .bigstars span{display:inline-block;animation:starIn .45s cubic-bezier(.3,1.6,.5,1) both}
.ov-card .bigstars .off{color:#394157}
.ov-card .bigstars .on{color:var(--yellow);text-shadow:0 0 18px rgba(224,175,104,.6)}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.ov-card p{color:var(--dim);margin:6px 0}
.ov-card .keys{margin:10px 0;display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.ov-card .keys kbd{font-size:12px}
.ov-card .btns{display:flex;gap:10px;justify-content:center;margin-top:18px}
.xp-gain{color:var(--green);font-weight:700;font-family:var(--mono)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:#232b3d;border:1px solid #3b4868;color:var(--fg);padding:10px 18px;border-radius:12px;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%)}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:70;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

/* review / challenge / cheat */
.center-card{max-width:640px;margin:10px auto;text-align:center}
.center-card h2{margin:4px 0 8px}
.center-card p{color:var(--dim)}
.bigicon{font-size:48px}
.quiz-q{font-size:20px;margin:10px 0 18px}
.quiz-q kbd{font-size:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.opt{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;min-height:56px}
.opt:hover{border-color:#3b4868}
.opt .k{font-family:var(--mono);color:var(--faint);font-size:12px}
.opt.good{border-color:var(--green);background:#1f2d1b}
.opt.bad{border-color:var(--red);background:#2d1b21}
.rv-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--dim);font-size:13px}
.rv-progress{height:6px;background:#232b3d;border-radius:3px;overflow:hidden;margin-bottom:16px}
.rv-progress i{display:block;height:100%;background:var(--purple);transition:width .3s}
.boxes{display:flex;gap:8px;justify-content:center;margin:16px 0}
.boxes div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:70px}
.boxes b{display:block;font-size:20px;color:#fff}
.boxes span{font-size:11px;color:var(--dim)}
.scorebig{font-family:var(--mono);font-size:56px;font-weight:800;color:var(--yellow);margin:4px 0}
.cheat-top{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.cheat-top input{flex:1;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--fg);font:inherit;outline:none}
.cheat-top input:focus{border-color:#3b4868}
.cheat-grid{columns:3 320px;column-gap:14px}
.cheat-grid .card{break-inside:avoid;margin-bottom:14px;padding:14px 16px}
.cheat-grid h3{margin:0 0 8px;font-size:15px}
.cheat-grid .cmdtab{font-size:13.5px}
.m-ok{color:var(--green);font-size:11px;margin-left:4px}
.modes-legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.modes-legend div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.modes-legend b{font-family:var(--mono)}
@media (max-width:900px){
  .top{flex-wrap:wrap;gap:8px;padding:8px 12px}.tabs{order:3;width:100%;overflow-x:auto}.lvl{display:none}
  .ch-body,.work.two{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.opts{grid-template-columns:1fr}
  main{padding:14px 12px 50px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand" title="Acasă"><span class="logo"></span>Vim<b>Dojo</b></div>
  <nav class="tabs">
    <button class="tab active" data-view="lessons">🎓 Lecții</button>
    <button class="tab" data-view="review">🔁 Repetare<span class="badge" id="dueBadge"></span></button>
    <button class="tab" data-view="challenge">⚡ Provocare</button>
    <button class="tab" data-view="cheat">📖 Fițuică</button>
  </nav>
  <div class="stats">
    <span class="stat" title="Zile la rând în care ai exersat">🔥 <b id="stStreak">0</b></span>
    <span class="stat" title="Stele adunate">⭐ <b id="stStars">0</b></span>
    <span class="lvl"><span id="stLevel">Nivel 1</span><span class="xpbar"><i id="stXp"></i></span></span>
    <button class="icon-btn" id="btnSound" title="Sunet pornit/oprit">🔊</button>
  </div>
</header>
<div id="mobileNote" class="mobile-note hidden">📱 Vim Dojo se joacă cu o tastatură fizică. Pe telefon poți citi lecțiile, dar pentru exerciții ai nevoie de un calculator sau de o tastatură externă.</div>
<main>
  <section class="view active" id="view-lessons"></section>
  <section class="view" id="view-chapter"></section>
  <section class="view" id="view-play"></section>
  <section class="view" id="view-review"></section>
  <section class="view" id="view-challenge"></section>
  <section class="view" id="view-cheat"></section>
</main>
<div id="toast"></div>
<div id="overlay" class="overlay hidden"></div>
<script id="vim-engine">
/* ================= VIM ENGINE (fără DOM) ================= */
const WORD_RE = /[\p{L}\p{N}_]/u;
const isWhite = c => c === ' ' || c === '\t';
const isWordCh = c => !!c && WORD_RE.test(c);
function cls(c, big) {
  if (!c || c === ' ' || c === '\t') return 0;
  if (big) return 1;
  return WORD_RE.test(c) ? 2 : 1;
}
function fnb(s) { let i = 0; while (i < s.length && isWhite(s[i])) i++; return i < s.length ? i : Math.max(0, s.length - 1); }
function indentOf(s) { return /^[ \t]*/.exec(s)[0]; }
const cmpPos = (a, b) => a.y !== b.y ? a.y - b.y : a.x - b.x;
const SW = 4;
const NEED = { need: true }, BAD = { bad: true };

const KEY_NAMES = { esc: '<Esc>', cr: '<CR>', enter: '<CR>', return: '<CR>', bs: '<BS>', backspace: '<BS>', tab: '<Tab>', del: '<Del>', delete: '<Del>', up: '<Up>', down: '<Down>', left: '<Left>', right: '<Right>', home: '<Home>', end: '<End>', space: ' ', lt: '<', bar: '|', bslash: '\\', pageup: '<PageUp>', pagedown: '<PageDown>' };
function parseKeys(s) {
  const out = [];
  for (let i = 0; i < s.length; i++) {
    if (s[i] === '<') {
      const m = /^<([^<>\s]{1,10})>/.exec(s.slice(i));
      if (m) {
        const name = m[1]; let tok = null;
        const cm = /^[Cc]-(.)$/.exec(name);

      if (t[i].length !== 1 && !(k === 'r' && (t[i] === '<CR>' || t[i] === '<Tab>'))) return BAD;
      return done({ type: 'cmd', key: k, arg: t[i], count });
    }
    if (N_CMDS.has(k)) return done({ type: 'cmd', key: k, count });
    return BAD;
  },
  _parseMotion(t, i, op) {
    if (i >= t.length) return NEED;
    const k = t[i];
    if (k === 'g') { if (i + 1 >= t.length) return NEED; const kk = 'g' + t[i + 1]; return G_MOTIONS.has(kk) ? { key: kk } : BAD; }
    if (ARG_MOTIONS.has(k)) { if (i + 1 >= t.length) return NEED; return t[i + 1].length === 1 ? { key: k, arg: t[i + 1] } : BAD; }
    if (op && (k === 'i' || k === 'a')) { if (i + 1 >= t.length) return NEED; return TEXT_OBJS.has(t[i + 1]) ? { key: k + t[i + 1], obj: true } : BAD; }
    if (k === '/' || k === '?') return { key: k, search: true };
    if (MOTIONS.has(k)) return { key: k };
    return BAD;
  },

  _normalKey(key) {
    if (this.pending.length === 0 && this.mode === 'normal' && !this.oneShot) { this.msg = ''; this.msgErr = false; this.msgLines = null; }
    this.pending.push(key);
    const r = this._parseCmd(this.pending, this.mode === 'visual');
    if (r === NEED) return;
    const keys = this.pending; this.pending = [];
    if (r === BAD) { if (key !== '<Esc>' && key !== '<C-c>') this._beep(); return this._afterCmd(); }
    if (this.mode === 'visual') this.vKeys.push(...keys);
    this.changed = false;
    this._exec(r);
    this._recordDot(r, keys);
    this._afterCmd();
  },
  _afterCmd() {
    if (this.oneShot && this.pending.length === 0 && this.mode !== 'cmdline') {
      this.oneShot = false;
      if (this.mode === 'normal') { this.mode = 'insert'; this.ins = this.oneShotIns; }
      this.oneShotIns = null;
    }
  },
  _recordDot(r, keys) {
    const inIns = this.mode === 'insert' || this.mode === 'replace';
    if (this.dotReplaying || (!this.changed && !inIns)) return;
    let rec = null;
    if (r.type === 'vcmd' || r.type === 'vobj') {
      if (r.key === 'y') return;
      rec = { keys: this.vKeys.slice(), count: null, ins: null };
    } else if ((r.type === 'op' || r.type === 'opline') && r.op !== 'y') rec = { keys: r.canon, count: r.count, ins: null };
    else if (r.type === 'cmd' && CHANGE_CMDS.has(r.key)) rec = { keys: r.canon, count: r.count, ins: null };
    if (!rec) return;
    if (this.mode === 'insert' || this.mode === 'replace') { rec.ins = []; this.dotPending = rec; }
    else this.lastChange = rec;
  },

  _exec(c) {
    switch (c.type) {
      case 'motion': this._logCmd(c.m.key); return this._doMotion(c);
      case 'op': this._logCmd(c.op + (c.m.key)); this._logCmd(c.op); return this._doOp(c);
      case 'opline': this._logCmd(c.op + c.op.slice(-1)); return this._doOpLine(c);
      case 'cmd': this._logCmd(c.key); return this._doCmd(c);
      case 'vcmd': this._logCmd('v' + c.key); return this._doVisual(c);
      case 'vobj': this._logCmd(c.key); return this._visualObj(c);
    }
  },
  _doMotion(c) {
    const m = c.m;
    if (m.search) return this._startCmdline(m.key, '', { count: c.count });
    const r = this._motion(m, c.count, null);
    if (!r) return this._beep();
    if (r.jump) this._setJump();
    this.cy = r.y; this.cx = r.x;
    if (!r.keepWant) this.curswant = r.want !== undefined ? r.want : this.cx;
    this._clampCursor();
    if (r.failed) this._beep();
  },
  // interval normalizat din poziția de start și rezultatul mișcării
  _motionRange(s, r) {
    const e = { y: r.y, x: r.x };
    if (r.line) {
      const [a, b] = cmpPos(s, e) <= 0 ? [s, e] : [e, s];
      return { type: 'line', y1: a.y, y2: b.y, startPos: a };
    }
    let [a, b] = cmpPos(s, e) <= 0 ? [s, e] : [e, s];
    return this._charRange(a, b, !!r.incl, r.big);
  },
  _charRange(a, b, incl, big) {
    if (!incl && b.x === 0 && b.y > a.y) {
      const ly = b.y - 1;
      if (this._inIndent(a)) return { type: 'line', y1: a.y, y2: ly, startPos: a, big };
      b = { y: ly, x: this.lines[ly].length };
      if (b.x > 0) { b.x--; incl = true; }
    }
    return { type: 'char', start: { ...a }, end: incl ? this._afterPos(b) : { ...b }, big };
  },
  _doOp(c) {
    const { op, m } = c;
    if (m.search) return this._startCmdline(m.key, '', { count: c.count, op: c });
    const s = { y: this.cy, x: this.cx };
    let R;
    if (m.obj) {
      R = this._textObj(m.key, c.count || 1, false);
      if (!R) return this._beep();
      if (R.type === 'char' && R.excl && R.end.x === 0 && R.end.y > R.start.y) R = this._charRange(R.start, R.end, false);
    } else {
      const r = this._motion(m, c.count, op);
      if (!r) return this._beep();
      if (r.jump) this._setJump();
      R = this._motionRange(s, r);
      if (m.key === 'w' || m.key === 'W') R.wordMotion = true;
    }
    this._applyOp(op, R, c);
  },
  _doOpLine(c) {
    const n = c.count || 1, N = this.lines.length;
    if (n > 1 && this.cy >= N - 1) return this._beep();
    const y2 = Math.min(N - 1, this.cy + n - 1);
    this._applyOp(c.op, { type: 'line', y1: this.cy, y2, startPos: { y: this.cy, x: this.cx }, dbl: true }, c);
  },

  /* ---------- text din interval ---------- */
  _getText(R) {
    const L = this.lines;
    if (R.type === 'line') return { type: 'l', lines: L.slice(R.y1, R.y2 + 1) };
    if (R.type === 'block') {
      const out = [];
      for (let y = R.y1; y <= R.y2; y++) out.push(L[y].slice(R.x1, R.eol ? undefined : R.x2 + 1));
      return { type: 'b', lines: out };
    }
    const s = R.start, e = R.end;
    if (s.y === e.y) return { type: 'c', lines: [L[s.y].slice(s.x, e.x)] };
    const out = [L[s.y].slice(s.x)];
    for (let y = s.y + 1; y < e.y; y++) out.push(L[y]);
    out.push(L[e.y].slice(0, e.x));
    return { type: 'c', lines: out };
  },
  _delRange(R) {
    const L = this.lines;
    if (R.type === 'line') { this._splice(R.y1, R.y2 - R.y1 + 1, []); return; }
    if (R.type === 'block') {
      for (let y = R.y1; y <= R.y2; y++) { const l = L[y]; this._setLine(y, l.slice(0, R.x1) + (R.eol ? '' : l.slice(R.x2 + 1))); }
      return;
    }
    const s = R.start, e = R.end;
    this._splice(s.y, e.y - s.y + 1, [L[s.y].slice(0, s.x) + L[e.y].slice(e.x)]);
  },
  _rangeEmpty(R) { return R.type === 'char' && cmpPos(R.start, R.end) >= 0; },

  _applyOp(op, R, c) {
    const L = this.lines, reg = c.reg, visual = !!c.visual;
    if (op === 'd' && R.type === 'char' && R.end.y > R.start.y && !visual) {
      if (/^[ \t]*$/.test(L[R.end.y].slice(R.end.x)) && this._inIndent(R.start)) R = { type: 'line', y1: R.start.y, y2: R.end.y, startPos: R.start };
    }
    switch (op) {
      case 'y': {
        if (this._rangeEmpty(R)) return;
        const t = this._getText(R);
        this._setReg(reg, t, 'y');
        if (R.type === 'char') { this.cy = R.start.y; this.cx = R.start.x; }
        else if (R.type === 'block') { this.cy = R.y1; this.cx = R.x1; }
        else if (R.startPos) { this.cy = R.startPos.y; this.cx = R.startPos.x; }
        this._clampCursor(); this.curswant = this.cx;
        const n = t.lines.length;
        if (t.type === 'l' && n > 2) this._msgSet(n + ' lines yanked');
        if (t.type === 'b' && n > 2) this._msgSet('block of ' + n + ' lines yanked');
        return;
      }
      case 'd': case 'c': {
        if (this._rangeEmpty(R)) { if (op === 'c') { this.cy = R.start.y; this.cx = R.start.x; this._touch(); this._startInsert('c', 1); } return; }
        this._touch();
        const t = this._getText(R);
        this._setReg(reg, t, 'd', R.big);
        if (op === 'c' && R.type === 'line') {
          const ind = indentOf(L[R.y1]);
          this._splice(R.y1, R.y2 - R.y1 + 1, [ind]);
          this.cy = R.y1; this.cx = ind.length;
          this._startInsert('c', 1);
          if (ind) this.ins.aiY = this.cy;
          return;
        }
        this._delRange(R);
        if (R.type === 'line') {
          this.cy = Math.min(R.y1, this.lines.length - 1); this.cx = fnb(this.lines[this.cy]);
          if (R.y2 - R.y1 + 1 > 2) this._msgSet((R.y2 - R.y1 + 1) + ' fewer lines');
        } else if (R.type === 'block') { this.cy = R.y1; this.cx = R.x1; }
        else { this.cy = R.start.y; this.cx = R.start.x; }
        if (op === 'c') {
          if (R.type === 'block') {
            const lens = []; for (let y = R.y1; y <= R.y2; y++) lens.push(this.lines[y].length >= R.x1);
            this._startInsert('c', 1, { block: { y1: R.y1, y2: R.y2, col: R.x1, kind: 'c', eol: false, origLen: this.lines[R.y1].length, ok: lens } });
          } else this._startInsert('c', 1);
          return;
        }
        this._clampCursor(); this.curswant = this.cx;
        return;
      }
      case '>': case '<': {
        let y1, y2;
        if (R.type === 'char') { y1 = R.start.y; y2 = R.end.y; if (R.end.x === 0 && y2 > y1) y2--; } else { y1 = R.y1; y2 = R.y2; }
        this._touch();
        const times = visual ? (c.count || 1) : 1;
        for (let y = y1; y <= y2; y++) this._shiftLine(y, op === '>' ? times : -times);
        this.cy = y1; this.cx = fnb(this.lines[y1]); this.curswant = this.cx;
        const n = y2 - y1 + 1;
        if (n > 2) this._msgSet(n + ' lines ' + op + 'ed 1 time');
        return;
      }
      case 'g~': case 'gu': case 'gU': case '~': case 'u': case 'U': {
        const f = op === 'gu' || op === 'u' ? s => s.toLowerCase() : op === 'gU' || op === 'U' ? s => s.toUpperCase()
          : s => s.split('').map(ch => ch === ch.toUpperCase() ? ch.toLowerCase() : ch.toUpperCase()).join('');
        if (this._rangeEmpty(R)) return;
        this._touch();
        this._mapRange(R, f);
        if (R.type === 'char') { this.cy = R.start.y; this.cx = R.start.x; }
        else if (R.type === 'block') { this.cy = R.y1; this.cx = R.x1; }
        else if (R.startPos) { this.cy = R.startPos.y; this.cx = visual ? 0 : R.startPos.x; }
        this._clampCursor(); this.curswant = this.cx;
        return;
      }
    }
  },
  _mapRange(R, f) {
    const L = this.lines;
    if (R.type === 'line') { for (let y = R.y1; y <= R.y2; y++) this._setLine(y, f(L[y])); return; }
    if (R.type === 'block') { for (let y = R.y1; y <= R.y2; y++) { const l = L[y], e = R.eol ? l.length : R.x2 + 1; this._setLine(y, l.slice(0, R.x1) + f(l.slice(R.x1, e)) + l.slice(e)); } return; }
    const s = R.start, e = R.end;
    for (let y = s.y; y <= e.y; y++) {
      const l = L[y], a = y === s.y ? s.x : 0, b = y === e.y ? e.x : l.length;
      this._setLine(y, l.slice(0, a) + f(l.slice(a, b)) + l.slice(b));
    }
  },
  _shiftLine(y, times) {
    const l = this.lines[y];
    if (times > 0) { if (l.length) this._setLine(y, ' '.repeat(SW * times) + l); return; }
    const ind = indentOf(l).replace(/\t/g, '    ');
    const nl = Math.max(0, ind.length - SW * -times);
    this._setLine(y, ' '.repeat(nl) + l.replace(/^[ \t]*/, ''));
  },

  /* ---------- comenzi simple ---------- */
  _doCmd(c) {
    const k = c.key, n = c.count || 1, L = this.lines;
    const line = L[this.cy], len = line.length;
    switch (k) {
      case '<Esc>': case '<C-c>': return;
      case 'i': return this._startInsert('i', n);
      case 'a': if (len) this.cx = Math.min(len, this.cx + 1); return this._startInsert('a', n);
      case 'I': { const ind = indentOf(line).length; this.cx = ind; return this._startInsert('I', n); }
      case 'gI': this.cx = 0; return this._startInsert('gI', n);
      case 'A': this.cx = len; return this._startInsert('A', n);
      case 'gi': { const p = this.lastInsertPos; if (p) { this.cy = Math.min(p.y, L.length - 1); this.cx = Math.min(p.x, L[this.cy].length); } return this._startInsert('i', n); }
      case 'o': case 'O': {
        this._touch();
        const ind = indentOf(line), y = k === 'o' ? this.cy + 1 : this.cy;
        this._splice(y, 0, [ind]);
        this.cy = y; this.cx = ind.length;
        this._startInsert(k, n);
        if (ind) this.ins.aiY = y;
        return;
      }
      case 'R': return this._startInsert('R', n);
      case 'v': case 'V': case '<C-v>':
        this.mode = 'visual'; this.vmode = k === 'v' ? 'v' : k === 'V' ? 'V' : 'b';
        this.vStart = { y: this.cy, x: this.cx }; this.vKeys = c.canon.slice();
        return;
      case 'gv': {
        const v = this.lastVisual; if (!v) return this._beep();
        this.mode = 'visual'; this.vmode = v.vmode;
        this.vStart = { y: Math.min(v.start.y, L.length - 1), x: v.start.x };
        this.cy = Math.min(v.end.y, L.length - 1); this.cx = v.end.x; this.curswant = v.want;
        this._clampCursor(); this.vKeys = [];
        return;
      }
      case 'x': case '<Del>': case 'X': {
        if (k === 'X') { if (this.cx === 0) return this._beep(); return this._applyOp('d', { type: 'char', start: { y: this.cy, x: Math.max(0, this.cx - n) }, end: { y: this.cy, x: this.cx } }, c); }
        if (!len) return this._beep();
        return this._applyOp('d', { type: 'char', start: { y: this.cy, x: this.cx }, end: { y: this.cy, x: Math.min(len, this.cx + n) } }, c);
      }
      case 'D': case 'C': {
        const r = this._motion({ key: '$' }, n, 'd'); if (!r) return this._beep();
        const R = this._charRange({ y: this.cy, x: this.cx }, { y: r.y, x: r.x }, true);
        if (k === 'C' && !len && r.y === this.cy) { this._touch(); return this._startInsert('c', 1); }
        return this._applyOp(k === 'D' ? 'd' : 'c', R, c);
      }
      case 's': {
        if (!len) { this._touch(); return this._startInsert('c', 1); }
        return this._applyOp('c', { type: 'char', start: { y: this.cy, x: this.cx }, end: { y: this.cy, x: Math.min(len, this.cx + n) } }, c);
      }
      case 'S': case 'Y': {
        if (n > 1 && this.cy >= L.length - 1) return this._beep();
        const y2 = Math.min(L.length - 1, this.cy + n - 1);
        return this._applyOp(k === 'S' ? 'c' : 'y', { type: 'line', y1: this.cy, y2, startPos: { y: this.cy, x: this.cx } }, c);
      }
      case 'p': case 'P': case 'gp': case 'gP': return this._put(c.reg, k === 'P' || k === 'gP', n, k[0] === 'g');
      case 'J': case 'gJ': return this._join(this.cy, Math.max(2, n), k === 'J');
      case '~': {
        if (!len) return this._beep();
        this._touch();
        const e = Math.min(len, this.cx + n), seg = line.slice(this.cx, e);
        const t = seg.split('').map(ch => ch === ch.toUpperCase() ? ch.toLowerCase() : ch.toUpperCase()).join('');
        this._setLine(this.cy, line.slice(0, this.cx) + t + line.slice(e));
        this.cx = Math.min(e, len - 1); this.curswant = this.cx;
        return;
      }
      case 'r': {
        if (this.cx + n > len) return this._beep();
        this._touch();
        if (c.arg === '<CR>') {
          this._splice(this.cy, 1, [line.slice(0, this.cx), line.slice(this.cx + n)]);
          this.cy++; this.cx = 0; this.curswant = 0; return;
        }
        const ch = c.arg === '<Tab>' ? '\t' : c.arg;
        this._setLine(this.cy, line.slice(0, this.cx) + ch.repeat(n) + line.slice(this.cx + n));
        this.cx += n - 1; this.curswant = this.cx;
        return;
      }
      case 'u': return this._undo(n);
      case '<C-r>': return this._redo(n);
      case '.': return this._dotRepeat(c.count);
      case ':': return this._startCmdline(':', c.count ? (c.count === 1 ? '.' : '.,.+' + (c.count - 1)) : '');
      case '/': case '?': return this._startCmdline(k, '', { count: c.count });
      case '<C-a>': case '<C-x>': return this._increment(k === '<C-a>' ? n : -n);
      case '<C-d>': case '<C-u>': {
        const N = L.length;
        if (c.count) this.scrollAmt = c.count;
        const amt = this.scrollAmt || Math.max(1, Math.floor(Math.min(this.height, N) / 2));
        if (k === '<C-d>') { if (this.cy >= N - 1) return this._beep(); this.top = Math.min(this.top + amt, Math.max(0, N - this.height)); this.cy = Math.min(N - 1, this.cy + amt); }
        else { if (this.cy === 0) return this._beep(); this.top = Math.max(0, this.top - amt); this.cy = Math.max(0, this.cy - amt); }
        this.cx = fnb(L[this.cy]); this.curswant = this.cx;
        return;
      }
      case '<C-f>': case '<PageDown>': case '<C-b>': case '<PageUp>': {
        const N = L.length, h = this.height;
        if (h >= N) { this.cy = (k === '<C-f>' || k === '<PageDown>') ? N - 1 : 0; this.cx = fnb(L[this.cy]); return; }
        if (k === '<C-f>' || k === '<PageDown>') { if (this.top >= N - 1) return this._beep(); this.top = Math.min(N - 1, this.top + Math.max(1, h - 2) * n); this.cy = Math.max(this.cy, this.top); }
        else { if (this.top === 0) return this._beep(); this.top = Math.max(0, this.top - Math.max(1, h - 2) * n); this.cy = Math.min(this.cy, this.top + h - 1); }
        this.cx = fnb(L[this.cy]); this.curswant = this.cx;
        return;
      }
      case '<C-e>': case '<C-y>': {
        const N = L.length, h = this.height;
        if (h >= N) return;
        if (k === '<C-e>') { this.top = Math.min(N - 1, this.top + n); if (this.cy < this.top) { this.cy = this.top; this.cx = this._colFor(this.cy); } }
        else { this.top = Math.max(0, this.top - n); if (this.cy > this.top + h - 1) { this.cy = this.top + h - 1; this.cx = this._colFor(this.cy); } }
        return;
      }
      case 'zz': case 'z.': this.top = Math.max(0, this.cy - Math.floor((this.height - 1) / 2)); if (k === 'z.') this.cx = fnb(line); return;
      case 'zt': case 'z<CR>': this.top = this.cy; if (k === 'z<CR>') this.cx = fnb(line); return;
      case 'zb': case 'z-': this.top = Math.max(0, this.cy - this.height + 1); if (k === 'z-') this.cx = fnb(line); return;
      case 'ZZ': return this._ex('x');
      case 'ZQ': return this._ex('q!');
      case '&': return this._ex('s');
      case 'g&': return this._ex('%s//~/&');
      case 'q': {
        if (this.recording) {
          const keys = this.recKeys.slice(0, -1);
          const val = { type: 'c', lines: [keysToRaw(keys)] };
          const r = this.recording;
          if (/[A-Z]/.test(r)) { const lo = r.toLowerCase(), old = this.regs[lo]; this.regs[lo] = { type: 'c', lines: [(old ? old.lines.join('\n') : '') + val.lines[0]] }; }
          else this.regs[r] = val;
          this.recording = null; this.recKeys = [];
          return;
        }
        if (!/^[a-zA-Z0-9"]$/.test(c.arg)) return this._beep();
        this.recording = c.arg === '"' ? '"' : c.arg; this.recKeys = [];
        return;
      }
      case '@': return this._execReg(c.arg, n);
      case 'm': {
        if (/^[a-zA-Z]$/.test(c.arg)) { this.marks[c.arg] = { y: this.cy, x: this.cx }; return; }
        if (c.arg === "'" || c.arg === '`') { this._setJump(); return; }
        return this._beep();
      }
    }
    return this._beep();
  },

  _put(regName, before, count, gp) {
    const v = this._getReg(regName);
    if (!v) { this._err('E353: Nothing in register ' + (regName || '"')); return; }
    this._touch();
    const n = count || 1;
    if (v.type === 'l') {
      const lines = []; for (let k = 0; k < n; k++) lines.push(...v.lines);
      const y = before ? this.cy : this.cy + 1;
      this._splice(y, 0, lines);
      if (gp) { this.cy = Math.min(y + lines.length, this.lines.length - 1); this.cx = 0; }
      else { this.cy = y; this.cx = fnb(this.lines[y]); }
      if (lines.length > 2) this._msgSet(lines.length + ' more lines');
    } else if (v.type === 'c') {
      const line = this.lines[this.cy];
      const x = before ? this.cx : Math.min(line.length, this.cx + 1);
      const parts = Array(n).fill(v.lines.join('\n')).join('').split('\n');

chapter({
  id: 'copiere', icon: '📋', title: 'Copiere și lipire: y p', sub: 'Yank, put și registre',
  intro: `<p>În Vim, a copia se spune <b>yank</b>: <kbd>yy</kbd> copiază linia, <kbd>yw</kbd> un cuvânt, <kbd>y$</kbd> până la final. După <kbd>y</kbd> merge orice mișcare, exact ca la <kbd>d</kbd>.</p>
<p><kbd>p</kbd> lipește după cursor (sau sub linie, dacă ai copiat linii întregi), <kbd>P</kbd> înainte (sau deasupra).</p>
<p>Tot ce ștergi cu <kbd>d</kbd> sau <kbd>x</kbd> ajunge și el în „clipboard”, deci <kbd>dd</kbd> + <kbd>p</kbd> = mută linia. Trucuri clasice: <kbd>ddp</kbd> inversează două linii, <kbd>xp</kbd> inversează două litere.</p>
<p><b>Registre:</b> <kbd>"a</kbd> înaintea comenzii folosește registrul <i>a</i>: <kbd>"ayy</kbd> copiază în el, <kbd>"ap</kbd> lipește din el. Ai 26 de clipboard-uri, de la a la z!</p>`,
  cmds: [['yy', 'copiază linia'], ['yw', 'copiază cuvântul'], ['y$', 'copiază până la finalul liniei'], ['p', 'lipește după cursor / sub linie'], ['P', 'lipește înainte / deasupra'], ['ddp', 'inversează linia cu următoarea'], ['xp', 'inversează două caractere'], ['"ayy', 'copiază linia în registrul a'], ['"ap', 'lipește din registrul a']],
  ex: [
    { t: 'edit', task: 'Fă 3 elemente din unul singur: <kbd>yy</kbd> apoi <kbd>p</kbd> (sau <kbd>2p</kbd>).', text: ['<li>element</li>'], cur: [0, 0], goal: ['<li>element</li>', '<li>element</li>', '<li>element</li>'], sol: 'yy2p', hint: 'Și <kbd>p</kbd> acceptă număr!' },
    { t: 'edit', task: 'Liniile sunt inversate. Repară-le cu <kbd>ddp</kbd>.', text: ['al doilea', 'primul', 'al treilea'], cur: [0, 0], goal: ['primul', 'al doilea', 'al treilea'], sol: 'ddp', hint: '<kbd>dd</kbd> taie linia, <kbd>p</kbd> o pune sub linia curentă.' },
    { t: 'edit', task: 'Repară greșelile de tastare cu <kbd>xp</kbd>, care inversează două litere.', text: ['Aceasta este o gerseala de tsatare.'], cur: [0, 'erseala'], goal: ['Aceasta este o greseala de tastare.'], sol: 'xp2fsxp', hint: 'Pune cursorul pe prima literă din perechea inversată.' },
    { t: 'edit', task: 'Copiază numele (<kbd>yw</kbd>) și lipește-l la finalul liniei de jos.', text: ['numele meu este Ion', 'salut, '], cur: [0, 'Ion'], goal: ['numele meu este Ion', 'salut, Ion'], sol: 'ywj$p', hint: '<kbd>yw</kbd>, <kbd>j</kbd>, <kbd>$</kbd>, <kbd>p</kbd>.' },
    { t: 'edit', task: 'Folosește două registre: <kbd>"ayw</kbd> pentru ROSU și <kbd>"byw</kbd> pentru VERDE, apoi lipește-le inversat.', text: ['ROSU', 'VERDE', 'culoare 1: ', 'culoare 2: '], cur: [0, 0], goal: ['ROSU', 'VERDE', 'culoare 1: VERDE', 'culoare 2: ROSU'], sol: '"aywj"bywj$"bpj$"ap', hint: 'Registrul se scrie înaintea comenzii: <kbd>"</kbd><kbd>a</kbd><kbd>y</kbd><kbd>w</kbd>.' },
  ],
});

chapter({

<script>
/* ================= UI ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const DAY = 86400000;

/* ---------- progres (localStorage) ---------- */
const STORE_KEY = 'vimdojo.v1';
const P = (() => {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { d = null; }
  return Object.assign({ ex: {}, xp: 0, streak: { last: null, count: 0 }, rev: {}, chBest: 0, chRuns: 0, muted: false, noArrows: true }, d || {});
})();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(P)); } catch (e) { } }
function exId(ch, i) { return ch.id + '#' + (i + 1); }
function exStars(ch, i) { const r = P.ex[exId(ch, i)]; return r ? r.stars : 0; }
function chStars(ch) { return ch.ex.reduce((s, _, i) => s + exStars(ch, i), 0); }
function chDone(ch) { return ch.ex.every((_, i) => exStars(ch, i) > 0); }
function chStarted(ch) { return ch.ex.some((_, i) => exStars(ch, i) > 0); }
function totalStars() { return CHAPTERS.reduce((s, ch) => s + chStars(ch), 0); }
function maxStars() { return CHAPTERS.reduce((s, ch) => s + ch.ex.length * 3, 0); }
const LEVELS = ['Începător', 'Ucenic', 'Explorator', 'Practicant', 'Artizan', 'Ninja', 'Samurai', 'Maestru', 'Guru Vim', 'Legendă'];
function levelInfo(xp) {
  let L = 1; while (100 * L * (L + 1) / 2 <= xp) L++;
  const a = 100 * (L - 1) * L / 2, b = 100 * L * (L + 1) / 2;
  return { L, name: LEVELS[Math.min(L - 1, LEVELS.length - 1)], pct: (xp - a) / (b - a) };
}
function addXp(n) {
  if (!n) return;
  const before = levelInfo(P.xp).L;
  P.xp += n;
  const after = levelInfo(P.xp);
  if (after.L > before) setTimeout(() => { toast('🆙 Nivel nou: ' + after.L + ' — ' + after.name + '!'); Sound.level(); }, 700);
}
function touchStreak() {
  const t = today();
  if (P.streak.last === t) return;
  const y = new Date(Date.now() - DAY); const ys = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
  P.streak.count = P.streak.last === ys ? P.streak.count + 1 : 1;
  P.streak.last = t;
}
function renderStats() {
  const li = levelInfo(P.xp);
  $('#stStreak').textContent = P.streak.last === today() || isYesterday(P.streak.last) ? P.streak.count : 0;
  $('#stStars').textContent = totalStars();
  $('#stLevel').textContent = 'Nivel ' + li.L + ' · ' + li.name + ' · ' + P.xp + ' XP';
  $('#stXp').style.width = Math.round(li.pct * 100) + '%';
  $('#btnSound').textContent = P.muted ? '🔇' : '🔊';
  const due = reviewDueCount();
  $('#dueBadge').textContent = due ? String(due) : '';
}
function isYesterday(s) { if (!s) return false; const y = new Date(Date.now() - DAY); return s === y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0'); }

/* ---------- sunet ---------- */
const Sound = {
  ctx: null,
  c() { if (!this.ctx) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ctx = new A(); } if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },
  tone(f, dur, type, vol, when) {
    if (P.muted) return; const c = this.c(); if (!c) return;
    const t = c.currentTime + (when || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  target() { this.tone(988, 0.09, 'triangle', 0.06); this.tone(1319, 0.12, 'triangle', 0.05, 0.06); },
  ok() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.16, 'triangle', 0.07, i * 0.075)); },
  level() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.2, 'square', 0.035, i * 0.09)); },
  bell() { this.tone(140, 0.11, 'sawtooth', 0.035); },
  wrong() { this.tone(196, 0.22, 'square', 0.04); this.tone(147, 0.28, 'square', 0.035, 0.1); },
  click() { this.tone(660, 0.03, 'sine', 0.015); },
};

/* ---------- utilitare UI ---------- */
let toastT = null;
function toast(msg) { const t = $('#toast'); t.innerHTML = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
function confetti(n) {
  const cols = ['#9ece6a', '#e0af68', '#f7768e', '#7aa2f7', '#bb9af7', '#7dcfff', '#ff9e64'];
  for (let i = 0; i < (n || 90); i++) {
    const d = document.createElement('div'); d.className = 'confetti';
    d.style.left = Math.random() * 100 + 'vw'; d.style.background = cols[i % cols.length];
    d.style.animationDuration = (1.6 + Math.random() * 1.8) + 's'; d.style.animationDelay = (Math.random() * 0.4) + 's';
    d.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
    document.body.appendChild(d); setTimeout(() => d.remove(), 4200);
  }
}
const KEY_LABEL = { '<Esc>': 'Esc', '<CR>': '⏎', '<BS>': '⌫', '<Tab>': 'Tab', '<Del>': 'Del', ' ': '␣', '<Up>': '↑', '<Down>': '↓', '<Left>': '←', '<Right>': '→', '<Home>': 'Home', '<End>': 'End', '<PageUp>': 'PgUp', '<PageDown>': 'PgDn' };
function keyLabel(k) { if (KEY_LABEL[k]) return KEY_LABEL[k]; const m = /^<C-(.)>$/.exec(k); if (m) return 'Ctrl-' + m[1]; return k; }
function keycaps(keys) { return keys.map(k => '<kbd>' + esc(keyLabel(k)) + '</kbd>').join(''); }
// afișează o comandă din lecție (ex. 'd2w', 'W B E', 'Ctrl-v … I', ':wq') ca taste
function cmdCaps(s) {
  if (/^[:\/?]/.test(s)) return '<code>' + esc(s) + '</code>';
  return s.split(' ').map(part => {
    if (part === '/' || part === '…' || part === '+') return '<span style="color:var(--faint)"> ' + part + ' </span>';
    const m = /^(.*?)<(Esc|CR)>$/.exec(part);
    if (m) return (m[1] ? '<kbd>' + esc(m[1]) + '</kbd>' : '') + '<kbd>' + (m[2] === 'Esc' ? 'Esc' : '⏎') + '</kbd>';
    return '<kbd>' + esc(part) + '</kbd>';
  }).join(' ');
}
// pluralul în română: 1 tastă, 5 taste, 20 de taste
function plRo(n, one, many) { return n === 1 ? '1 ' + one : n + (n > 0 && (n % 100 === 0 || n % 100 >= 20) ? ' de ' : ' ') + many; }
function starsHtml(n, max) { let s = ''; for (let i = 0; i < (max || 3); i++) s += '<span class="' + (i < n ? 'on' : 'off') + '">★</span>'; return s; }
function keyToken(e) {
  if (e.isComposing || e.key === 'Dead' || e.key === 'Unidentified' || e.key === 'Process') return null;
  if (e.metaKey) return null;

/* ---------- diff buffer vs. rezultat dorit ---------- */
function lcsPairs(a, b, eq) {

}

}

  const pairs = lcsPairs(cur, goal, (x, y) => x === y);

    const [i0, j0] = bounds[k], [i1, j1] = bounds[k + 1];
    const n = Math.min(i1 - i0 - 1, j1 - j0 - 1);
    for (let t = 0; t < n; t++) {

      const d = cur[i].length + goal[j].length < 400 ? charDiff(cur[i], goal[j]) : { del: new Set(), add: new Set() };
      C[i] = { st: 'mod', del: d.del }; Gd[j] = { st: 'mod', add: d.add };

}

}
function renderLines(opts) {

  let html = '';
  for (let r = 0; r < rows; r++) {
    const y = top + r;
    if (y >= lines.length) { html += '<div class="ln"><span class="gut"></span><span class="tl tilde">~</span></div>'; continue; }
    const line = lines[y], len = line.length;
    const li = opts.lineInfo ? opts.lineInfo(y) : {};

      if (opts.rnu) gut = y === opts.cy ? String(opts.number ? y + 1 : 0) : String(Math.abs(y - opts.cy));

    }
    const sel = opts.sel ? opts.sel(y) : null;
    const hls = opts.hl ? opts.hl(y) : [];

    const cls = new Array(n).fill('');
    if (sel) for (let x = sel[0]; x < Math.min(sel[1], n); x++) cls[x] += ' sel';
    for (const [a, b, inc] of hls) for (let x = a; x < Math.min(b, len); x++) cls[x] += inc ? ' hl inc' : ' hl';

    let body = '', run = '', runC = null;
    const flush = () => { if (run) body += runC ? '<span class="' + runC.trim() + '">' + run + '</span>' : run; run = ''; };
    for (let x = 0; x < n; x++) {
      let ch = x < len ? line[x] : ' ';
      if (x === len && !cls[x]) break;
      let c = cls[x];
      const code = ch.charCodeAt(0);

}

    Sound.level(); if (rec && this.score) confetti(140);
    const again = () => { hideOverlay(); this.start(); }, close = () => { hideOverlay(); this.open(); };
    showOverlay(`<div class="ov-card"><div class="bigicon">${rec && this.score ? '🏆' : '⏱'}</div><h2>${rec && this.score ? 'Record nou!' : 'Timpul a expirat!'}</h2>
      <div class="scorebig">${this.score}</div><p>${plRo(this.solved, 'sarcină rezolvată', 'sarcini rezolvate')} · record: ${P.chBest} · <span class="xp-gain">+${xp} XP</span></p>
      <div class="btns"><button class="btn" id="oClose">Închide <small>(Esc)</small></button><button class="btn primary" id="oAgain">Din nou <small>(Enter)</small></button></div></div>`, { Enter: again, Escape: close });
    $('#oAgain').onclick = again; $('#oClose').onclick = close;
  },
  stop() { this.running = false; clearInterval(this.timer); },
};

/* ---------- 📖 Fițuică ---------- */
function openCheat() {
  $('#view-cheat').innerHTML = `
    <div class="cheat-top"><input id="cheatQ" placeholder="🔎 Caută o comandă sau o descriere… (ex: „șterge”, „ciw”)" autocomplete="off"><span style="color:var(--dim);font-size:13px">✓ = știi bine (verificat la Repetare)</span></div>
    <div class="modes-legend">
      <div><b>NORMAL</b> — tastele sunt comenzi (apeși <kbd>Esc</kbd> ca să ajungi aici)</div>
      <div><b style="color:var(--green)">INSERT</b> — scrii text (<kbd>i</kbd> <kbd>a</kbd> <kbd>o</kbd> …)</div>
      <div><b style="color:var(--purple)">VISUAL</b> — selectezi (<kbd>v</kbd> <kbd>V</kbd> <kbd>Ctrl-v</kbd>)</div>
      <div><b style="color:var(--cyan)">COMMAND</b> — <kbd>:</kbd> <kbd>/</kbd> <kbd>?</kbd> + Enter</div>
      <div><b>Gramatica:</b> [număr] operator [număr] mișcare → <kbd>d3w</kbd> <kbd>2dd</kbd> <kbd>ci"</kbd> <kbd>y$</kbd></div>
    </div>
    <div class="cheat-grid" id="cheatGrid"></div>`;
  const draw = () => {
    const q = $('#cheatQ').value.trim().toLowerCase();
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    $('#cheatGrid').innerHTML = CHAPTERS.map((ch, ci) => {
      const rows = ch.cmds.filter(c => !q || c[0].toLowerCase().includes(q) || norm(c[1]).includes(norm(q)));
      if (!rows.length) return '';
      return `<div class="card"><h3>${ch.icon} ${ci + 1}. ${esc(ch.title)}</h3><table class="cmdtab">${rows.map(c => { const r = P.rev['q:' + ch.id + ':' + c[0]]; return `<tr><td>${cmdCaps(c[0])}</td><td>${c[1]}${r && r.box >= 3 ? '<span class="m-ok">✓</span>' : ''}</td></tr>`; }).join('')}</table></div>`;
    }).join('') || '<p style="color:var(--dim)">Nimic găsit.</p>';
  };
  $('#cheatQ').oninput = draw; draw();
  showView('cheat');
}

/* ---------- tastatură + pornire ---------- */
document.addEventListener('keydown', e => {
  if (e.target && e.target.matches && e.target.matches('input, textarea, select')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (overlayKeys) { const f = overlayKeys[e.key]; if (f) { e.preventDefault(); f(); } else if (e.key !== 'Shift') e.preventDefault(); return; }
  if (currentView === 'play' && Play.active) {
    if (e.ctrlKey && e.key === 'Enter') { if (Play.ctx.onSkip) { e.preventDefault(); Play.active = false; Play.ctx.onSkip(); } return; }
    const t = keyToken(e); if (t) { e.preventDefault(); Play.key(t); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (currentView === 'lessons' && e.key === 'Enter') { const b = $('#hContinue'); if (b) { e.preventDefault(); b.click(); } }
  else if (currentView === 'chapter') { if (e.key === 'Enter') { e.preventDefault(); $('#cStart').click(); } else if (e.key === 'Escape') openLessons(); }
  else if (currentView === 'review') Review.onKey(e);
  else if (currentView === 'challenge' && e.key === 'Enter' && $('#chStart')) { e.preventDefault(); $('#chStart').click(); }
});
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b) b.blur(); });
function init() {
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    hideOverlay(); Challenge.stop();
    const v = b.dataset.view;
    if (v === 'lessons') openLessons(); else if (v === 'review') Review.open(); else if (v === 'challenge') Challenge.open(); else openCheat();
  });
  $('.brand').onclick = () => { hideOverlay(); Challenge.stop(); openLessons(); };
  $('#btnSound').onclick = () => { P.muted = !P.muted; save(); renderStats(); if (!P.muted) Sound.target(); };
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches) $('#mobileNote').classList.remove('hidden');
  renderStats(); openLessons();
  window.VimDojo = { Vim, CHAPTERS, P, Play, Review, Challenge, genTask };
}
init();
</script>
